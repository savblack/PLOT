<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch together: who's watching</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&amp;family=Gabarito:wght@400..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#F8F2EA;color:#292924}
button{font-family:inherit;cursor:pointer}
a{color:#B83558}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F2EA; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'DM Sans', system-ui, sans-serif; color: #292924">

  <div style="display: flex; align-items: center; padding: 16px 16px 0">
    <a href="Hub.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 9999px; border: 1px solid rgba(41,41,36,0.16); background: #FFFCF7; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#292924" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
  </div>

  <div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: 'Gabarito', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.05">Who’s watching?</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #5F5A52">Choose one person to vote yes or no together, or a few to see what you’ve all saved.</p>
  </div>

  <fieldset style="margin: 16px 20px 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
    <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">People</legend>
    <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
      <label style="{{p.rowStyle}}">
        <span style="{{p.avatar}}">{{p.initial}}</span>
        <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
          <span style="font-weight: 600; font-size: 15px">{{p.name}}</span>
          <span style="font-size: 12px; color: #6B655D">{{p.detail}}</span>
        </span>
        <input type="checkbox" checked="{{p.on}}" disabled="{{p.pending}}" onChange="{{p.toggle}}" style="width: 22px; height: 22px; margin: 0; accent-color: #E05578">
      </label>
    </sc-for>
  </fieldset>

  <a href="Invite.dc.html" style="margin: 16px 20px 0; align-self: center; font-size: 13px; font-weight: 600">Invite someone new</a>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 24px; background: #F8F2EA; border-top: 1px solid rgba(41,41,36,0.08); display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; color: #5F5A52; text-align: center">{{summary}}</span>
    <sc-if value="{{none}}" hint-placeholder-val="{{ false }}">
      <span style="height: 50px; border-radius: 9999px; background: #F1E9DC; color: #6B655D; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center">Choose someone</span>
    </sc-if>
    <sc-if value="{{one}}" hint-placeholder-val="{{ true }}">
      <a href="Session.dc.html" style="height: 50px; border-radius: 9999px; background: #FF88C8; color: #292924; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; text-decoration: none">Decide together</a>
      <a href="Main.dc.html" style="font-size: 13px; font-weight: 600; text-align: center">Or browse what you both saved</a>
    </sc-if>
    <sc-if value="{{group}}" hint-placeholder-val="{{ false }}">
      <a href="Vote.dc.html" style="height: 50px; border-radius: 9999px; background: #FF88C8; color: #292924; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; text-decoration: none">See group matches</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"preset":{"editor":"enum","options":["none","one","group"],"default":"one"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const presets = { none: {}, one: { sam: true }, group: { sam: true, priya: true } };
    this.state = { picked: presets[props.preset ?? 'one'] || presets.one };
  }
  renderVals() {
    const av = (bg) => 'width: 44px; height: 44px; flex-shrink: 0; border-radius: 9999px; background: ' + bg + '; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: #292924';
    const base = [
      { id: 'sam', name: 'Sam', initial: 'S', detail: '14 on both watchlists', bg: '#DBE1B0' },
      { id: 'priya', name: 'Priya', initial: 'P', detail: '9 on both watchlists', bg: '#F1E9DC' },
      { id: 'jess', name: 'Jess', initial: 'J', detail: '6 on both watchlists', bg: '#FF88C8' },
      { id: 'jo', name: 'Jo', initial: 'J', detail: 'Request sent · can join once they accept', bg: '#E4DCCF', pending: true },
    ];
    const people = base.map((p) => {
      const on = !p.pending && !!this.state.picked[p.id];
      return {
        ...p, on, pending: !!p.pending, avatar: av(p.bg),
        rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 16px; min-height: 64px; box-sizing: border-box; cursor: ' + (p.pending ? 'default; opacity: 0.6' : 'pointer') + '; background: #FFFCF7; border: 1px solid ' + (on ? '#E05578' : 'rgba(41,41,36,0.08)'),
        toggle: () => this.setState((s) => ({ picked: { ...s.picked, [p.id]: !s.picked[p.id] } })),
      };
    });
    const chosen = people.filter((p) => p.on).map((p) => p.name);
    const n = chosen.length;
    const names = n <= 1 ? chosen.join('') : chosen.slice(0, -1).join(', ') + ' and ' + chosen[n - 1];
    return {
      people, none: n === 0, one: n === 1, group: n > 1,
      summary: n === 0 ? 'Nobody chosen yet' : n === 1 ? 'You and ' + names + ' · swipe through what you’ve both saved' : 'You, ' + names + ' · everything you’ve saved in common',
    };
  }
}
</script>
</body>
</html>
