<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch together: entry on a friend's profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&amp;family=Gabarito:wght@400..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#F8F2EA;color:#292924}
button{font-family:inherit;cursor:pointer}
a{color:#B83558}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F2EA; display: flex; flex-direction: column; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: #292924">

  <div style="display: flex; align-items: center; padding: 16px 16px 0">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; border-radius: 9999px; border: 1px solid rgba(41,41,36,0.16); background: #FFFCF7; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#292924" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
  </div>

  <div style="padding: 12px 20px 0; display: flex; align-items: center; gap: 14px">
    <span style="width: 64px; height: 64px; border-radius: 9999px; background: #DBE1B0; font-family: 'Gabarito', sans-serif; font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center">S</span>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Gabarito', sans-serif; font-weight: 700; font-size: 24px">Sam</span>
      <span style="font-size: 13px; color: #5F5A52">@sam · Follows you</span>
    </div>
  </div>

  <div style="margin: 16px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="padding: 10px; border-radius: 16px; background: #FFFCF7; border: 1px solid rgba(41,41,36,0.08); display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 18px">312</span><span style="font-size: 12px; color: #5F5A52">Watched</span></div>
    <div style="padding: 10px; border-radius: 16px; background: #FFFCF7; border: 1px solid rgba(41,41,36,0.08); display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 18px">66</span><span style="font-size: 12px; color: #5F5A52">Watchlist</span></div>
    <div style="padding: 10px; border-radius: 16px; background: #FFFCF7; border: 1px solid rgba(41,41,36,0.08); display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 18px">4</span><span style="font-size: 12px; color: #5F5A52">Lists</span></div>
  </div>

  <div style="margin: 16px 20px 0">
    <dc-import name="InviteTile" mode="{{mode}}" hint-size="350px,328px"></dc-import>
  </div>

  <div style="padding: 20px 20px 8px; font-size: 13px; font-weight: 600; color: #5F5A52">Recently watched</div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 0 20px">
    <span style="aspect-ratio: 2 / 3; border-radius: 10px; background: #4A4A58"></span>
    <span style="aspect-ratio: 2 / 3; border-radius: 10px; background: #6E3A2E"></span>
    <span style="aspect-ratio: 2 / 3; border-radius: 10px; background: #3F5E77"></span>
    <span style="aspect-ratio: 2 / 3; border-radius: 10px; background: #3D4B3A"></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["free","public","private","pending","paired"],"default":"public"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { mode: this.props.mode ?? 'public' }; }
}
</script>
</body>
</html>
