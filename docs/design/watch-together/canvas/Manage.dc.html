<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch together: privacy settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&amp;family=Gabarito:wght@400..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#F8F2EA;color:#292924}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #F8F2EA; display: flex; flex-direction: column; gap: 14px; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: #292924">
  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 0">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; border-radius: 9999px; border: 1px solid rgba(41,41,36,0.16); background: #FFFCF7; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#292924" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <span style="font-size: 13px; color: #5F5A52">Settings › Privacy</span>
  </div>
  <h1 style="margin: 0 20px; font-family: 'Gabarito', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.05">Watch together</h1>

  <div style="margin: 0 20px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 600; color: #5F5A52">Requests</span>
    <div style="padding: 12px 14px; border-radius: 16px; background: #FFFCF7; border: 1px solid rgba(41,41,36,0.08); display: flex; align-items: center; gap: 12px">
      <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 9999px; background: #E4DCCF; display: flex; align-items: center; justify-content: center; font-weight: 700">A</span>
      <span style="flex-grow: 1; font-size: 14px"><strong>Alex</strong> · 3 days ago</span>
      <button type="button" style="height: 36px; padding: 0 12px; border: 0; border-radius: 9999px; background: #292924; color: #FFFCF7; font-size: 13px; font-weight: 700">Review</button>
    </div>
  </div>

  <div style="margin: 0 20px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 600; color: #5F5A52">Watching together with</span>
    <sc-for list="{{partners}}" as="p" hint-placeholder-count="2">
      <div style="padding: 14px; border-radius: 16px; background: #FFFCF7; border: 1px solid rgba(41,41,36,0.08); display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="{{p.avatar}}">{{p.initial}}</span>
          <div style="display: flex; flex-direction: column; flex-grow: 1">
            <span style="font-weight: 600; font-size: 15px">{{p.name}}</span>
            <span style="font-size: 12px; color: #6B655D">{{p.since}}</span>
          </div>
          <button type="button" style="height: 36px; padding: 0 12px; border-radius: 9999px; border: 1px solid rgba(185,56,74,0.22); background: transparent; color: #B9384A; font-size: 13px; font-weight: 600">Stop</button>
        </div>
        <sc-if value="{{isPrivate}}" hint-placeholder-val="{{ true }}">
        <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; cursor: pointer; border-top: 1px solid rgba(41,41,36,0.08); padding-top: 12px">
          <span>Share my full watchlist</span>
          <input type="checkbox" checked="{{p.full}}" onChange="{{p.toggle}}" style="width: 22px; height: 22px; margin: 0; accent-color: #E05578">
        </label>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <fieldset style="margin: 0 20px; padding: 14px 16px; border-radius: 16px; background: #FFFCF7; border: 1px solid rgba(41,41,36,0.08); display: flex; flex-direction: column; gap: 4px">
    <legend style="font-size: 13px; font-weight: 600; color: #5F5A52; padding: 0; margin-bottom: 8px; float: left; width: 100%">Who can send you requests</legend>
    <sc-for list="{{who}}" as="w" hint-placeholder-count="3">
      <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 14px; cursor: pointer">
        <input type="radio" name="who" checked="{{w.on}}" onChange="{{w.pick}}" style="width: 20px; height: 20px; margin: 0; accent-color: #E05578">
        {{w.label}}
      </label>
    </sc-for>
  </fieldset>

  <p style="margin: 0 20px; font-size: 12px; line-height: 1.5; color: #6B655D">Stopping takes effect straight away. The other person stops seeing your overlap and isn’t notified. Blocking someone also stops watching together.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"profile":{"editor":"enum","options":["private","public"],"default":"private"},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { full: { jess: false, priya: true }, who: 'profile' }; }
  renderVals() {
    const av = (bg) => 'width: 40px; height: 40px; flex-shrink: 0; border-radius: 9999px; background: ' + bg + '; display: flex; align-items: center; justify-content: center; font-weight: 700';
    const partners = [
      { id: 'jess', name: 'Jess', initial: 'J', since: 'Since today · 14 in common', bg: '#FF88C8' },
      { id: 'priya', name: 'Priya', initial: 'P', since: 'Since August · 9 in common', bg: '#F1E9DC' },
    ].map((p) => ({ ...p, avatar: av(p.bg), full: !!this.state.full[p.id], toggle: () => this.setState((s) => ({ full: { ...s.full, [p.id]: !s.full[p.id] } })) }));
    const who = [
      { id: 'profile', label: 'Anyone who can see my profile' },
      { id: 'following', label: 'Only people I follow' },
      { id: 'none', label: 'No one' },
    ].map((w) => ({ ...w, on: this.state.who === w.id, pick: () => this.setState({ who: w.id }) }));
    return { partners, who, isPrivate: (this.props.profile ?? 'private') !== 'public' };
  }
}
</script>
</body>
</html>
