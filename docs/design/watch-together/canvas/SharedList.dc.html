<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch together: shared list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&amp;family=Gabarito:wght@400..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#F8F2EA;color:#292924}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F2EA; display: flex; flex-direction: column; overflow: hidden; position: relative; font-family: 'DM Sans', system-ui, sans-serif; color: #292924">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 0">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 9999px; border: 1px solid rgba(41,41,36,0.16); background: #FFFCF7; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#292924" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <button type="button" aria-label="List options" aria-expanded="{{menuOpen}}" onClick="{{toggleMenu}}" style="width: 44px; height: 44px; border-radius: 9999px; border: 1px solid rgba(41,41,36,0.16); background: #FFFCF7; display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#292924"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
    </button>
  </div>

  <div style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <span style="align-self: flex-start; font-size: 12px; font-weight: 700; color: #5F7030; background: rgba(95,112,48,0.12); padding: 4px 10px; border-radius: 9999px">Shared</span>
    <h1 style="margin: 0; font-family: 'Gabarito', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.05">{{listName}}</h1>
    <div style="display: flex; align-items: center; gap: 8px">
      <div style="display: flex">
        <span style="width: 28px; height: 28px; border-radius: 9999px; background: #FF88C8; border: 2px solid #F8F2EA; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">You</span>
        <span style="width: 28px; height: 28px; border-radius: 9999px; background: #DBE1B0; border: 2px solid #F8F2EA; margin-left: -8px; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{otherInitial}}</span>
      </div>
      <span style="font-size: 13px; color: #5F5A52">16 titles · You can both add and remove</span>
    </div>
  </div>

  <div style="padding: 16px 20px 0">
    <button type="button" style="width: 100%; height: 44px; border-radius: 9999px; border: 1px dashed rgba(41,41,36,0.3); background: transparent; font-size: 14px; font-weight: 600; color: #292924">+ Add a title</button>
  </div>

  <div style="display: flex; flex-direction: column; padding: 12px 20px 0">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid rgba(41,41,36,0.08)">
        <span style="{{r.poster}}"></span>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
          <span style="font-weight: 600; font-size: 15px">{{r.title}}</span>
          <span style="font-size: 12px; color: #6B655D">{{r.meta}}</span>
        </div>
        <span style="font-size: 12px; color: #5F5A52; white-space: nowrap">{{r.by}}</span>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
    <div role="menu" aria-label="List options" style="position: absolute; top: 68px; right: 16px; width: 220px; padding: 6px; border-radius: 16px; background: #FFFFFF; border: 1px solid rgba(41,41,36,0.16); display: flex; flex-direction: column">
      <button type="button" role="menuitem" style="height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; text-align: left; font-size: 14px; color: #292924">Rename</button>
      <button type="button" role="menuitem" style="height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; text-align: left; font-size: 14px; color: #292924">Add people</button>
      <sc-if value="{{isCreator}}" hint-placeholder-val="{{ true }}">
        <button type="button" role="menuitem" style="height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; text-align: left; font-size: 14px; color: #B9384A">Delete list</button>
      </sc-if>
      <sc-if value="{{isMember}}" hint-placeholder-val="{{ false }}">
        <button type="button" role="menuitem" style="height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; text-align: left; font-size: 14px; color: #B9384A">Leave list</button>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"viewer":{"editor":"enum","options":["creator","member"],"default":"creator"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { menu: true }; }
  renderVals() {
    const creator = (this.props.viewer ?? 'creator') === 'creator';
    const other = creator ? 'Sam' : 'Jess';
    const poster = (bg) => 'width: 40px; height: 60px; flex-shrink: 0; border-radius: 8px; background: ' + bg;
    const rows = [
      ['Hundreds of Beavers', '2022 · 1h 48m', other + ' added', '#5C5446'],
      ['Monster', '2023 · 2h 7m', 'You added', '#4E5A48'],
      ['Past Lives', '2023 · 1h 46m', 'Both saved', '#2F3B52'],
      ['Paddington 2', '2017 · 1h 43m', 'Both saved', '#A8683E'],
      ['Aftersun', '2022 · 1h 42m', 'Both saved', '#3E6A70'],
    ].map(([title, meta, by, bg]) => ({ title, meta, by, poster: poster(bg) }));
    return {
      rows, isCreator: creator, isMember: !creator,
      listName: 'Jess and Sam',
      otherInitial: other[0],
      menuOpen: this.state.menu,
      toggleMenu: () => this.setState((s) => ({ menu: !s.menu })),
    };
  }
}
</script>
</body>
</html>
