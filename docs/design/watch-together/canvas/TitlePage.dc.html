<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch together: saved by Sam too on a title page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&amp;family=Gabarito:wght@400..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#F8F2EA;color:#292924}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F8F2EA; display: flex; flex-direction: column; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: #292924">

  <div style="position: relative; height: 300px; background: #2F3B52; display: flex; align-items: flex-end; padding: 20px; box-sizing: border-box">
    <button type="button" aria-label="Back" style="position: absolute; top: 16px; left: 16px; width: 44px; height: 44px; border-radius: 9999px; border: 0; background: rgba(255,252,247,0.9); display: flex; align-items: center; justify-content: center; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#292924" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'Gabarito', sans-serif; font-weight: 700; font-size: 36px; line-height: 1; color: #FFFCF7">Past Lives</span>
      <span style="font-size: 14px; color: rgba(255,252,247,0.86)">2023 · 1h 46m · Drama</span>
    </div>
  </div>

  <div style="padding: 16px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <button type="button" style="height: 44px; border-radius: 9999px; border: 0; background: #292924; color: #FFFCF7; font-size: 14px; font-weight: 700">✓ On your watchlist</button>
    <button type="button" style="height: 44px; border-radius: 9999px; border: 1px solid rgba(41,41,36,0.16); background: #FFFCF7; color: #292924; font-size: 14px; font-weight: 600">Rate</button>
  </div>

  <div style="margin: 16px 20px 0; display: flex; flex-direction: column; gap: 10px">
    <a href="{{savedHref}}" style="padding: 18px 16px 18px 20px; border-radius: 24px; background: #F1E9DC; display: flex; align-items: center; gap: 12px; color: #292924; text-decoration: none">
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <span style="font-family: 'Gabarito', sans-serif; font-weight: 700; font-size: 20px">{{savedTitle}}</span>
        <span style="font-size: 12px; color: #5F5A52">{{savedSub}}</span>
      </span>
      <span style="display: flex" aria-hidden="true">
        <span style="width: 40px; height: 40px; border-radius: 9999px; background: #DBE1B0; border: 2px solid #F1E9DC; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">S</span>
        <sc-if value="{{two}}" hint-placeholder-val="{{ false }}">
          <span style="width: 40px; height: 40px; border-radius: 9999px; background: #FFFCF7; border: 2px solid #F1E9DC; margin-left: -12px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">P</span>
        </sc-if>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#292924" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
    </a>

    <a href="#where-to-watch" style="padding: 18px 16px 18px 20px; border-radius: 24px; background: #F1E9DC; display: flex; align-items: center; gap: 12px; color: #292924; text-decoration: none">
      <span style="font-family: 'Gabarito', sans-serif; font-weight: 700; font-size: 20px; flex-grow: 1">Where to watch</span>
      <span style="display: flex" aria-hidden="true">
        <span style="width: 40px; height: 40px; border-radius: 9999px; background: #141413; border: 2px solid #F1E9DC"></span>
        <span style="width: 40px; height: 40px; border-radius: 9999px; background: #2B2B28; border: 2px solid #F1E9DC; margin-left: -12px"></span>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#292924" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"></path></svg>
    </a>
  </div>

  <p style="margin: 18px 20px 0; font-size: 14px; line-height: 1.55; color: #292924">[Synopsis from TMDB]</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"savers":{"editor":"enum","options":["one","two"],"default":"one"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const two = (this.props.savers ?? 'one') === 'two';
    return {
      two,
      savedTitle: two ? 'Saved by Sam and Priya too' : 'Saved by Sam too',
      savedSub: two ? 'Decide what to watch together' : 'On both your watchlists',
      savedHref: two ? 'Picker.dc.html' : 'Main.dc.html',
    };
  }
}
</script>
</body>
</html>
