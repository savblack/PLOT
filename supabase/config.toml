# Supabase CLI configuration.
#
# Primary purpose of committing this file: pin `verify_jwt` per Edge Function so
# `supabase functions deploy <name>` reproduces the intended public/private
# state even if someone forgets the `--no-verify-jwt` flag. Forgetting that flag
# on a redeploy is exactly what took theplot.tv/whats-on down — Supabase's
# gateway rejected the request with UNAUTHORIZED_NO_AUTH_HEADER before the
# function ran. See marketing/README.md.

project_id = "mkegtssedjyqldysvzga"

# --- Public functions: reachable without a Supabase JWT ---------------------
# These either serve fully public content (marketing-feed) or do their own
# token / service-role auth internally (calendar-feed uses a URL token). With
# verify_jwt left at its default of true, the gateway rejects unauthenticated
# requests before the function runs.

[functions.marketing-feed]
verify_jwt = false

# Public title pages (theplot.tv/movie|tv/<slug>) — must render for crawlers and
# logged-out visitors, so reachable without a JWT.
[functions.title-page]
verify_jwt = false

[functions.newsletter-subscribe]
verify_jwt = false

# Exceptional signup path for browsers where Turnstile has persistently
# failed — no session exists yet when this is called (that's the point), so
# the gateway JWT check can't apply. Does its own bot mitigation (honeypot,
# submit timing, per-IP rate limit) instead. See supabase/functions/signup-bypass.
[functions.signup-bypass]
verify_jwt = false

[functions.calendar-feed]
verify_jwt = false

# Stripe webhook — Stripe signs requests with STRIPE_WEBHOOK_SECRET; there is
# no Supabase JWT on deliveries, so the gateway must let them through. With
# verify_jwt = true every delivery dies at the gateway with 401 and billing
# state silently stops updating.
[functions.stripe-webhook]
verify_jwt = false

# Notion mirror sweep. pg_cron posts the Vault
# service-role bearer, so verify_jwt stays true. The function no-ops until
# NOTION_TOKEN and NOTION_MARKETING_DATABASE_ID are set, which is how it can
# be scheduled before the database exists.
[functions.marketing-notion-mirror]
verify_jwt = true

# Notion webhook. Notion signs the body and sends no Supabase JWT, so the
# gateway has to let the delivery through. The HMAC inside the function is
# the auth. Unsigned traffic is refused except for the one-time verification
# handshake, which writes nothing.
[functions.marketing-notion-sync]
verify_jwt = false

# Ko-fi webhook — Ko-fi sends no Supabase JWT and no signature header; it
# authenticates with the verification_token inside the form body, checked
# inside the function. With verify_jwt = true every tip dies at the gateway
# with 401 and supporters are silently never recorded.
[functions.kofi-webhook]
verify_jwt = false

# --- Authenticated functions: require a Supabase JWT ------------------------
# Declared explicitly (verify_jwt = true is the CLI default) so this file is a
# complete source of truth and no function silently relies on the default.

[functions.tmdb-proxy]
verify_jwt = true

[functions.watch-availability]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.export-user-data]
verify_jwt = true

[functions.media-sync]
verify_jwt = true

[functions.notify-feedback]
verify_jwt = true

# Report intake — invoked by the on_report_insert trigger via
# notify_edge_function, which sends the service-role bearer. Not public: the
# function also checks hasServiceRoleBearer, so verify_jwt staying true is
# belt and braces rather than the only gate.
[functions.notify-report]
verify_jwt = true

# Signup notifier — invoked by the trg_notify_new_signup trigger on auth.users
# (see supabase/notify-signup-trigger.sql). The trigger reads the service-role
# key from Vault and sends it as the bearer, so verify_jwt stays true and the
# gateway rejects anything unsigned.
[functions.notify-signup]
verify_jwt = true

# Onboarding event and the hourly lifecycle attribute sync. Signed-in callers
# send onboarding_completed. pg_cron calls it with the Vault service-role
# bearer (run_brevo_lifecycle_sync). verify_jwt stays true; the handler also
# checks hasServiceRoleBearer before it will sync anyone but the caller.
[functions.brevo-lifecycle]
verify_jwt = true

# Profile-change notifier for Brevo sync — invoked by a Database Webhook on
# public.profiles (INSERT + UPDATE), configured via the Supabase dashboard.
# The dashboard's own service-role auth option supplies the bearer, so
# verify_jwt stays true and the gateway rejects anything unsigned.
[functions.profiles-changed]
verify_jwt = true

[functions.trakt-sync]
verify_jwt = true

[functions.simkl-sync]
verify_jwt = true

[functions.stripe-billing]
verify_jwt = true

# Public "can this caller check out?" read. verify_jwt stays false: signed-out
# plans pages call it with the publishable key, which is not a JWT the gateway
# would accept. The handler checks a user bearer with Auth getUser and returns
# only a boolean. See supabase/functions/billing-availability/index.ts.
[functions.billing-availability]
verify_jwt = false

# New-episode notifications — daily at 12:00 UTC, called by pg_cron via pg_net
# with the Vault service-role bearer (run_new_episode_notifications), so
# verify_jwt stays true. Declared because a new function without an entry here
# can be silently skipped by the deploy integration.
[functions.new-episode-notifications]
verify_jwt = true

# Movie release notifications: called daily by pg_cron via pg_net with the Vault
# service-role bearer (run_movie_release_notifications, 20261003090000), so
# verify_jwt stays true and the handler also requires the service role.
# Declared because a new function without an entry here can be silently skipped
# by the deploy integration.
[functions.movie-release-notifications]
verify_jwt = true

# Premium streaming-arrival alerts ("now on your service", "now free"): called
# daily by pg_cron via pg_net with the Vault service-role bearer
# (run_streaming_arrival_alerts, 20261004090000), so verify_jwt stays true and
# the handler also requires the service role. Declared because a new function
# without an entry here can be silently skipped by the deploy integration.
[functions.streaming-arrival-alerts]
verify_jwt = true

# Records streaming_alert_set and episode_alert_set in Brevo after the
# in-app prompt or toast has already written the alert. Called from the
# browser with the user's bearer. Needs BREVO_API_KEY. Declared because a
# new function without an entry here can be silently skipped by the deploy
# integration.
[functions.alert-brevo-event]
verify_jwt = true

# Premium email alerts: called daily by pg_cron via pg_net with the Vault
# service-role bearer (run_alert_email_delivery, 20261006090000), so verify_jwt
# stays true and the handler also requires the service role. Declared because a
# new function without an entry here can be silently skipped by the deploy
# integration.
[functions.alert-email-delivery]
verify_jwt = true

# Private push jobs use the service-role bearer and verify it again in code.
[functions.send-push]
verify_jwt = true

[functions.push-receipts]
verify_jwt = true

# The unsubscribe link at the bottom of every alert email. Opened from an email
# client with no session, so it must be reachable without a JWT. It trusts only a
# signed token (ALERT_EMAIL_UNSUBSCRIBE_SECRET) and reflects nothing from the
# request, and it can only ever turn alert email OFF.
[functions.alert-email-unsubscribe]
verify_jwt = false

# Private worker also verifies the exact service credential in its handler.
# Private worker authenticates the exact service secret in its handler.
# Rotated sb_secret keys are not user JWTs.
[functions.tracking-worker]
verify_jwt = false

# Background watch-history imports (import_jobs). Called by pg_cron via pg_net
# with the Vault service bearer (run_import_worker_tick, 20261015090000) and
# by the app with the user's own JWT to nudge their job along. The handler
# verifies both in code (hasServiceKeyBearer, then auth.getUser), so the
# gateway check is off like tracking-worker. Needs TMDB_API_KEY, and the same
# IMPORT_EVENTS_ENABLED / IMPORT_ANNOTATIONS_ENABLED flags the apps read.
[functions.import-worker]
verify_jwt = false

# Premium alerts (actor/director releases, whole-season-ready): called twice a
# day by pg_cron via pg_net with the Vault service-role bearer
# (run_premium_alerts, 20260928120000), so verify_jwt stays true and the
# handler also requires the service role. Declared because a new function
# without an entry here can be silently skipped by the deploy integration.
[functions.premium-alerts]
verify_jwt = true

# Weekly smart lists roll-up: called on Sundays by pg_cron via pg_net with the
# Vault service-role bearer (run_smart_list_digest, 20261002180000), so
# verify_jwt stays true and the handler also requires the service role.
[functions.smart-list-digest]
verify_jwt = true

# Following people: refreshes people_feed for one person right after a Premium
# member follows them. Called from the browser with the user's own bearer, so
# verify_jwt stays true; the handler checks the follow and is_premium().
[functions.people-feed-refresh]
verify_jwt = true

# Critic score lookup (OMDb via the critic_scores cache). Called with the anon
# key like tmdb-proxy, so the gateway requires a signed JWT the same way; the
# function rate-limits per caller on top. Declared on 2026-10-14 so a deploy
# never falls back to the default for this one function.
[functions.critic-score]
verify_jwt = true
