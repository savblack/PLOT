<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* PLOT Ko-fi cover, 1200x300 — variant I: variant B's hairline structure with
     the kicker reset in Instrument Serif, so the whole banner is one typeface. */
  @font-face { font-family: 'Instrument Serif'; src: url('../../apps/web/public/fonts/InstrumentSerif-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 300px; overflow: hidden;
    background: #FFFFFF; color: #0C0C0E;
    font-family: 'Instrument Serif', Georgia, serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    /* Optical centring, measured not guessed: Instrument Serif caps are
       0.735em with the baseline at 0.84em, and padding on a centred flex
       container shifts content by only half its value. */
    padding-bottom: 8px;
  }
  .row { display: flex; align-items: center; gap: 48px; width: 100%; padding: 0 90px; }
  .rule { flex: 1; height: 1px; background: rgba(12,12,14,0.18); }
  /* The wordmark spec: Instrument Serif 400 at -0.05em. CSS applies tracking
     after the final T too, so with negative tracking the box lands 0.05em
     narrower than the ink; the positive margin adds it back and the glyphs
     sit optically centred between the two rules. (The kicker tracks positive,
     so it compensates negative.) */
  .wordmark {
    font-weight: 400; font-size: 118px; line-height: 1;
    letter-spacing: -0.05em; margin-right: 0.05em;
  }
  .kicker {
    margin-top: 26px;
    font-size: 25px; line-height: 1; letter-spacing: 0.34em;
    text-transform: uppercase; color: rgba(12,12,14,0.52);
    margin-right: -0.34em;
  }
</style>
</head>
<body>
  <div class="row">
    <div class="rule"></div>
    <div class="wordmark">PLOT</div>
    <div class="rule"></div>
  </div>
  <div class="kicker">Film&nbsp;&nbsp;·&nbsp;&nbsp;Television&nbsp;&nbsp;·&nbsp;&nbsp;Your Watchlist</div>
</body>
</html>
