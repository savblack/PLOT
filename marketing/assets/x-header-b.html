<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Rendered by render-x-header.mjs via page.goto(file://...) — a real file
     navigation, so a relative path resolves correctly (same font files as
     apps/web/public/fonts). */
  @font-face { font-family: 'DM Sans'; src: url('../../apps/web/public/fonts/DMSans-Variable.ttf') format('truetype-variations'); font-weight: 100 900; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Instrument Serif'; src: url('../../apps/web/public/fonts/InstrumentSerif-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Instrument Serif'; src: url('../../apps/web/public/fonts/InstrumentSerif-Italic.ttf') format('truetype'); font-weight: 400; font-style: italic; font-display: swap; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1500px; height: 500px; overflow: hidden;
    background: #0C0C0E; color: #FAFAFA;
    font-family: 'DM Sans', system-ui, sans-serif; position: relative;
  }
  .glow { position: absolute; inset: 0; z-index: 0;
    background: radial-gradient(55% 120% at 78% 40%, rgba(240,106,136,0.18) 0%, rgba(240,106,136,0) 60%); }
  .grain { position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0.05;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 200px 200px; }

  /* tilted stack of poster cards, far right — product flavour without real titles */
  .posters { position: absolute; right: -30px; top: 50%; z-index: 1;
    transform: translateY(-50%) rotate(-9deg); display: flex; gap: 30px; }
  .poster { width: 168px; height: 252px; border-radius: 16px;
    background: #1B1B20; border: 1px solid rgba(250,250,250,0.07);
    box-shadow: 0 36px 70px rgba(0,0,0,0.55); }
  .poster:nth-child(1) { margin-top: 64px; }
  .poster:nth-child(2) { margin-top: 0; }
  .poster:nth-child(3) { margin-top: 64px;
    background: linear-gradient(165deg, #F06A88 0%, #c64f6a 100%); border-color: transparent; }
  .poster:nth-child(4) { margin-top: 128px; }
  /* right-edge fade so the stack dissolves into the background */
  .fade { position: absolute; inset: 0; z-index: 2;
    background: linear-gradient(to right, #0C0C0E 28%, rgba(12,12,14,0.55) 52%, rgba(12,12,14,0) 78%); }

  .wrap { position: absolute; left: 300px; right: 560px; top: 50%; z-index: 3;
    transform: translateY(-50%); }
  .kicker { font-size: 21px; font-weight: 500; letter-spacing: 0.28em;
    text-transform: uppercase; color: rgba(250,250,250,0.52); margin-bottom: 24px; }
  .headline { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400;
    font-size: 96px; line-height: 0.94; letter-spacing: -0.02em; }
  .headline em { font-style: italic; color: #F06A88; letter-spacing: -0.01em; word-spacing: 0.05em; }
  .url { position: absolute; left: 302px; bottom: 40px; z-index: 4;
    font-size: 24px; font-weight: 200; letter-spacing: 0.04em; color: rgba(250,250,250,0.6); }
  .url b { color: #F06A88; font-weight: 400; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="posters">
    <div class="poster"></div>
    <div class="poster"></div>
    <div class="poster"></div>
    <div class="poster"></div>
  </div>
  <div class="fade"></div>
  <div class="wrap">
    <div class="kicker">Track · Rank · Discover</div>
    <div class="headline">Your watchlist,<br><em>with a plot.</em></div>
  </div>
  <div class="url"><b>◆</b>&nbsp; theplot.tv</div>
  <div class="grain"></div>
</body>
</html>
