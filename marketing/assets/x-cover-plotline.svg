<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- plot X cover — "the plot line": the wordmark rests on a fine narrative story-arc
       (rise → climax → fall) with plot-point dots. A visual pun on the name. -->
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <radialGradient id="warm" cx="52%" cy="42%" r="62%">
      <stop offset="44%" stop-color="#f8f2ea" stop-opacity="0"/>
      <stop offset="100%" stop-color="#e6dccb" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
  <rect width="1500" height="500" fill="#f8f2ea"/>
  <rect width="1500" height="500" fill="url(#warm)"/>

  <!-- narrative arc + plot points -->
  <g fill="none" stroke="#292924" stroke-opacity="0.55" stroke-width="3">
    <path d="M320 458 C 500 458 560 432 700 426 C 800 421 840 410 940 410 C 1050 410 1110 446 1240 456"/>
  </g>
  <g fill="#292924" fill-opacity="0.62">
    <circle cx="320" cy="458" r="6"/>
    <circle cx="700" cy="426" r="6"/>
    <circle cx="940" cy="410" r="7"/>
    <circle cx="1240" cy="456" r="6"/>
  </g>

