<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* PLOT Ko-fi cover, 1200x300 — variant N: wordmark centred with the Manrope
     line beneath. Ink on white, no art.
     Rendered by render-kofi-banner.mjs via page.goto(file://...), so the
     relative font paths resolve. */
  @font-face { font-family: 'Instrument Serif'; src: url('../../apps/web/public/fonts/InstrumentSerif-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
  @font-face { font-family: 'Manrope'; src: url('../../apps/web/fonts/Manrope/Manrope-VariableFont_wght.ttf') format('truetype-variations'); font-weight: 200 800; font-style: normal; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 300px; overflow: hidden;
    background: #FFFFFF; color: #0C0C0E;
    font-family: 'Instrument Serif', Georgia, serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    /* Optical centring, measured from the rendered pixels: this two-line group
       lands ~6px low (a cap-high wordmark over a line with descenders), and
       padding on a centred flex column shifts content by only half its value. */
    padding-bottom: 16px;
  }
  /* The wordmark spec: Instrument Serif 400 at -0.05em. CSS applies tracking
     after the final T too, so with negative tracking the box lands 0.05em
     narrower than the ink; the positive margin adds it back and the glyphs
     sit optically centred. */
  .wordmark {
    font-weight: 400; font-size: 128px; line-height: 1;
    letter-spacing: -0.05em; margin-right: 0.05em;
  }
  /* Manrope carries a bigger x-height than Instrument Serif, so it sets smaller
     than the serif would here and still reads as the larger of the two faces. */
  .line {
    margin-top: 18px;
    font-family: 'Manrope', system-ui, sans-serif; font-weight: 500;
    font-size: 30px; line-height: 1; letter-spacing: 0.005em;
    color: rgba(12,12,14,0.62);
    margin-right: -0.005em;
  }
</style>
</head>
<body>
  <div class="wordmark">PLOT</div>
  <div class="line">Your film &amp; TV companion</div>
</body>
</html>
