<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* PLOT Ko-fi cover, 1200x400 — variant O: the two-sided idea done with type
     only. Wordmark hard left, the line hard right, both sitting on one baseline,
     so the line reads off the foot of the wordmark across the full width.

     3:1 at Ko-fi's recommended 1200x400. An earlier 4:1 cut got scaled to fill
     the height and lost about a quarter of its width, cutting the P off. Ko-fi
     also crops the sides further on narrow viewports, so the type sits 120px in
     (10% of the width) rather than hugging the edges. */
  @font-face { font-family: 'Instrument Serif'; src: url('../../apps/web/public/fonts/InstrumentSerif-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 400px; overflow: hidden;
    background: #FFFFFF; color: #0C0C0E;
    font-family: 'Instrument Serif', Georgia, serif;
    display: flex; align-items: center; justify-content: center;
    /* Optical centring: baseline alignment puts the shared baseline 0.84em down
       the wordmark's line box, which leaves its caps 4.7px above the frame's
       centre. Padding on a centred flex container shifts content by half its
       value, so 9px brings the wordmark back to centre. Measured, not guessed. */
    padding-top: 9px;
  }
  /* One baseline for both faces via align-items: baseline. It needs to sit in a
     row the body can centre vertically, because a baseline-aligned flex container
     pins its baseline band to its own top rather than centring it. */
  .row {
    display: flex; align-items: baseline; justify-content: space-between;
    width: 100%; padding: 0 117px 0 120px;  /* right trimmed so both ink edges land ~118px in */
  }
  /* The wordmark spec: Instrument Serif 400 at -0.05em. Left-aligned here, so
     the negative margin-left cancels the P's left side bearing (0.028em) and
     puts the stem on the intended margin. */
  .wordmark {
    font-weight: 400; font-size: 170px; line-height: 1;
    letter-spacing: -0.05em; margin-left: -0.028em;
  }
  .line {
    font-size: 40px; line-height: 1;
    color: rgba(12,12,14,0.68);
  }
</style>
</head>
<body>
  <div class="row">
    <div class="wordmark">PLOT</div>
    <div class="line">Your film &amp; TV companion</div>
  </div>
</body>
</html>
