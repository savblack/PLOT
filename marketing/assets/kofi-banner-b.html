<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* PLOT Ko-fi cover, 1200x300 — variant B: wordmark between two hairlines,
     with the supporting line underneath. Ink on white, flat, no gradients. */
  @font-face { font-family: 'DM Sans'; src: url('../../apps/web/public/fonts/DMSans-Variable.ttf') format('truetype-variations'); font-weight: 100 900; font-style: normal; }
  @font-face { font-family: 'Instrument Serif'; src: url('../../apps/web/public/fonts/InstrumentSerif-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 300px; overflow: hidden;
    background: #FFFFFF; color: #0C0C0E;
    font-family: 'DM Sans', system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    /* Optical centring, measured not guessed: Instrument Serif caps are
       0.735em with the baseline at 0.84em, and padding on a centred flex
       container shifts content by only half its value. */
    padding-bottom: 7px;
  }
  .row { display: flex; align-items: center; gap: 44px; width: 100%; padding: 0 90px; }
  .rule { flex: 1; height: 1px; background: rgba(12,12,14,0.18); }
  /* The wordmark spec: Instrument Serif 400 at -0.05em. The negative margin
     cancels the trailing letter-space CSS adds after the final T, so the
     glyphs sit optically centred between the two rules. */
  .wordmark {
    font-family: 'Instrument Serif', Georgia, serif; font-weight: 400;
    font-size: 118px; line-height: 1; letter-spacing: -0.05em;
    margin-right: 0.05em;
  }
  .kicker {
    margin-top: 30px;
    font-size: 17px; font-weight: 500; letter-spacing: 0.26em;
    text-transform: uppercase; color: rgba(12,12,14,0.45);
    margin-right: -0.26em;
  }
</style>
</head>
<body>
  <div class="row">
    <div class="rule"></div>
    <div class="wordmark">PLOT</div>
    <div class="rule"></div>
  </div>
  <div class="kicker">Film&nbsp;&nbsp;·&nbsp;&nbsp;Television&nbsp;&nbsp;·&nbsp;&nbsp;Your Watchlist</div>
</body>
</html>
