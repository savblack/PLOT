<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>/*INLINE_BASE_CSS*/</style>
<style>
  /* One full-bleed card per title, posted as a real carousel on IG/Threads;
     X gets the first (most popular) card only.
     Hierarchy: caps kicker (kind + date) -> hero title. Nothing else. */
  .content { display: flex; flex-direction: column; align-items: flex-start; gap: 30px; }
  .display { font-size: 150px; max-width: 96%; }
  @media (min-aspect-ratio: 4/3) {
    .display { font-size: 118px; }
  }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
/*HELPERS_JS*/
window.DATA = "/*DATA_JSON*/";
const d = window.DATA;
const card = document.getElementById('card');
const t = d.title || {};

const art = pickArt(t);
if (art) card.append(img('backdrop', art));
card.append(el('div', 'scrim'));

const content = el('div', 'content');
content.append(metaCaps(t.release_kind, t.when_label));
content.append(el('h1', 'display', t.title));
card.append(content);
card.append(plotMark());
card.append(plotFooter());
</script>
</body>
</html>
