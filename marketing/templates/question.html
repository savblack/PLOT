<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>/*INLINE_BASE_CSS*/</style>
<style>
  /* Text-only engagement card: accent caps kicker -> the question, set large
     in the serif. No backdrop; the scrim adds a quiet vignette on the brand bg. */
  .content { display: flex; flex-direction: column; align-items: flex-start; gap: 30px; }
  .display.q { font-size: 96px; max-width: 100%; line-height: 1.04; }
  @media (min-aspect-ratio: 4/3) {
    .display.q { font-size: 74px; }
  }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
/*HELPERS_JS*/
window.DATA = "/*DATA_JSON*/";
const d = window.DATA;
const card = document.getElementById('card');

card.append(el('div', 'scrim'));
const content = el('div', 'content');
const kicker = el('div', 'meta-caps');
kicker.append(el('span', 'kind', d.kicker || 'Question of the week'));
content.append(kicker);
content.append(el('h1', 'display q', d.question || ''));
card.append(content);
card.append(plotMark());
card.append(plotFooter());
</script>
</body>
</html>
