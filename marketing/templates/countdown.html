<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@200;300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>/*INLINE_BASE_CSS*/</style>
<style>
  /* Hierarchy: caps kicker (kind + date) -> hero title -> count beneath
     (accent number + italic unit, same treatment as the trending rank). */
  .content { display: flex; flex-direction: column; align-items: flex-start; gap: 28px; }
  .display { font-size: 150px; max-width: 96%; }
  .count {
    font-family: var(--font-serif);
    font-size: 130px;
    line-height: 0.9;
    letter-spacing: -0.02em;
    color: var(--accent);
    display: flex;
    align-items: baseline;
    gap: 26px;
  }
  .count .unit {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 108px;
    letter-spacing: 0;
    word-spacing: 0.08em;
    color: var(--text-dim);
  }
  @media (min-aspect-ratio: 4/3) {
    .display { font-size: 118px; }
    .count { font-size: 108px; }
    .count .unit { font-size: 90px; }
  }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
/*HELPERS_JS*/
window.DATA = "/*DATA_JSON*/";
const d = window.DATA;
const card = document.getElementById('card');
const t = d.title || {};
const days = Number(d.days_until);

const art = pickArt(t);
if (art) card.append(img('backdrop', art));
card.append(el('div', 'scrim'));

const content = el('div', 'content');
content.append(metaCaps(d.kind, d.when_label));
content.append(el('h1', 'display', t.title));
const count = el('div', 'count', String(days));
count.append(el('span', 'unit', days === 1 ? 'day to go' : 'days to go'));
content.append(count);
card.append(content);
card.append(plotMark());
card.append(plotFooter());
</script>
</body>
</html>
