<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>/*INLINE_BASE_CSS*/</style>
<style>
  /* ── Chart card: a flat dark table. No art behind the rows: the chart IS the
     image, so nothing competes with the names. One hairline per row, a fixed
     column grid so ranks, posters, names and movement all align. ── */
  .chart-card { justify-content: flex-start; padding-top: calc(var(--pad) + 176px); }
  /* The chart is the one light-mode card: cream ground, charcoal ink
     (colors.light). The pink stays as type (author's call, 17 Sep 2026: no
     highlight blocks), so it only carries the display-size date and the
     bold NEW / up-move marks. */
  body.light {
    --bg: #F8F2EA;
    --text: #292924;
    --text-dim: #5F5A52;
    --text-faint: #6B655D;
    --hair: rgba(41,41,36,0.14);
  }
  body.light .plot-mark, body.light .plot-footer .site { text-shadow: none; }
  body.light .plot-footer .site b { color: var(--text); font-weight: 700; }
  body.light .row.top-rank .rank { color: var(--text); }
  body.light .row img.thumb { border-color: rgba(41,41,36,0.12); }
  body.light .move.up, body.light .move.new {
    color: var(--text); background: var(--accent);
    justify-self: end; padding: 4px 12px; border-radius: 999px;
  }
  body.light .move.down { color: var(--text-faint); }
  .header { position: relative; z-index: 2; margin-bottom: 40px; }
  /* Kicker sits top-right, on the wordmark's line, so the header is just the week. */
  .chart-card > .meta-caps { position: absolute; top: calc(var(--pad) + 18px); right: var(--pad); z-index: 4; font-size: 26px; }
  .header .display { font-size: 76px; }
  .header .display .wk { color: var(--accent); }
  .rows {
    position: relative; z-index: 2; flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
    border-top: 1px solid var(--hair, rgba(240,239,232,0.14));
  }
  .row {
    display: grid;
    grid-template-columns: 76px 96px minmax(0, 1fr) 132px;
    column-gap: 24px;
    align-items: center;
    flex: 1;
    padding: 8px 0;
    border-bottom: 1px solid var(--hair, rgba(240,239,232,0.14));
  }
  .row .rank {
    font-family: var(--font-display);
    font-size: 58px;
    line-height: 1;
    color: var(--text-faint);
  }
  .row.top-rank .rank { color: var(--accent); }
  .row img.thumb {
    width: 96px; aspect-ratio: 2/3; border-radius: 8px; object-fit: cover;
    border: 1px solid rgba(240,239,232,0.12);
  }
  .row .name { min-width: 0; font-size: 44px; font-weight: 500; line-height: 1.15; color: var(--text); }
  .row .name .title-text { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Movement: one right-aligned column. Pink for good news (up, new),
     dimmed for down, nothing at all for "held". */
  .move { font-size: 28px; font-weight: 600; letter-spacing: 0.04em; text-align: right; font-variant-numeric: tabular-nums; }
  .move.up   { color: var(--accent); }
  .move.down { color: var(--text-faint); }
  .move.new  { color: var(--accent); font-size: 23px; letter-spacing: 0.16em; }
  .move.same { color: transparent; }

  /* ── Detail card: full-bleed art. Hierarchy: dim caps kicker ->
     hero title -> rank line beneath ("#3" accent + quiet movement note). ── */
  .detail .content { display: flex; flex-direction: column; align-items: flex-start; gap: 28px; }
  .detail .display { font-size: 150px; max-width: 96%; }

  @media (min-aspect-ratio: 4/3) {
    .chart-card { padding-top: calc(var(--pad) + 124px); }
    .header { margin-bottom: 20px; }
    .chart-card > .meta-caps { top: calc(var(--pad) + 12px); font-size: 22px; }
    .header .display { font-size: 56px; }
    .row { grid-template-columns: 56px 62px minmax(0, 1fr) 112px; column-gap: 20px; padding: 4px 0; }
    .row .rank { font-size: 42px; }
    .row img.thumb { width: 62px; }
    .row .name { font-size: 34px; }
    .move { font-size: 24px; }
    .move.new { font-size: 20px; }

    .detail .display { font-size: 118px; }
  }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
/*HELPERS_JS*/
window.DATA = "/*DATA_JSON*/";
const d = window.DATA;
const card = document.getElementById('card');

const moveNode = (m) => {
  if (!m || m.dir === 'none') return el('span', 'move same', '');
  if (m.dir === 'new') return el('span', 'move new', 'NEW');
  if (m.dir === 'same') return el('span', 'move same', '');
  return el('span', `move ${m.dir}`, `${m.dir === 'up' ? '▲' : '▼'} ${m.delta}`);
};

if (d.kind === 'detail') {
  const t = d.title || {};
  card.classList.add('detail');
  const art = pickArt(t);
  if (art) card.append(img('backdrop', art));
  card.append(el('div', 'scrim'));
  const content = el('div', 'content');
  content.append(el('div', 'meta-caps', 'The charts'));
  content.append(el('h1', 'display', t.title));
  const stat = el('div', 'subline');
  stat.append(el('span', 'n', `${t.rank}`));
  if (t.movement_label) stat.append(el('span', 'lbl', t.movement_label));
  content.append(stat);
  card.append(content);
} else {
  card.classList.add('chart-card');
  document.body.classList.add('light');
  const header = el('div', 'header');
  const weekDate = String(d.week_label || '').replace(/^week of\s+/i, '');
  const h = el('h1', 'display', 'Week of ');
  h.append(el('span', 'wk', weekDate));
  header.append(h);
  card.append(header);
  card.append(el('div', 'meta-caps', 'The charts'));
  const items = (d.items || []).slice(0, 5);
  const rows = el('div', 'rows');
  items.forEach(item => {
    const row = el('div', `row${item.rank === 1 ? ' top-rank' : ''}`);
    row.append(el('div', 'rank', `${item.rank}`));
    if (item.poster_data_uri) row.append(img('thumb', item.poster_data_uri));
    const name = el('div', 'name');
    name.append(el('span', 'title-text', item.title));
    row.append(name);
    row.append(moveNode(item.movement));
    rows.append(row);
  });
  card.append(rows);
}
card.append(plotMark());
card.append(plotFooter());
</script>
</body>
</html>
