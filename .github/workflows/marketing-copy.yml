name: Marketing — copy worker

# Step 2 of the daily pipeline: the AI copy worker writes each planned post's copy
# (see marketing/copy/AGENT.md), then dispatches the render workflow.
#
# Runs on a SUBSCRIPTION, not an API key: authenticated with CLAUDE_CODE_OAUTH_TOKEN
# (generate locally via `claude setup-token`). Until that secret is set, this
# workflow is a clean no-op — the guard step skips everything.
#
# To swap the worker to Codex (or another agent), replace the "Generate copy" step
# with that agent's CLI + token; the pull -> save -> dispatch contract is unchanged.
on:
  schedule:
    - cron: '20 11 * * *' # ~20 min after the plan workflow
  workflow_dispatch:

permissions:
  contents: read
  actions: write # to dispatch marketing-render.yml

concurrency:
  group: marketing-copy
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Guard — skip until the subscription token is set
        id: guard
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN not set — skipping (workflow inert)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Claude Code
        if: steps.guard.outputs.run == 'true'
        run: npm i -g @anthropic-ai/claude-code

      - name: Generate copy (subscription — no API key)
        if: steps.guard.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          claude -p "Read marketing/copy/AGENT.md and do exactly what it says, then stop." \
            --append-system-prompt "You are an automated CI worker. Follow marketing/copy/AGENT.md precisely: pull jobs, write each copy JSON, save, then dispatch the render workflow. Do not touch anything else." \
            --allowedTools "Bash,Read,Write,WebSearch,WebFetch" \
            --permission-mode acceptEdits \
            --max-turns 60

      - name: Alert on failure
        if: failure() && steps.guard.outputs.run == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: copy worker
          FAILURE_NOTE: 'Copy was not written, so render/publish will have nothing to do today.'
        run: bash .github/scripts/marketing-alert.sh
