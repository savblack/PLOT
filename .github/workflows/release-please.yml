name: Release please

# Versions apps/mobile only. Web and the marketing site deploy from main
# and stay unversioned. This needs a push to main so it can open the release
# PR and, once that PR merges, tag mobile-vX.Y.Z. That is a GitHub event, so
# it stays on Actions. See docs/ops/versioning.md.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write # start ci.yml on the release branch

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      mobile_released: ${{ steps.release.outputs['apps/mobile--release_created'] }}
      mobile_tag: ${{ steps.release.outputs['apps/mobile--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The release PR is opened or updated with GITHUB_TOKEN, which starts no
      # pull_request workflows, so its required `check` would never run. Start
      # CI on the release branch directly; the run reports on the PR's head.
      # Also when the PR already existed and did not change (a push to main
      # with no mobile commits), as long as its head has no `check` yet:
      # 1.6.0 (#1678) sat blocked on 2026-11-15 because it was opened before
      # this step existed and nothing updated it afterwards.
      - name: Run CI on the release PR
        if: steps.release.outputs['apps/mobile--release_created'] != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" \
            --json headRefName,headRefOid --jq '.[] | "\(.headRefName) \(.headRefOid)"' |
          while read -r branch sha; do
            ran=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=check" --jq '.total_count')
            if [ "$ran" != "0" ]; then echo "$branch already has a check run."; continue; fi
            if gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"; then
              echo "Started CI on $branch"
            else
              # A branch cut before ci.yml accepted workflow_dispatch cannot be
              # dispatched; updating it from the PR page starts CI normally.
              echo "::warning::Could not start CI on $branch. Update the branch from the release PR."
            fi
          done

  # A new mobile-vX.Y.Z starts the iOS store build. Called directly because a
  # tag pushed with GITHUB_TOKEN does not trigger other workflows.
  mobile-build:
    needs: release-please
    if: needs.release-please.outputs.mobile_released == 'true'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/mobile-build.yml
    with:
      ref: ${{ needs.release-please.outputs.mobile_tag }}
    secrets: inherit
