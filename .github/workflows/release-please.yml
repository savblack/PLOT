name: Release please

# Versions apps/mobile only. Web and the marketing site deploy from main
# and stay unversioned. This needs a push to main so it can open the release
# PR and, once that PR merges, tag mobile-vX.Y.Z. That is a GitHub event, so
# it stays on Actions. See docs/ops/versioning.md.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      mobile_released: ${{ steps.release.outputs['apps/mobile--release_created'] }}
      mobile_tag: ${{ steps.release.outputs['apps/mobile--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A new mobile-vX.Y.Z starts the iOS store build. Called directly because a
  # tag pushed with GITHUB_TOKEN does not trigger other workflows.
  mobile-build:
    needs: release-please
    if: needs.release-please.outputs.mobile_released == 'true'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/mobile-build.yml
    with:
      ref: ${{ needs.release-please.outputs.mobile_tag }}
    secrets: inherit
