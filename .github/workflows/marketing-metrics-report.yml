name: Marketing — weekly metrics report

# Emails the completed week's performance. Runs before the weekly generation
# slot so the numbers land while the week they cover is still the current one.
on:
  schedule:
    - cron: '45 23 * * 6' # 9:45am Sydney Sunday (AEST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-metrics-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Send weekly metrics report
        run: node marketing/metrics/report.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MARKETING_ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: Weekly metrics report
          FAILURE_NOTE: 'The weekly performance report was not sent.'
        run: bash .github/scripts/marketing-alert.sh
