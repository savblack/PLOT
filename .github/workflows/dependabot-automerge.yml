name: Dependabot auto-merge

# Self-merges green Dependabot PRs for minor/patch updates, holds majors for review.
#
# Why `status` and not `on: pull_request`?
#   - GitHub gives Dependabot-triggered `pull_request` runs a read-only token,
#     so they can't merge. CircleCI reports a commit status after running the
#     full suite; this workflow runs in the base-repo context with a writable
#     token and acts only on that successful status.
#   - This repo is private on GitHub Free -> no branch protection -> native
#     `gh pr merge --auto` won't engage. So we do the merge ourselves, gated on
#     CircleCI having already passed.
#
# Safety:
#   - Acts only on PRs authored by dependabot[bot].
#   - Merges only when CircleCI ITSELF reported `success`: the latest
#     `ci/circleci: check` status posted by the CircleCI GitHub App
#     (`circleci-app[bot]`). A status with that name from anyone else is
#     ignored, so the PR waits for a human. See the check below.
#   - Merges only minor/patch bumps; majors get labelled + commented, never merged.
#   - DRY RUN by default. Set repo variable DEPENDABOT_AUTOMERGE=true to arm it.

on:
  status:

permissions:
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: dependabot-automerge-${{ github.event.sha }}
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    # Pending and failed CircleCI updates create no runner. Neither the status
    # name nor its sender is trusted: who posted it, and the PR's authorship,
    # are checked from the API below.
    if: >
      github.event.context == 'ci/circleci: check' &&
      github.event.state == 'success'
    steps:
      - name: Resolve PR, classify bump, and merge or hold
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.sha }}
          ARMED: ${{ vars.DEPENDABOT_AUTOMERGE }}
        run: |
          set -euo pipefail

          # --- Confirm CircleCI itself reported success ---
          # Any account with push access can post a commit status named
          # `ci/circleci: check`, and this workflow fires on every one of them
          # (2026-11-11 security review on #1555). So the event is only a
          # wake-up call. Read the commit's statuses from the API and require
          # that the LATEST `ci/circleci: check` posted by the CircleCI GitHub
          # App is `success`.
          #
          # Why the app's bot account and not the status sender or target_url:
          #   - CircleCI posts this status twice per run. The GitHub App posts it
          #     as `circleci-app[bot]` (type Bot). The older OAuth integration
          #     posts it as the person who set the project up (`savblack`, type
          #     User), which is indistinguishable from that person posting it by
          #     hand, so it cannot be trusted.
          #   - Only the app itself can act as `circleci-app[bot]`; no user,
          #     token or other workflow can post as it.
          #   - `target_url` is free text anyone can set, so its host is checked
          #     only as a second guard, never on its own.
          # Statuses come back newest first, so `first(...)` is the latest one.
          # A pending or failed latest run from the app means "not green yet":
          # the PR is left alone, and the app's own success event (if it comes)
          # triggers this workflow again.
          CIRCLECI_STATE=$(gh api --paginate "repos/$GH_REPO/commits/$HEAD_SHA/statuses?per_page=100" \
            --jq '.[] | select(.context == "ci/circleci: check" and .creator.login == "circleci-app[bot]" and .creator.type == "Bot") | "\(.state) \(.target_url // "")"')
          CIRCLECI_STATE=${CIRCLECI_STATE%%$'\n'*}
          CIRCLECI_RESULT=${CIRCLECI_STATE%% *}
          CIRCLECI_URL=${CIRCLECI_STATE#* }
          if [ "$CIRCLECI_RESULT" != "success" ]; then
            echo "No success from the CircleCI GitHub App for '$HEAD_SHA' (latest: '${CIRCLECI_RESULT:-none}'). Not merging; left for human review."
            exit 0
          fi
          case "$CIRCLECI_URL" in
            https://app.circleci.com/*|https://circleci.com/*) ;;
            *)
              echo "CircleCI app status points at '$CIRCLECI_URL', not circleci.com. Not merging; left for human review."
              exit 0
              ;;
          esac
          echo "CircleCI GitHub App reported success: $CIRCLECI_URL"

          # --- Find the open PR whose head commit CircleCI just passed ---
          PR_NUM=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/pulls" \
            --jq '[.[] | select(.state == "open")][0].number // empty')
          if [ -z "$PR_NUM" ]; then
            echo "No open PR for commit '$HEAD_SHA'. Nothing to do."
            exit 0
          fi

          PR_JSON=$(gh pr view "$PR_NUM" --json title,body,author,url,labels,headRefOid)

          # CircleCI was verified on HEAD_SHA, so only that exact commit may be
          # merged. `commits/{sha}/pulls` also returns PRs that merely CONTAIN
          # the commit, and a PR can gain commits after CircleCI reported, so
          # without this an old pass could approve a newer, untested head
          # (2026-11-11 Strix review on #1561). The merge below also passes
          # --match-head-commit, so a push between here and the merge fails it.
          PR_HEAD=$(echo "$PR_JSON" | jq -r '.headRefOid')
          if [ "$PR_HEAD" != "$HEAD_SHA" ]; then
            echo "PR #$PR_NUM head is '$PR_HEAD', not the commit CircleCI passed ('$HEAD_SHA'). Not merging; left for human review."
            exit 0
          fi
          AUTHOR=$(echo "$PR_JSON" | jq -r '.author.login')
          TITLE=$(echo "$PR_JSON" | jq -r '.title')
          BODY=$(echo "$PR_JSON" | jq -r '.body // ""')
          URL=$(echo "$PR_JSON" | jq -r '.url')

          # Double-check authorship at the PR level (defence in depth).
          if [ "$AUTHOR" != "dependabot[bot]" ] && [ "$AUTHOR" != "app/dependabot" ]; then
            echo "PR #$PR_NUM author is '$AUTHOR', not Dependabot. Skipping."
            exit 0
          fi

          # And every commit on it. The PR author is whoever opened it, so a
          # collaborator who pushes a commit onto a dependabot/* branch would
          # otherwise ride Dependabot's authorship into an unreviewed merge
          # (2026-10-13 security review). Dependabot's commits are authored by
          # its bot account; anything else holds the PR.
          OTHER_AUTHORS=$(gh pr view "$PR_NUM" --json commits \
            --jq '[.commits[].authors[].login // "unknown"] | map(select(. != "dependabot[bot]" and . != "app/dependabot")) | unique | join(", ")')
          if [ -n "$OTHER_AUTHORS" ]; then
            echo "PR #$PR_NUM has commits by '$OTHER_AUTHORS', not only Dependabot. Holding for review."
            gh pr edit "$PR_NUM" --add-label "deps:major-needs-review" || true
            exit 0
          fi

          echo "PR #$PR_NUM: $TITLE"

          # --- Classify the bump deterministically ---
          # Grouped PRs come from the 'app-minor-patch' group, which by config
          # only ever contains minor/patch updates.
          #
          # "minor/patch" is NOT the same as "safe", and this comment used to say
          # it was. #622 auto-merged react-native 0.86.2 -> 0.87.1 as a minor,
          # bundled with 29 other packages, and the iOS app could not be built
          # for five days. What makes the group safe enough to self-merge is not
          # the semver range: it is that CI actually gates the risk. The native
          # packages that carried that risk are now excluded at source by the
          # `ignore` list in dependabot.yml, and `pnpm run mobile:deps` fails the
          # build if any of them drift back.
          #
          # Otherwise read every "from X to Y" pair we can find and hold if ANY
          # of them crosses a release line. Two title shapes used to fall through
          # here as unclassifiable and get held for no reason:
          #   - bare majors: "bump actions/setup-node from 6 to 7" (every
          #     github-actions bump looks like this; the old pattern demanded X.Y.Z)
          #   - multi-package: "bump react-router and react-router-dom" — no
          #     versions in the title at all, but the body lists them per package
          # So versions may now be partial, and the body's "Updates `pkg` from X
          # to Y" / "Bumps [pkg](url) from X to Y" lines are read as a fallback.
          # Only those two line prefixes are scanned: Dependabot bodies also embed
          # release notes and commit logs, which mention unrelated bumps.
          #
          # Unreadable stays `unknown` and is held — every failure mode here holds
          # rather than merges.

          # 0 = same release line, 1 = crosses one. For 0.x npm itself treats a
          # minor bump as breaking (^0.34.5 does not allow 0.35.0), so that
          # counts as crossing and gets held.
          same_release_line() {
            from="$1"; to="$2"
            [ "${from%%.*}" = "${to%%.*}" ] || return 1
            if [ "${from%%.*}" = "0" ]; then
              [ "$(echo "$from" | cut -d. -f2)" = "$(echo "$to" | cut -d. -f2)" ] || return 1
            fi
            return 0
          }

          CLASS="unknown"
          if echo "$TITLE" | grep -qiE 'bump the app-minor-patch group'; then
            CLASS="minor-patch"
          else
            PAIRS=$(
              {
                echo "$TITLE" | grep -oiE 'from [0-9]+(\.[0-9]+)* to [0-9]+(\.[0-9]+)*' || true
                echo "$BODY" | grep -E '^(Updates|Bumps) ' \
                  | grep -oiE 'from [0-9]+(\.[0-9]+)* to [0-9]+(\.[0-9]+)*' || true
              } | sed -E 's/^[Ff]rom //; s/ [Tt]o / /' | sort -u
            )
            if [ -n "$PAIRS" ]; then
              CLASS="minor-patch"
              while read -r F T; do
                [ -z "$F" ] && continue
                if ! same_release_line "$F" "$T"; then
                  CLASS="major"
                  break
                fi
              done <<< "$PAIRS"
            fi
          fi
          echo "Classified as: $CLASS"
          echo "Version pairs read:"; echo "${PAIRS:-  (none)}"

          # --- Act ---
          if [ "$CLASS" = "major" ]; then
            echo "Major bump -> hold for human review."
            gh pr edit "$PR_NUM" --add-label "deps:major-needs-review" || true
            gh pr comment "$PR_NUM" --body \
              "🚧 Major version bump — held for human review by dependabot-automerge. Merge manually once you've checked the changelog." || true
            exit 0
          fi

          if [ "$CLASS" != "minor-patch" ]; then
            echo "Could not classify bump safely -> leaving for human review."
            gh pr edit "$PR_NUM" --add-label "deps:major-needs-review" || true
            gh pr comment "$PR_NUM" --body \
              "❓ dependabot-automerge couldn't classify this bump from the title, so it's left for manual review." || true
            exit 0
          fi

          # minor-patch + CI already green
          if [ "${ARMED:-}" != "true" ]; then
            echo "DRY RUN (repo variable DEPENDABOT_AUTOMERGE != 'true')."
            echo "Would merge PR #$PR_NUM ($URL) with: gh pr merge --squash --delete-branch --match-head-commit $HEAD_SHA"
            exit 0
          fi

          echo "Armed -> merging PR #$PR_NUM"
          gh pr merge "$PR_NUM" --squash --delete-branch --match-head-commit "$HEAD_SHA"
