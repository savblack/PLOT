name: Dependabot auto-merge

# Self-merges green Dependabot PRs for minor/patch updates, holds majors for review.
#
# Why workflow_run and not `on: pull_request`?
#   - GitHub gives Dependabot-triggered `pull_request` runs a read-only token,
#     so they can't merge. A `workflow_run` runs in the base-repo context with a
#     writable token and only AFTER CI has a real conclusion.
#   - This repo is private on GitHub Free -> no branch protection -> native
#     `gh pr merge --auto` won't engage. So we do the merge ourselves, gated on
#     CI having already passed (that's exactly what workflow_run gives us).
#
# Safety:
#   - Acts only on PRs authored by dependabot[bot].
#   - Merges only when the triggering CI run concluded `success`.
#   - Merges only minor/patch bumps; majors get labelled + commented, never merged.
#   - DRY RUN by default. Set repo variable DEPENDABOT_AUTOMERGE=true to arm it.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    # Only PR-triggered CI runs that passed, raised by Dependabot.
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Resolve PR, classify bump, and merge or hold
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          ARMED: ${{ vars.DEPENDABOT_AUTOMERGE }}
        run: |
          set -euo pipefail

          # --- Find the open PR for this branch ---
          PR_NUM=$(gh pr list --head "$HEAD_BRANCH" --state open \
            --json number,title,author,url \
            --jq '.[0].number // empty')
          if [ -z "$PR_NUM" ]; then
            echo "No open PR for branch '$HEAD_BRANCH'. Nothing to do."
            exit 0
          fi

          PR_JSON=$(gh pr view "$PR_NUM" --json title,body,author,url,labels)
          AUTHOR=$(echo "$PR_JSON" | jq -r '.author.login')
          TITLE=$(echo "$PR_JSON" | jq -r '.title')
          BODY=$(echo "$PR_JSON" | jq -r '.body // ""')
          URL=$(echo "$PR_JSON" | jq -r '.url')

          # Double-check authorship at the PR level (defence in depth).
          if [ "$AUTHOR" != "dependabot[bot]" ] && [ "$AUTHOR" != "app/dependabot" ]; then
            echo "PR #$PR_NUM author is '$AUTHOR', not Dependabot. Skipping."
            exit 0
          fi

          echo "PR #$PR_NUM: $TITLE"

          # --- Classify the bump deterministically ---
          # Grouped PRs come from the 'app-minor-patch' group, which by config
          # only ever contains minor/patch updates -> always safe.
          #
          # Otherwise read every "from X to Y" pair we can find and hold if ANY
          # of them crosses a release line. Two title shapes used to fall through
          # here as unclassifiable and get held for no reason:
          #   - bare majors: "bump actions/setup-node from 6 to 7" (every
          #     github-actions bump looks like this; the old pattern demanded X.Y.Z)
          #   - multi-package: "bump react-router and react-router-dom" — no
          #     versions in the title at all, but the body lists them per package
          # So versions may now be partial, and the body's "Updates `pkg` from X
          # to Y" / "Bumps [pkg](url) from X to Y" lines are read as a fallback.
          # Only those two line prefixes are scanned: Dependabot bodies also embed
          # release notes and commit logs, which mention unrelated bumps.
          #
          # Unreadable stays `unknown` and is held — every failure mode here holds
          # rather than merges.

          # 0 = same release line, 1 = crosses one. For 0.x npm itself treats a
          # minor bump as breaking (^0.34.5 does not allow 0.35.0), so that
          # counts as crossing and gets held.
          same_release_line() {
            from="$1"; to="$2"
            [ "${from%%.*}" = "${to%%.*}" ] || return 1
            if [ "${from%%.*}" = "0" ]; then
              [ "$(echo "$from" | cut -d. -f2)" = "$(echo "$to" | cut -d. -f2)" ] || return 1
            fi
            return 0
          }

          CLASS="unknown"
          if echo "$TITLE" | grep -qiE 'bump the app-minor-patch group'; then
            CLASS="minor-patch"
          else
            PAIRS=$(
              {
                echo "$TITLE" | grep -oiE 'from [0-9]+(\.[0-9]+)* to [0-9]+(\.[0-9]+)*' || true
                echo "$BODY" | grep -E '^(Updates|Bumps) ' \
                  | grep -oiE 'from [0-9]+(\.[0-9]+)* to [0-9]+(\.[0-9]+)*' || true
              } | sed -E 's/^[Ff]rom //; s/ [Tt]o / /' | sort -u
            )
            if [ -n "$PAIRS" ]; then
              CLASS="minor-patch"
              while read -r F T; do
                [ -z "$F" ] && continue
                if ! same_release_line "$F" "$T"; then
                  CLASS="major"
                  break
                fi
              done <<< "$PAIRS"
            fi
          fi
          echo "Classified as: $CLASS"
          echo "Version pairs read:"; echo "${PAIRS:-  (none)}"

          # --- Act ---
          if [ "$CLASS" = "major" ]; then
            echo "Major bump -> hold for human review."
            gh pr edit "$PR_NUM" --add-label "deps:major-needs-review" || true
            gh pr comment "$PR_NUM" --body \
              "🚧 Major version bump — held for human review by dependabot-automerge. Merge manually once you've checked the changelog." || true
            exit 0
          fi

          if [ "$CLASS" != "minor-patch" ]; then
            echo "Could not classify bump safely -> leaving for human review."
            gh pr edit "$PR_NUM" --add-label "deps:major-needs-review" || true
            gh pr comment "$PR_NUM" --body \
              "❓ dependabot-automerge couldn't classify this bump from the title, so it's left for manual review." || true
            exit 0
          fi

          # minor-patch + CI already green
          if [ "${ARMED:-}" != "true" ]; then
            echo "DRY RUN (repo variable DEPENDABOT_AUTOMERGE != 'true')."
            echo "Would merge PR #$PR_NUM ($URL) with: gh pr merge --squash --delete-branch"
            exit 0
          fi

          echo "Armed -> merging PR #$PR_NUM"
          gh pr merge "$PR_NUM" --squash --delete-branch
