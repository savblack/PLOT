name: Streaming Top 10 — daily sync (Prime / Max / Apple / Disney)

on:
  schedule:
    - cron: '30 12 * * *' # 12:30 UTC daily — regions auto-detected from active users, stays under free quota
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streaming-top10
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync Prime / Max / Apple / Disney Top 10
        run: node scripts/sync-streaming-top10.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          CHART_REGIONS: ${{ vars.CHART_REGIONS }}
