name: Marketing — weekly batch

# Runs after the Sunday learning loop so the updated voice/spec rules feed the
# next week. On scheduled Sundays the learning guard must already be applied.
on:
  schedule:
    - cron: '30 0 * * 0' # 10:30am Sydney Sunday (AEST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-weekly-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Confirm Sunday learning is applied
        if: github.event_name == 'schedule'
        run: node marketing/learning/assert-ready.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Generate the week with Claude Code
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "Missing CLAUDE_CODE_OAUTH_TOKEN secret."
            exit 1
          fi
          node marketing/scripts/automation.mjs weekly --copy-runner=claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MARKETING_ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: weekly batch
          FAILURE_NOTE: 'Weekly generation did not complete. If Sunday learning was pending, apply it locally before rerunning.'
        run: bash .github/scripts/marketing-alert.sh
