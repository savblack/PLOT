name: Marketing — weekly batch

# Generates the coming week from the voice/spec rules as they stand in the repo.
on:
  schedule:
    # 00:30 UTC Sunday. Saturday evening Eastern, and still before 9:00am ET
    # Sunday even with this repo's scheduler lag, so the week is planned
    # before the first post.
    - cron: '30 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-weekly-batch
  cancel-in-progress: false

jobs:
  batch:
    # macOS, not Ubuntu: the copy worker runs Claude inside sandbox-exec
    # (marketing/lib/cli-runner.mjs) and refuses to start anywhere else, so an
    # Ubuntu runner fails every week at the copy step.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pinned, not @latest: 31f4d72 is what an unpinned CLI install costs you
      # here — a flag this workflow relied on was removed upstream and broke
      # every run until someone noticed. Bump this version deliberately, in
      # its own PR, not automatically.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.226

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Generate the week with Claude Code
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "Missing CLAUDE_CODE_OAUTH_TOKEN secret."
            exit 1
          fi
          node marketing/scripts/automation.mjs weekly --copy-runner=claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MARKETING_ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          # The batch now ends by pushing the rendered week into Buffer, so the
          # generation job needs the publishing credential it never used to.
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          # Repo variable; unset means draft (the safe default in schedule.mjs).
          BUFFER_PUSH_AS_DRAFT: ${{ vars.BUFFER_PUSH_AS_DRAFT }}

      # The runner deletes marketing/copy/jobs when the job ends. Keep the
      # briefs and Claude's JSON so a second model can be checked against the
      # same week without planning or pushing Buffer again.
      - name: Keep this week's briefs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-copy-jobs
          path: marketing/copy/jobs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: weekly batch
          FAILURE_NOTE: 'Weekly generation did not finish cleanly. Posts whose copy saved are still rendered and queued. Rejected copy stays planned until this is rerun.'
        run: bash .github/scripts/marketing-alert.sh
