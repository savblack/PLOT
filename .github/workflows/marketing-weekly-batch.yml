name: Marketing — weekly batch

# The whole week's content, generated once: plan 7 days -> AI copy (Codex) ->
# render onto the review desk (status needs_review, admin.theplot.tv). You review
# and approve there; the daily push sends approved posts to Buffer on their day.
#
# Sat 22:00 UTC = ~8am Sydney Sunday (AEST). DST: lands ~9am in AEDT (Oct-Apr).
on:
  schedule:
    - cron: '0 22 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-weekly-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Plan the week (7 days)
        run: node marketing/planner/plan.mjs
        env:
          MARKETING_PLAN_DAYS: '7'
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      # AI copy worker = Codex (subscription via CODEX_AUTH = ~/.codex/auth.json,
      # or OPENAI_API_KEY for the paid API). Inert until one of those is set:
      # posts stay 'planned' and nothing reaches the desk. Swappable — only this
      # step + secret change; marketing/copy/AGENT.md is the fixed contract.
      - name: Generate copy (Codex)
        env:
          CODEX_AUTH: ${{ secrets.CODEX_AUTH }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          if [ -z "$CODEX_AUTH" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "No Codex auth set (CODEX_AUTH or OPENAI_API_KEY) — skipping copy; posts stay 'planned'."
            exit 0
          fi
          if [ -n "$CODEX_AUTH" ]; then mkdir -p "$HOME/.codex"; printf '%s' "$CODEX_AUTH" > "$HOME/.codex/auth.json"; fi
          npm i -g @openai/codex
          codex exec --full-auto "Read marketing/copy/AGENT.md and do steps 1-3 only: run 'npm run mkt:copy:pull', then write each post's copy JSON exactly per its brief, then run 'npm run mkt:copy:save'. Do NOT dispatch any workflow — CI renders next."

      - name: Render to the review desk
        run: |
          npx playwright install --with-deps chromium
          node marketing/generate/generate.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MARKETING_ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: weekly batch
          FAILURE_NOTE: 'The week was not fully generated — check before reviewing.'
        run: bash .github/scripts/marketing-alert.sh
