name: Marketing — weekly batch
# Label writer checks in the Actions list so they are not mistaken for a week.
run-name: ${{ inputs.writer_check && 'Marketing — weekly batch (writer check)' || 'Marketing — weekly batch' }}

# Generates the coming week from the voice/spec rules as they stand in the repo.
on:
  schedule:
    # 18:30 UTC Sunday.
    # Sydney daylight time (AEDT, UTC+11): 5:30am Monday.
    # Sydney standard time (AEST, UTC+10): 4:30am Monday. The wait step holds
    # that hour so a scheduled run still begins at 5:30.
    # GitHub cron is UTC and does not follow Sydney daylight time.
    # This repo's scheduler has been starting the job several hours after the
    # cron line. The uptime-watch Worker (Cloudflare cron, on time) dispatches
    # the same workflow at 5:30am Monday Sydney (src/weeklyBatch.js). When that
    # run has already succeeded, the later scheduled start exits without
    # planning another week. Until 2026-11-12 a LaunchAgent on Savannah's Mac
    # did the dispatch and the job ran on that Mac.
    #
    # Posts stay 9:00am America/New_York. 5:30am Monday Sydney is Sunday
    # afternoon in the US, so the seven-day plan starts the next US Monday
    # and runs through the following Sunday. A start that slips past Monday
    # 9:00am Eastern skips that Monday's post.
    - cron: '30 18 * * 0'
  workflow_dispatch:
    inputs:
      writer_check:
        description: 'Only check that Grok can sign in and answer (plans nothing, touches no Buffer)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: marketing-weekly-batch
  cancel-in-progress: false

jobs:
  batch:
    # A GitHub-hosted Mac: the copy worker needs macOS sandbox-exec
    # (marketing/lib/cli-runner.mjs). macOS runners are free on a public repo.
    #
    # Grok writes the copy with its own login, separate from Savannah's Mac
    # (created 2026-11-12 with `grok login --device-auth`). Grok replaces the
    # refresh token every time it refreshes, so each run restores the newest
    # saved login and saves the one Grok leaves behind for next week: an
    # artifact encrypted with GROK_AUTH_PASSPHRASE, the same pattern as the
    # scrubbed database snapshot. GROK_AUTH_JSON seeds the first run only.
    # Never use this login anywhere else: a second user would rotate it away.
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # writer_check skips the install, and setup-node's post step fails
          # the job when the pnpm store it was told to cache does not exist.
          cache: ${{ inputs.writer_check != true && 'pnpm' || '' }}

      # workflow_dispatch always continues, including the 5:30am dispatch from
      # this Mac. Only the UTC cron bails out after a success in the last five
      # days, which is how the late GitHub start avoids booking the week twice.
      - name: Skip a scheduled rerun after this week already succeeded
        if: inputs.writer_check != true
        id: week
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          THIS_RUN: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync } from 'node:fs';
          const write = (skip) => appendFileSync(process.env.GITHUB_OUTPUT, `skip=${skip}\n`);
          if (process.env.EVENT_NAME !== 'schedule') {
            write('false');
            console.log(`${process.env.EVENT_NAME} always runs.`);
            process.exit(0);
          }
          const res = await fetch(`https://api.github.com/repos/${process.env.REPO}/actions/workflows/marketing-weekly-batch.yml/runs?per_page=20`, {
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'plot-marketing-weekly',
            },
          });
          if (!res.ok) {
            console.log(`Could not list recent runs (${res.status}). Continuing.`);
            write('false');
            process.exit(0);
          }
          const data = await res.json();
          const cutoff = Date.now() - 5 * 24 * 60 * 60 * 1000;
          const candidates = (data.workflow_runs || []).filter((run) => {
            if (String(run.id) === String(process.env.THIS_RUN)) return false;
            if (run.conclusion !== 'success') return false;
            return Date.parse(run.created_at) >= cutoff;
          });
          // Only a run whose "Generate the week" step succeeded planned a week.
          // A writer check also ends in success but skips that step (the
          // 2026-11-12 runs 43212517545 and 43213629146), and counting it
          // made the next scheduled start skip a week nobody had planned.
          const plannedWeek = async (run) => {
            const jobs = await fetch(`https://api.github.com/repos/${process.env.REPO}/actions/runs/${run.id}/jobs`, {
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'plot-marketing-weekly',
              },
            });
            if (!jobs.ok) return false;
            const body = await jobs.json();
            return (body.jobs || []).some((job) => (job.steps || []).some(
              (step) => step.name === 'Generate the week' && step.conclusion === 'success'));
          };
          let prior = null;
          for (const run of candidates) {
            if (await plannedWeek(run)) { prior = run; break; }
            console.log(`Run ${run.id} succeeded but did not generate a week (writer check). Not counting it.`);
          }
          if (prior) {
            console.log(`Run ${prior.id} already succeeded at ${prior.created_at}. Skipping.`);
            write('true');
          } else {
            console.log('No successful run in the last five days.');
            write('false');
          }
          EOF

      - name: Wait until 5:30am Sydney
        if: steps.week.outputs.skip != 'true' && github.event_name == 'schedule'
        run: |
          node --input-type=module <<'EOF'
          const parts = new Intl.DateTimeFormat('en-US', {
            timeZone: 'Australia/Sydney',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hourCycle: 'h23',
          }).formatToParts(new Date());
          const num = (type) => {
            const value = Number(parts.find((part) => part.type === type).value);
            return type === 'hour' && value === 24 ? 0 : value;
          };
          const hour = num('hour');
          const minute = num('minute');
          const second = num('second');
          const waitMs = ((5 * 60 + 30 - (hour * 60 + minute)) * 60 - second) * 1000;
          const clock = [hour, minute, second].map((part) => String(part).padStart(2, '0')).join(':');
          const maxWaitMs = 2 * 60 * 60 * 1000;
          if (waitMs > 0 && waitMs <= maxWaitMs) {
            console.log(`Sydney is ${clock}. Waiting ${Math.round(waitMs / 1000)}s for 05:30.`);
            await new Promise((resolve) => setTimeout(resolve, waitMs));
          } else {
            console.log(`Sydney is ${clock}. Starting now.`);
          }
          EOF

      - name: Install dependencies
        if: steps.week.outputs.skip != 'true' && inputs.writer_check != true
        run: pnpm install --frozen-lockfile

      - name: Install the Grok CLI
        if: steps.week.outputs.skip != 'true'
        run: |
          curl -fsSL https://x.ai/cli/install.sh | bash
          echo "$HOME/.grok/bin" >> "$GITHUB_PATH"

      # Newest saved login from an earlier run, else the seed secret.
      - name: Restore the Grok login
        id: grok_auth
        if: steps.week.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GROK_AUTH_PASSPHRASE: ${{ secrets.GROK_AUTH_PASSPHRASE }}
          GROK_AUTH_JSON: ${{ secrets.GROK_AUTH_JSON }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.grok"
          # Newest by date: artifact ids are not in creation order (on
          # 2026-11-12 a later run's artifact had the lower id), and only the
          # newest login is sure to hold the current refresh token.
          # Only a login this workflow saved on main counts. A pull request,
          # including one from a fork, can upload an artifact with the same
          # name; it could not decrypt, but taking it would break the week.
          id=""
          for cand in $(gh api "repos/$REPO/actions/artifacts?name=grok-auth&per_page=20" \
              --jq '.artifacts | sort_by(.created_at) | reverse | .[] | select(.expired | not)
                    | select(.workflow_run.head_branch == "main")
                    | select(.workflow_run.head_repository_id == .workflow_run.repository_id)
                    | "\(.id):\(.workflow_run.id)"'); do
            run_id=${cand#*:}
            path=$(gh api "repos/$REPO/actions/runs/$run_id" --jq '.path')
            if [ "$path" = ".github/workflows/marketing-weekly-batch.yml" ]; then id=${cand%%:*}; break; fi
          done
          if [ -n "$id" ]; then
            gh api "repos/$REPO/actions/artifacts/$id/zip" > "$RUNNER_TEMP/grok-auth.zip"
            unzip -q -o "$RUNNER_TEMP/grok-auth.zip" -d "$RUNNER_TEMP/grok-auth"
            # gpg refuses a file whose integrity check (MDC) fails.
            gpg --batch --quiet --decrypt --pinentry-mode loopback --passphrase-fd 0 \
              -o "$HOME/.grok/auth.json" "$RUNNER_TEMP/grok-auth/auth.json.gpg" <<< "$GROK_AUTH_PASSPHRASE"
            echo "Restored the login saved as artifact $id."
          elif [ -n "$GROK_AUTH_JSON" ]; then
            printf '%s' "$GROK_AUTH_JSON" > "$HOME/.grok/auth.json"
            echo "No saved login yet. Seeded from GROK_AUTH_JSON."
          else
            echo "::error::No Grok login: neither a saved artifact nor GROK_AUTH_JSON."
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/grok-auth" "$RUNNER_TEMP/grok-auth.zip"
          echo "restored=true" >> "$GITHUB_OUTPUT"

      - name: Check that Grok answers
        if: steps.week.outputs.skip != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          reply=$(grok -p "Reply with the single word ok." 2>&1 | tail -1)
          echo "Grok said: $reply"
          case "$reply" in *ok*|*Ok*|*OK*) ;; *) echo "::error::Grok did not answer as expected."; exit 1;; esac

      - name: Install a fallback writer when Grok is missing
        if: steps.week.outputs.skip != 'true' && inputs.writer_check != true
        run: |
          if command -v grok >/dev/null 2>&1; then
            echo "Using $(command -v grok)"
            grok --version || true
          else
            echo "::warning::grok is not on PATH. Installing Claude for this run."
            npm install -g @anthropic-ai/claude-code@2.1.226
          fi

      - name: Install Playwright browser
        if: steps.week.outputs.skip != 'true' && inputs.writer_check != true
        run: npx playwright install --with-deps chromium

      - name: Generate the week
        if: steps.week.outputs.skip != 'true' && inputs.writer_check != true
        run: |
          if command -v grok >/dev/null 2>&1; then
            node marketing/scripts/automation.mjs weekly --copy-runner=grok
          else
            echo "::warning::grok is not on PATH. This week is Claude."
            if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
              echo "Missing CLAUDE_CODE_OAUTH_TOKEN secret."
              exit 1
            fi
            node marketing/scripts/automation.mjs weekly --copy-runner=claude
          fi
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MARKETING_ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          # The batch now ends by pushing the rendered week into Buffer, so the
          # generation job needs the publishing credential it never used to.
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          # Repo variable; unset means draft (the safe default in schedule.mjs).
          BUFFER_PUSH_AS_DRAFT: ${{ vars.BUFFER_PUSH_AS_DRAFT }}

      # Grok has replaced the refresh token by now, so the copy restored above
      # no longer works. Save the current one for next week, even on failure.
      - name: Save the Grok login for next week
        if: always() && steps.grok_auth.outputs.restored == 'true'
        env:
          GROK_AUTH_PASSPHRASE: ${{ secrets.GROK_AUTH_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/grok-auth-out"
          gpg --batch --yes --symmetric --cipher-algo AES256 --pinentry-mode loopback --passphrase-fd 0 \
            -o "$RUNNER_TEMP/grok-auth-out/auth.json.gpg" "$HOME/.grok/auth.json" <<< "$GROK_AUTH_PASSPHRASE"
          rm -f "$HOME/.grok/auth.json"
      - name: Upload the saved Grok login
        if: always() && steps.grok_auth.outputs.restored == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grok-auth
          path: ${{ runner.temp }}/grok-auth-out/auth.json.gpg
          retention-days: 90
          if-no-files-found: error

      # The runner deletes marketing/copy/jobs when the job ends. Keep the
      # briefs and the writer's JSON so another pass can be checked against the
      # same week without planning or pushing Buffer again.
      - name: Keep this week's briefs
        if: always() && steps.week.outputs.skip != 'true' && inputs.writer_check != true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-copy-jobs
          path: marketing/copy/jobs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Alert on failure
        if: failure() && steps.week.outputs.skip != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: weekly batch
          FAILURE_NOTE: 'Weekly generation did not finish cleanly. Posts whose copy saved are still rendered and queued. Rejected copy stays planned until this is rerun.'
        run: bash .github/scripts/marketing-alert.sh
