name: Supabase deploy guard

# The Supabase GitHub integration applies migrations and redeploys
# `supabase/functions/*` to PRODUCTION on every push to main. It runs out of
# band, so when it fails the merge is still green and nothing in this repo
# notices — production silently stops tracking main until somebody thinks to
# look. Twice now:
#
#   * 29 consecutive merges dropped between db08a72 (2026-08-09 00:40Z) and
#     8a3f716 (2026-08-13 12:32Z) — about four and a half days — every one
#     reporting `Remote migration versions not found in local migrations
#     directory`, and every one merging green. Found by accident. This guard
#     was written in response.
#   * a1640a4 (#872, 2026-09-13 09:08Z) through bc78d1b (#881, 2026-09-14
#     00:02Z) — about a day, with three migrations queued behind the first
#     failure. This guard reported `success` for a1640a4 itself. The
#     integration had posted only its two placeholder runs ("Waiting for branch
#     action run to complete"), still `in_progress` a day later, and never
#     posted a verdict at all. The guard waited five minutes for one, found
#     none, and exited 0. A stuck or failing integration is *exactly* the state
#     that produces "no verdict before the timeout", so the guard was silent
#     precisely when it was needed.
#
# So it no longer trusts check runs alone. It asks production directly whether
# this commit's migrations are in `supabase_migrations.schema_migrations` — the
# only authoritative record — and a migration missing there is an alarm however
# the check runs read. Timing out without a verdict is an alarm too, unless the
# database says the commit landed anyway.
#
# That pairing is what keeps the alarm quiet enough to be worth having: most
# pushes to main carry no migration at all, and for those the database
# assertion passes trivially, so a missing verdict on its own never cries wolf.
#
# The database can only answer for migrations. Edge functions leave no trace it
# can be asked about, so a failed `supabase/functions/*` redeploy is still only
# visible through the integration's own verdict — which is why a `failure` there
# alarms even when every migration is applied.
#
# It is deliberately an alarm and NOT a merge gate: the integration only runs
# *after* the push, and on pull requests its check is `skipped` ("creating a new
# preview branch per PR is disabled"), so there is no pre-merge signal to block
# on. The daily schedule remains the backstop — and the database assertion makes
# it a real one, since it now re-checks main's head against production rather
# than re-reading check runs that may never settle.

on:
  push:
    branches:
      - main
  schedule:
    - cron: '40 5 * * *' # Daily re-check of main's head, in case a push-time run never settled.
  workflow_dispatch: {}

permissions:
  contents: read
  # `checks: read` is what makes the check-runs query work at all. Without it
  # GITHUB_TOKEN gets `Resource not accessible by integration (HTTP 403)` and
  # this job fails on every push — which is how it first shipped.
  checks: read
  issues: write

concurrency:
  group: supabase-deploy-guard-${{ github.sha }}
  cancel-in-progress: false

jobs:
  guard:
    name: Confirm the Supabase integration deployed
    runs-on: ubuntu-latest

    steps:
      # Needed for the migration filenames this commit carries — the left-hand
      # side of the comparison against production.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Read the integration's verdict for this commit
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # The integration posts several check runs per commit under the
          # `supabase` app: the real branch-action result plus `skipped` ones
          # for pushes to non-main refs. `filter=all` is required — the default
          # returns only the latest run per name and hides the real verdict.
          # Break as soon as a verdict exists, NOT when nothing is pending: the
          # integration leaves placeholder runs ("Waiting for branch action run
          # to complete") in a non-completed state indefinitely, so waiting for
          # pending to reach zero would always burn the full timeout.
          runs='[]'
          api_err=''
          for _ in $(seq 1 20); do
            # A transient API error must not read as a deploy failure — that
            # would claim production is behind when we simply could not look.
            # It is not a pass either: record that the verdict is unreadable
            # and let the database assertion below settle it.
            if ! runs=$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?filter=all&per_page=100" \
              --jq '[.check_runs[] | select(.app.slug == "supabase")]' 2>/tmp/gh-err); then
              api_err=$(tr -d '\n' < /tmp/gh-err)
              runs='[]'
              break
            fi

            if [ "$(jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")] | length' <<< "$runs")" -gt 0 ]; then
              break
            fi
            sleep 15
          done

          total=$(jq 'length' <<< "$runs")
          pending=$(jq '[.[] | select(.status != "completed")] | length' <<< "$runs")
          succeeded=$(jq '[.[] | select(.conclusion == "success")] | length' <<< "$runs")
          failed=$(jq '[.[] | select(.conclusion == "failure")] | length' <<< "$runs")
          # The summary arrives fenced and multi-line; flatten it so it is safe
          # in a ::error annotation and reads cleanly when quoted.
          reason=$(jq -r '[.[] | select(.conclusion == "failure") | .output.summary // ""][0] // ""' <<< "$runs" \
            | tr -d '`' | tr '\n' ' ' | sed -e 's/  */ /g' -e 's/^ //' -e 's/ $//')

          if [ -n "$api_err" ]; then
            verdict='unreadable'
            reason="$api_err"
            echo "::warning title=Could not read the Supabase verdict::$api_err"
          elif [ "$failed" -gt 0 ]; then
            verdict='failure'
          elif [ "$succeeded" -gt 0 ]; then
            verdict='success'
          else
            # Either every run was skipped, or the branch action never settled
            # inside the wait. This is the a1640a4 state — no longer a pass.
            verdict='unknown'
          fi

          echo "Supabase check runs for ${SHA:0:7}: total=$total pending=$pending succeeded=$succeeded failed=$failed -> $verdict"
          {
            echo "verdict=$verdict"
            echo "total=$total"
            echo "pending=$pending"
            echo 'reason<<REASON_EOF'
            echo "$reason"
            echo 'REASON_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Ask production whether it has this commit's migrations
        id: applied
        env:
          # Session-pooler connection string, password included. The pooler host
          # is required: GitHub runners are IPv4 and cannot reach the IPv6-only
          # direct host. `psql` ships on ubuntu-latest; unlike `pg_dump` a v16
          # client talks to the v17 server happily.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Check runs are hearsay. `supabase_migrations.schema_migrations` is
          # the record production itself keeps, and every migration file on this
          # commit has to appear in it.
          ls supabase/migrations/*.sql 2>/dev/null \
            | sed -e 's#.*/##' -e 's/_.*//' \
            | grep -E '^[0-9]{14}$' \
            | sort -u > /tmp/local-versions.txt || true
          echo "This commit carries $(wc -l < /tmp/local-versions.txt) migration(s)."

          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "state=unknown" >> "$GITHUB_OUTPUT"
            echo "detail=SUPABASE_DB_URL is not set, so production could not be asked." >> "$GITHUB_OUTPUT"
            echo "::warning title=Could not ask production::SUPABASE_DB_URL is not set."
            exit 0
          fi

          SERVICE_FILE="$RUNNER_TEMP/plot-prod-service.conf"
          PLOT_DB_CONNINFO="$SUPABASE_DB_URL" node scripts/write-pg-service.mjs "$SERVICE_FILE" plot_production
          export PGSERVICEFILE="$SERVICE_FILE" PGSERVICE=plot_production

          # The integration applies migrations *after* the push, so a version
          # that is missing right now may simply be in flight. Give it ten
          # minutes — well past a healthy run — before calling that an alarm.
          missing=''
          extra=''
          db_err=''
          read_ok=''
          for _ in $(seq 1 20); do
            if remote=$(psql -At -v ON_ERROR_STOP=1 \
              -c 'select version from supabase_migrations.schema_migrations' 2>/tmp/psql-err); then
              read_ok='yes'
              db_err=''
              printf '%s\n' "$remote" | grep -E '^[0-9]{14}$' | sort -u > /tmp/remote-versions.txt || true
              missing=$(comm -23 /tmp/local-versions.txt /tmp/remote-versions.txt | tr '\n' ' ' | sed -e 's/ *$//')
              extra=$(comm -13 /tmp/local-versions.txt /tmp/remote-versions.txt | tr '\n' ' ' | sed -e 's/ *$//')
              [ -z "$missing" ] && break
            else
              db_err=$(tr -d '\n' < /tmp/psql-err | tail -c 300)
            fi
            sleep 30
          done

          # A read that succeeded earlier still tells us the truth, so prefer it
          # over a connection that dropped on the last attempt.
          if [ -n "$read_ok" ]; then
            if [ -z "$missing" ]; then state='applied'; else state='behind'; fi
          else
            state='unknown'
          fi

          echo "Production migration state for ${SHA:0:7}: $state (missing: ${missing:-none})"
          {
            echo "state=$state"
            echo "missing=$missing"
            echo "extra=$extra"
            echo "detail=$db_err"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether production is tracking main
        id: decide
        # Must run even if a step above died unexpectedly: a guard that goes
        # quiet when it breaks is the bug this workflow exists to prevent.
        # Empty outputs fall through to "could not confirm", which is honest.
        if: always()
        env:
          SHA: ${{ github.sha }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          REASON: ${{ steps.verdict.outputs.reason }}
          TOTAL: ${{ steps.verdict.outputs.total }}
          PENDING: ${{ steps.verdict.outputs.pending }}
          STATE: ${{ steps.applied.outputs.state }}
          MISSING: ${{ steps.applied.outputs.missing }}
          EXTRA: ${{ steps.applied.outputs.extra }}
          DB_DETAIL: ${{ steps.applied.outputs.detail }}
        run: |
          set -euo pipefail

          # The two sources, in order of authority:
          #
          #   integration | database | outcome
          #   ------------|----------|-----------------------------------------
          #   failure     | any      | alarm — it told us outright
          #   any         | behind   | alarm — production is provably missing it
          #   any         | applied  | pass — production has the commit, which
          #               |          |   is the only thing the guard is for
          #   success     | unknown  | pass — one good source, and it is green
          #   else        | unknown  | alarm — nothing established that
          #               |          |   production received this commit. This
          #               |          |   is the case that used to exit 0.
          alarm='false'
          title=''
          detail=''

          if [ "$VERDICT" = 'failure' ]; then
            alarm='true'
            title='The Supabase integration reported failure'
            detail="${REASON:-The integration reported failure with no summary.}"
          elif [ "$STATE" = 'behind' ]; then
            alarm='true'
            title='Production is missing migrations from this commit'
            detail="Not in supabase_migrations.schema_migrations: ${MISSING}"
          elif [ "$STATE" = 'applied' ]; then
            title='Production has this commit'"'"'s migrations'
          elif [ "$VERDICT" = 'success' ]; then
            title='The Supabase integration reported success'
            detail='Production could not be asked to confirm it.'
          else
            alarm='true'
            title='Could not confirm that production received this commit'
            detail="Integration verdict: ${VERDICT} (runs=${TOTAL}, still running=${PENDING}). Database: ${DB_DETAIL:-not reachable}."
          fi

          # Explicit flag for the issue step. Do not gate that step on
          # `missing != ''` or similar: if this step dies early the output is
          # empty, and GitHub's loose comparison treats '' and '0' as equal, so
          # the gate would depend on coercion rather than on a real decision.
          {
            echo "alarm=$alarm"
            echo "title=$title"
            echo 'detail<<DETAIL_EOF'
            echo "$detail"
            echo 'DETAIL_EOF'
          } >> "$GITHUB_OUTPUT"

          if [ "$alarm" = 'false' ]; then
            {
              echo "## $title"
              echo ""
              echo "\`${SHA:0:7}\` — integration verdict \`$VERDICT\`, database \`$STATE\`."
              if [ -n "$detail" ]; then echo ""; echo "$detail"; fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error title=Supabase deploy guard::$title — $detail"
          {
            echo "## $title"
            echo ""
            echo "\`${SHA:0:7}\` — integration verdict \`$VERDICT\`, database \`$STATE\`."
            echo ""
            echo "> ${detail:-(no detail)}"
            echo ""
            echo "Migrations and edge functions on production are behind main, and they"
            echo "will stay behind for every later merge until this is cleared."
            if [ -n "$EXTRA" ]; then
              echo ""
              echo "Production also has version(s) with no file on this commit, which is"
              echo "what makes the integration refuse every later push:"
              echo ""
              echo "> $EXTRA"
            fi
            echo ""
            echo "Diagnose the history with \`supabase migration list\`; any row with"
            echo "\`local\` or \`remote\` blank is the drift."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Raise an issue so a silent integration cannot go unnoticed
        if: failure() && steps.decide.outputs.alarm == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TITLE: ${{ steps.decide.outputs.title }}
          DETAIL: ${{ steps.decide.outputs.detail }}
          EXTRA: ${{ steps.applied.outputs.extra }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          label='supabase-deploy-failed'
          gh label create "$label" \
            --color 'b60205' \
            --description 'The Supabase integration failed to deploy a merge to main' \
            2>/dev/null || true

          body=$(
            printf '%s\n' \
              "$TITLE, for [\`${SHA:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA)." \
              '' \
              "> ${DETAIL:-(no detail)}" \
              '' \
              'Production is behind main, and every later merge stays behind until this clears.' \
              '' \
              '```' \
              'npx supabase migration list --db-url "postgresql://postgres:<url-encoded prod password>@db.mkegtssedjyqldysvzga.supabase.co:5432/postgres"' \
              '```' \
              '' \
              'Any row with `local` or `remote` blank is the drift. A remote-only version' \
              '(applied, no file on main) is cleared with `supabase migration repair` or by' \
              'landing the file; a local-only version is just normal pending state.' \
              '' \
              "Raised by [Supabase deploy guard]($RUN_URL)."
          )

          existing=$(gh issue list --state open --label "$label" --limit 1 --json number --jq '.[0].number // ""')

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create \
              --title 'Supabase integration failed to deploy a merge to main' \
              --label "$label" \
              --body "$body"
          fi
