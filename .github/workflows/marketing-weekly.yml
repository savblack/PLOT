name: Marketing — weekly report + newsletter

on:
  schedule:
    # Thursday 13:00 UTC — after the Thursday trending snapshot (08:00), so the
    # newsletter features the fresh chart and lands before the weekend (not Friday).
    - cron: '0 13 * * 4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Weekly performance report
        run: node marketing/metrics/report.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MARKETING_ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
      # HELD: the newsletter only sends on a manual run (workflow_dispatch),
      # not on the Thursday cron, until the first Thursday edition is reviewed.
      # Re-enable auto-send by removing this `if:`.
      - name: Subscriber newsletter
        if: github.event_name == 'workflow_dispatch'
        run: node marketing/newsletter/send-digest.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: weekly report/newsletter
        run: bash .github/scripts/marketing-alert.sh
