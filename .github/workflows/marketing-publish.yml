name: Marketing — reconcile

# The daily job no longer sends. Buffer does the sending now: the week is pushed
# into its queue at generation time, reviewed and adjusted there, and sent on
# schedule. What is left for us is finding out what happened — Buffer has no
# webhook, so a post that sent, failed, was rewritten or was deleted reaches the
# database only because this run goes and asks.
#
# The filename is unchanged on purpose. It is still the daily marketing run, it
# is still what /publish-now and the desk's button dispatch, and renaming it
# would throw away the run history that makes "when did this last work?"
# answerable.

on:
  schedule:
    # 02:00 UTC. This repo's scheduler starts the job hours later. A 5.5 hour
    # lag is about 3:30am Eastern, still before the 9:00am ET publish slot.
    # The job no longer sends. Buffer does, and Buffer is punctual. The lag
    # costs how soon a freed slot is refilled.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      retry_failed:
        description: 'Re-push publications that failed to reach Buffer'
        type: boolean
        default: false
      dry_run:
        description: 'Report what would change; write nothing'
        type: boolean
        default: false
      render_only:
        description: 'Only render missing cards. Skip reconcile, schedule, and the queue check.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: marketing-publish
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Card render retries live here, not only on Sunday. The 4 Oct 2026 weekly
      # batch exited at copy save (two files rejected) and never reached
      # generate.mjs, so the week sat at copy_ready with no cards. Playwright
      # is installed every day so this step can finish those rows before the
      # top-up. A card post with no media is not queued.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # Re-push first when asked: a row that never reached Buffer has nothing to
      # reconcile, so retrying it is a scheduling job, not a reading one.
      - name: Re-push failed publications
        if: inputs.retry_failed && inputs.render_only != true
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          # Repo variable; unset means draft (the safe default in schedule.mjs).
          BUFFER_PUSH_AS_DRAFT: ${{ vars.BUFFER_PUSH_AS_DRAFT }}
        run: node marketing/publish/schedule.mjs --retry-failed

      - name: Reconcile the Buffer queue
        if: inputs.render_only != true
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node marketing/publish/reconcile.mjs

      # Render before the top-up. copy_ready rows, failed renders, and approved
      # rows that never got a card are finished here. Questions stay text-only.
      # continue-on-error so a render crash does not skip the queue top-up for
      # posts that already have cards. The step below still fails the job.
      - name: Render missing cards
        id: render
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MARKETING_ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
        run: node marketing/generate/generate.mjs

      # Top the queue back up, AFTER reconciling and rendering. This is what
      # makes the whole thing work on a capped plan.
      #
      # The queue holds 10 posts per channel and a week produces about 16, so a
      # week cannot go in at once. It goes in as a rolling window instead: each
      # day's sends free their slots, and this step fills them with the next
      # posts due. Without it the overflow from Sunday's batch would sit queued
      # until the FOLLOWING Sunday and simply never go out.
      #
      # Posts are pushed in scheduled_for order, so the slots always go to the
      # soonest posts and the horizon stays contiguous rather than gappy.
      - name: Top up the Buffer queue
        if: inputs.render_only != true
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          # Repo variable; unset means draft (the safe default in schedule.mjs).
          BUFFER_PUSH_AS_DRAFT: ${{ vars.BUFFER_PUSH_AS_DRAFT }}
        run: node marketing/publish/schedule.mjs

      - name: Fail the job when card render failed
        if: steps.render.outcome == 'failure'
        run: exit 1

      # Watchdog for the weekly batch, deliberately parked in this job rather
      # than that one. When the 2026-08-30 batch was refused a runner over
      # billing, its own "Alert on failure" step could not run either, and the
      # empty week went unnoticed until someone looked at the site. This job
      # kept running throughout. `always()` so a failed publish cannot mask an
      # empty queue — those are different problems and both want reporting.
      - name: Check the queue ahead
        id: queue
        if: always() && inputs.render_only != true
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node marketing/publish/queue-check.mjs --days=3

      - name: Warn when nothing is queued
        if: always() && inputs.render_only != true && steps.queue.outputs.empty == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: reconcile
          ALERT_SUBJECT: 'Plot marketing: nothing is queued'
          ALERT_BODY: >-
            No marketing posts are scheduled for the next 3 days. Either the
            weekly batch did not run, or everything it produced was rejected.
            Nothing will publish and theplot.tv/whats-on will go stale until a
            week is generated — rerun the weekly batch workflow.
        run: bash .github/scripts/marketing-alert.sh

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: reconcile
        run: bash .github/scripts/marketing-alert.sh
