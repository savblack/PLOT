name: Refresh broadcast Guide
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*_broadcast_guide.sql'
      - 'scripts/guide/**'
      - 'packages/core/broadcastMarkets.json'
      - '.github/workflows/broadcast-guide.yml'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write # failure alerting opens and closes an `incident` issue
concurrency:
  group: broadcast-guide-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test feed validation
        run: python3 -m unittest discover -s scripts/guide -p 'test_*.py'
      - name: Refresh last-valid snapshots
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/guide/refresh.py --publish
      - name: Retain per-channel coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: broadcast-guide-health
          path: .guide-cache/refresh/health.json
          retention-days: 7

      # Failure alerting. Without these three steps a failure here was only a red
      # X in the Actions tab, which is how the July 2026 `history` outage went
      # unnoticed for two weeks. An `incident` issue opens on failure and closes
      # on the next success (see .github/scripts/job-incident.sh), and the admin
      # is emailed once per new incident rather than once per failed run. The
      # email also goes out if the issue step itself broke, so a GitHub API
      # problem cannot swallow the alert.
      # `cancelled()` too: hitting timeout-minutes cancels the job rather than
      # failing it, and a refresh that hangs is as broken as one that errors.
      - name: Open an incident issue
        id: incident
        if: (failure() || cancelled())
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: broadcast-guide
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILURE_NOTE: 'The broadcast Guide snapshots were not refreshed. The app keeps showing the last valid snapshot, which goes stale.'
        run: bash .github/scripts/job-incident.sh open
      - name: Email the admin about a new incident
        if: (failure() || cancelled()) && (steps.incident.outcome != 'success' || steps.incident.outputs.opened == 'true')
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: broadcast-guide
          ALERT_SUBJECT: 'Plot: broadcast Guide refresh failed'
          FAILURE_NOTE: 'The broadcast Guide snapshots were not refreshed. The app keeps showing the last valid snapshot, which goes stale.'
        run: bash .github/scripts/marketing-alert.sh
      - name: Close the incident issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: broadcast-guide
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/job-incident.sh close
