name: Refresh broadcast Guide
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*_broadcast_guide.sql'
      - 'scripts/guide/**'
      - 'packages/core/broadcastMarkets.json'
      - '.github/workflows/broadcast-guide.yml'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: broadcast-guide-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test feed validation
        run: python3 -m unittest discover -s scripts/guide -p 'test_*.py'
      - name: Refresh last-valid snapshots
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/guide/refresh.py --publish
      - name: Retain per-channel coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: broadcast-guide-health
          path: .guide-cache/refresh/health.json
          retention-days: 7
