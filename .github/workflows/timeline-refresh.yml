name: Timeline refresh — weekly PR

# Keeps the marketing site's timeline and app-mockup hero on current titles.
# Opens a PR rather than committing: a newly appended title lands with an empty
# note, and the notes are title-specific jokes a human writes in review.
#
# GitHub will not start another Actions workflow from a PR opened with
# GITHUB_TOKEN. CircleCI is an external GitHub App, so it receives the PR event
# and validates the branch without spending GitHub Actions minutes.
#
# The merge is a second job, triggered by CircleCI's successful commit status.
# This replaces `gh pr merge --auto`, which
# needed branch protection to mean anything: protection requires GitHub Pro on a
# private repo, and without it there are no required checks to wait on, so
# --auto fired the merge immediately and a red refresh landed broken content.
# Gating on CircleCI directly restores "a red refresh stays open" without
# depending on protection — the same approach dependabot-automerge.yml uses,
# and for the same reason.
#
# The refresh also appears on the marketing board in Linear, opened by
# marketing-linear-mirror and marked Urgent, so a week's content change is
# visible somewhere a person actually looks rather than only in a PR list. That
# card is a record, not a gate: this job still merges on green CI, and the card
# lands in Published when it does. /approve on the card merges a refresh this
# job left open — a red run since fixed, say — and is held to the same two
# checks used below.

on:
  schedule:
    - cron: '0 9 * * 1' # 09:00 UTC Monday, after the weekend's trending settles
  workflow_dispatch:
  status:

concurrency:
  # Keyed per commit so a merge check for one refresh never queues behind
  # another, and so unrelated CI completions do not serialise against the
  # weekly refresh itself.
  group: timeline-refresh-${{ github.event.sha || github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    # Every commit-status update in the repo triggers this workflow for the merge job
    # below; the refresh itself must only run on its schedule or by hand.
    if: github.event_name != 'status'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Refresh timeline and trending hero
        id: refresh
        run: |
          node scripts/refresh-timeline.mjs | tee refresh.log
          {
            echo 'summary<<EOF'
            cat refresh.log
            echo EOF
          } >> "$GITHUB_OUTPUT"
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Open a PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.refresh.outputs.summary }}
        run: |
          rm -f refresh.log
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed this week."
            exit 0
          fi

          BRANCH="timeline-refresh/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add apps/website/data/timeline.json apps/website/images apps/website/index.html
          git commit -m "content(website): refresh timeline posters and trending hero"
          git push -u origin "$BRANCH"

          # Entries with no note yet are the only thing needing a human.
          node -e '
            const d = require("./apps/website/data/timeline.json");
            const need = d.entries.filter(e => !e.note);
            process.stdout.write(need.length
              ? need.map(e => `- **${e.title}** (${e.date_label})`).join("\n")
              : "None: every entry already has a note.");
          ' > notes.md

          {
            echo 'Automated weekly refresh from `scripts/refresh-timeline.mjs`.'
            echo
            echo '## Entries with no note'
            echo
            cat notes.md
            echo
            echo
            echo 'This PR auto-merges once CI passes; it is not held for notes. It also appears on the marketing board in Linear within five minutes as an Urgent card, which is where to look if you want to read it before it lands or merge one that CI left open.'
            echo
            echo 'A card with no note renders without one. Notes are title-specific, so if you want the voice back, add it to `apps/website/data/timeline.json` afterwards and the next refresh will keep it.'
            echo
            echo '## What the run did'
            echo
            echo '```'
            printf '%s\n' "$SUMMARY"
            echo '```'
            echo
            echo 'Check the Cloudflare Pages preview on this PR to see the timeline and the app-mockup hero before merging.'
          } > pr-body.md

          # Assigned so the run is visible in a filterable place, even though
          # nothing blocks on a human: a bot PR that mentions nobody is silent
          # unless the repo is watched on "All activity".
          URL=$(gh pr create \
            --title "content(website): refresh timeline posters and trending hero" \
            --body-file pr-body.md \
            --assignee "${{ github.repository_owner }}")
          echo "Opened $URL"

          echo "CircleCI will validate $BRANCH; the automerge job lands it if CI passes."
          rm -f notes.md pr-body.md

  # Merges the refresh PR once CircleCI has actually passed its head commit.
  # Deliberately narrow: only this workflow's own branches, only a bot-authored
  # PR, only a successful run. Anything unexpected exits 0 and leaves the PR
  # open for a human.
  automerge:
    if: >
      github.event_name == 'status' &&
      github.event.context == 'ci/circleci: check' &&
      github.event.state == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the refresh PR now CI is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STATUS_SHA: ${{ github.event.sha }}
        run: |
          set -euo pipefail

          PR_NUM=$(gh api "repos/$GH_REPO/commits/$STATUS_SHA/pulls" \
            --jq '[.[] | select(.state == "open")][0].number // empty')
          if [ -z "$PR_NUM" ]; then
            echo "No open PR for commit '$STATUS_SHA'. Nothing to do."
            exit 0
          fi

          HEAD_BRANCH=$(gh pr view "$PR_NUM" --json headRefName --jq '.headRefName')
          if [[ "$HEAD_BRANCH" != timeline-refresh/* ]]; then
            echo "PR #$PR_NUM branch '$HEAD_BRANCH' is not a timeline refresh. Leaving it open."
            exit 0
          fi

          # Defence in depth: the branch prefix is guessable, so confirm the PR
          # was opened by the bot rather than by a person pushing a branch that
          # happens to match.
          AUTHOR=$(gh pr view "$PR_NUM" --json author --jq '.author.login')
          if [ "$AUTHOR" != "github-actions[bot]" ] && [ "$AUTHOR" != "app/github-actions" ]; then
            echo "PR #$PR_NUM author is '$AUTHOR', not the refresh bot. Leaving it open."
            exit 0
          fi

          HEAD_REPO=$(gh pr view "$PR_NUM" --json headRepository --jq '.headRepository.nameWithOwner')
          HEAD_SHA=$(gh pr view "$PR_NUM" --json headRefOid --jq '.headRefOid')
          if [ "$HEAD_REPO" != "$GH_REPO" ] || [ "$HEAD_SHA" != "$STATUS_SHA" ]; then
            echo "PR #$PR_NUM does not match the repository and commit that passed CI. Leaving it open."
            exit 0
          fi

          echo "CI passed for $HEAD_BRANCH -> merging PR #$PR_NUM"
          gh pr merge "$PR_NUM" --squash --delete-branch --match-head-commit "$HEAD_SHA"
