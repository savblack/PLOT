name: Marketing — render

# Step 3 of the daily pipeline: render cards, upload media, send the veto digest.
# Normally dispatched by the copy worker (Claude Code / Codex) right after it
# writes copy. The daily cron is a safety net: if the worker never dispatched,
# this still picks up any copy_ready posts later in the day. API-key-free.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *' # safety net, hours after the copy worker should have run

permissions:
  contents: read

concurrency:
  group: marketing-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render media + send veto digest
        run: node marketing/generate/generate.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MARKETING_ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: render
          FAILURE_NOTE: 'No veto digest was sent, so nothing will publish (fail-closed).'
        run: bash .github/scripts/marketing-alert.sh
