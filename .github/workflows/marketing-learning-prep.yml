name: Marketing — Sunday learning prep

# Runs after the Sunday publish slot and before the next weekly generation.
on:
  schedule:
    - cron: '45 23 * * 6' # 9:45am Sydney Sunday (AEST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-learning-prep
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Collect metrics and prepare learning artifact
        run: node marketing/scripts/automation.mjs learn:prepare
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Send weekly metrics report
        run: node marketing/metrics/report.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MARKETING_ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: Sunday learning prep
          FAILURE_NOTE: 'The weekly comparison artifact was not prepared before the next batch window.'
        run: bash .github/scripts/marketing-alert.sh
