# Daily check that the database's write paths still work.
#
# WHY: between 2026-07-25 and 2026-08-03 every write to `history` failed in
# production and nothing noticed for two weeks. A trigger's ON CONFLICT target
# named a unique constraint an earlier migration had dropped, so the trigger
# raised 42P10 and — as an AFTER trigger in the same transaction — aborted the
# statement that fired it. Marking a title watched, editing a rating and editing
# a review all failed silently. It only surfaced because an unrelated backfill
# happened to touch the table.
#
# There is no error reporting on the database itself, and low pre-launch traffic
# means "no rows written lately" is not a usable signal on its own. This checks
# the structure instead, which is traffic-independent: every trigger function's
# upsert key must resolve against a real constraint, and every table it
# references must exist.
#
# Read-only — introspection only, no writes. See the script header for why it
# deliberately avoids a write-and-rollback probe (http_request triggers are not
# reliably transactional).
#
# Uses SUPABASE_DB_URL, the same secret db-backup.yml already relies on, so no
# new secret is required.

name: DB write paths (daily)

on:
  schedule:
    - cron: '25 6 * * *'    # 06:25 UTC daily, after the nightly backup
  workflow_dispatch: {}      # manual runs for testing
  # Also on changes to anything that can name a constraint, so a mismatch is
  # caught on the PR that introduces it rather than up to a day later.
  #
  # Application code is in this list because leaving it out cost us the bug the
  # check was extended to catch: the web import upserted `history` against a
  # dropped constraint, and the PR that fixed it touched no migration, so this
  # workflow never ran on it. An `onConflict` string is a reference to a
  # database object wherever it is written.
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'packages/core/**'
      - 'apps/web/src/**'
      - 'apps/mobile/**'
      - 'scripts/check-db-write-paths.mjs'
      - 'scripts/lib/dbWritePathChecks.mjs'
      - '.github/workflows/db-write-paths.yml'

concurrency:
  group: db-write-paths
  cancel-in-progress: false

jobs:
  check:
    name: Check trigger write paths
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # The runner's default psql is v16; Supabase is on PG 17. Only pg_dump
      # hard-refuses a newer server, but match anyway so behaviour is the same
      # as db-backup.yml.
      - name: Install psql 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Check write paths
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is not set — cannot check. Add it in Settings → Secrets → Actions." >&2
            exit 1
          fi
          npm run db:write-paths
