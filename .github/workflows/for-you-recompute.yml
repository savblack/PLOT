name: For You recompute

on:
  schedule:
    - cron: '30 7 * * *' # Nightly; rebuilds the title-similarity table from the day's signals.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - name: Recompute title similarity
        run: |
          # --fail still aborts the step on a non-200, so a failed run stays a
          # red job. On success the body carries cross_user_pairs, which is the
          # cue to restore tier 1 of get_for_you() (retired 2026-09-13 because
          # it was always 0). Echoing it into the step summary puts that number
          # on the run page instead of buried in the log body, so noticing it
          # does not depend on anyone thinking to go look.
          response="$(curl --fail --silent --show-error --request POST "$SUPABASE_URL/functions/v1/for-you-recompute" \
            --header "x-cron-secret: $FOR_YOU_CRON_SECRET")"
          echo "$response"
          {
            echo '### For You recompute'
            echo ''
            echo '```json'
            echo "$response"
            echo '```'
            echo ''
            echo 'A non-zero `cross_user_pairs` means cross-user overlap finally exists'
            echo 'and tier 1 of `get_for_you()` is worth restoring. See'
            echo '`supabase/migrations/20260913110000_for_you_retire_cross_user_tier.sql`.'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          # There is no repo secret literally named SUPABASE_URL (only
          # VITE_SUPABASE_URL and SUPABASE_DB_URL exist) — referencing it
          # directly silently resolves to an empty string, which made curl
          # fail client-side ("URL rejected: No host part in the URL")
          # before the request ever reached Supabase. See marketing
          # workflows (e.g. marketing-weekly-batch.yml) for the same pattern.
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          FOR_YOU_CRON_SECRET: ${{ secrets.FOR_YOU_CRON_SECRET }}
