# Nightly check that production and Staging still match the migrations on main,
# and that Staging's schema still matches production's.
#
# WHY: on 2026-09-25 Staging turned out to be 18 migrations behind main, with
# hand-applied changes nobody had recorded, and a version collision that let
# main's refresh_premium_badges be "applied" on Staging without ever running.
# Production was carrying four migrations that were on no branch. Nothing
# noticed any of it; it came out of a one-off audit. This is that audit, run
# every night. See scripts/check-migration-drift.mjs.
#
# Read-only: catalog queries inside `begin read only … rollback`.
#
# Not run on pull requests. A PR's own migrations are unrecorded by design, and
# Staging drift a PR did not cause would fail it. Run it by hand on a branch
# instead (`pnpm run db:drift`), which also catches a version the branch shares
# with something already recorded on Staging.
#
# Secrets: SUPABASE_DB_URL (production, already used by db-backup.yml) and
# PLOT_STAGING_DB_PASSWORD (Staging's database password; add it in
# Settings → Secrets → Actions).

name: Migration drift (nightly)

on:
  schedule:
    - cron: '40 6 * * *'    # 06:40 UTC daily, after db-write-paths
  workflow_dispatch: {}      # manual runs

permissions:
  contents: read
  issues: write # failure alerting opens and closes an `incident` issue

concurrency:
  group: migration-drift
  cancel-in-progress: false

jobs:
  check:
    name: Check migration drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Supabase is on PG 17; match it, as db-write-paths.yml does.
      - name: Install psql 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # The script only uses Node built-ins and scripts/lib, so there is no
      # install step: nothing third-party runs next to these credentials.
      - name: Check drift
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PLOT_STAGING_DB_PASSWORD: ${{ secrets.PLOT_STAGING_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$PLOT_STAGING_DB_PASSWORD" ]; then
            echo "SUPABASE_DB_URL and PLOT_STAGING_DB_PASSWORD must both be set. Add them in Settings → Secrets → Actions." >&2
            exit 1
          fi
          node scripts/check-migration-drift.mjs

      # Failure alerting. Without these three steps a failure here was only a red
      # X in the Actions tab, which is how the July 2026 `history` outage went
      # unnoticed for two weeks. An `incident` issue opens on failure and closes
      # on the next success (see .github/scripts/job-incident.sh), and the admin
      # is emailed once per new incident rather than once per failed run. The
      # email also goes out if the issue step itself broke, so a GitHub API
      # problem cannot swallow the alert.
      - name: Open an incident issue
        id: incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: migration-drift
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILURE_NOTE: 'Production or Staging no longer matches the migrations on main, or the check could not connect. Run pnpm run db:drift locally to see which.'
        run: bash .github/scripts/job-incident.sh open
      - name: Email the admin about a new incident
        if: failure() && (steps.incident.outcome != 'success' || steps.incident.outputs.opened == 'true')
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: migration-drift
          ALERT_SUBJECT: 'Plot: nightly migration drift check failed'
          FAILURE_NOTE: 'Production or Staging no longer matches the migrations on main, or the check could not connect. Run pnpm run db:drift locally to see which.'
        run: bash .github/scripts/marketing-alert.sh
      - name: Close the incident issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: migration-drift
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/job-incident.sh close
