name: Marketing — trending snapshot

on:
  schedule:
    - cron: '0 8 * * 1' # Monday 08:00 UTC — refreshes the weekly chart before the generate/publish cycle
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write weekly trending snapshot
        run: node marketing/snapshot/write-snapshot.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: trending-snapshot
          FAILURE_NOTE: 'The chart page will keep showing last week until this is re-run.'
        run: bash .github/scripts/marketing-alert.sh
