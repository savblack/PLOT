name: Netflix Top 10 — daily sync

on:
  schedule:
    - cron: '0 12 * * *' # 12:00 UTC daily — free Tudum feed, no API quota to manage
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netflix-top10
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync Netflix Top 10
        run: node scripts/sync-netflix-top10.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
