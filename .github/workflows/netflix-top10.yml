name: Netflix Top 10 — daily sync

on:
  schedule:
    - cron: '0 12 * * *' # 12:00 UTC daily — free Tudum feed, no API quota to manage
  workflow_dispatch:

permissions:
  contents: read
  issues: write # failure alerting opens and closes an `incident` issue

concurrency:
  group: netflix-top10
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync Netflix Top 10
        run: node scripts/sync-netflix-top10.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      # Failure alerting. Without these three steps a failure here was only a red
      # X in the Actions tab, which is how the July 2026 `history` outage went
      # unnoticed for two weeks. An `incident` issue opens on failure and closes
      # on the next success (see .github/scripts/job-incident.sh), and the admin
      # is emailed once per new incident rather than once per failed run. The
      # email also goes out if the issue step itself broke, so a GitHub API
      # problem cannot swallow the alert.
      - name: Open an incident issue
        id: incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: netflix-top10
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILURE_NOTE: 'The Netflix Top 10 chart was not refreshed, so it shows yesterday''s list until the job succeeds.'
        run: bash .github/scripts/job-incident.sh open
      - name: Email the admin about a new incident
        if: failure() && (steps.incident.outcome != 'success' || steps.incident.outputs.opened == 'true')
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: netflix-top10
          ALERT_SUBJECT: 'Plot: daily Netflix Top 10 sync failed'
          FAILURE_NOTE: 'The Netflix Top 10 chart was not refreshed, so it shows yesterday''s list until the job succeeds.'
        run: bash .github/scripts/marketing-alert.sh
      - name: Close the incident issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: netflix-top10
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/job-incident.sh close
