name: Marketing — token refresh

on:
  schedule:
    - cron: '0 2 * * 1' # Mondays; refreshes IG/Threads tokens with <21 days left
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketing-token-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh expiring tokens
        run: node marketing/setup/refresh-tokens.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: token refresh
          FAILURE_NOTE: 'Publishing on that platform will break when the token expires.'
        run: bash .github/scripts/marketing-alert.sh
