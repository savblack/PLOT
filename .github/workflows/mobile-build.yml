name: Mobile — iOS store build

# Builds the iOS app on Expo's servers (EAS) with the `production` profile,
# so a release no longer needs someone to run `eas build` on a Mac. EAS owns
# the build number (`appVersionSource: remote`, `autoIncrement`), and its
# `production` environment holds the EXPO_PUBLIC_* config, so nothing here
# carries app settings. See docs/ops/mobile-builds.md.
#
# Started by release-please.yml when it tags a new mobile-vX.Y.Z (a tag made
# with GITHUB_TOKEN does not start other workflows, so it calls this one
# directly), and by hand from the Actions tab for any ref.
#
# After the build it sends that build to TestFlight with `eas submit`, using
# the App Store Connect API key EAS already holds (no Apple login here). That
# is an upload to App Store Connect only: it never submits for App Review,
# which stays a person's click. TestFlight does not need an App Store version
# record matching `expo.version`; 1.4.0 builds 6 to 8 were accepted while App
# Store Connect's version said 1.2.0 (docs/ops/mobile-builds.md).
#
# A manual run can skip the build and send an existing one (`build_id`), or
# build without sending (`submit: false`).
#
# Needs the repo secret EXPO_TOKEN: an expo.dev access token for the
# `savblack` account. Without it the job says so and exits green.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (the release tag)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag or commit)
        type: string
        default: main
      submit:
        description: Send the build to TestFlight afterwards
        type: boolean
        default: true
      build_id:
        description: Skip building and send this existing EAS build id to TestFlight
        type: string
        default: ''

permissions:
  contents: read
  issues: write # failure alerting opens and closes an `incident` issue

concurrency:
  group: mobile-build
  cancel-in-progress: false

jobs:
  ios:
    runs-on: ubuntu-latest
    # EAS's free tier can queue a build for a while before it starts.
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check for EXPO_TOKEN
        id: token
        run: |
          if [ -n "$EXPO_TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::EXPO_TOKEN is not set, so no build was started."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.ready == 'true'
        with:
          ref: ${{ inputs.ref }}
      - name: Set up pnpm
        if: steps.token.outputs.ready == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.token.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      # The app config names config plugins, which eas-cli resolves from
      # node_modules before it uploads the project.
      - if: steps.token.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build on EAS and wait for it
        id: build
        if: steps.token.outputs.ready == 'true' && !inputs.build_id
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build --platform ios --profile production \
            --non-interactive --wait --json > "$RUNNER_TEMP/build.json"
          python3 - "$RUNNER_TEMP/build.json" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys
          builds = json.load(open(sys.argv[1]))
          # `eas build --json` lists builds without a project block, so the
          # page URL is built from the id (account savblack, project plot).
          for b in builds:
              url = f"https://expo.dev/accounts/savblack/projects/plot/builds/{b.get('id')}"
              print(f"iOS {b.get('appVersion')} ({b.get('appBuildVersion')}): {b.get('status')} [build page]({url})")
          EOF
          cat "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json,sys; print("id=" + json.load(open(sys.argv[1]))[0]["id"])' \
            "$RUNNER_TEMP/build.json" >> "$GITHUB_OUTPUT"

      # Release-please calls this without `submit`, which reads as false in a
      # workflow_call, so only an explicit `false` from a manual run skips it.
      - name: Send the build to TestFlight
        id: submit
        if: steps.token.outputs.ready == 'true' && (github.event_name != 'workflow_dispatch' || inputs.submit)
        working-directory: apps/mobile
        env:
          BUILD_ID: ${{ inputs.build_id || steps.build.outputs.id }}
        run: |
          set -euo pipefail
          if [ -z "$BUILD_ID" ]; then echo "::error::No build id to send."; exit 1; fi
          npx --yes eas-cli@latest submit --platform ios --profile production \
            --id "$BUILD_ID" --non-interactive --wait
          echo "Sent build \`$BUILD_ID\` to TestFlight. Internal testers in \"Plot team\" get it once Apple finishes processing (usually 10 to 30 minutes). Nothing was submitted for App Review." >> "$GITHUB_STEP_SUMMARY"

      - name: Open an incident issue
        id: incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: mobile-build
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILURE_NOTE: "${{ steps.submit.outcome == 'failure' && 'The iOS build finished but sending it to TestFlight failed, so testers will not get it. The run log says why; the build can be resent from Actions with its build id.' || 'The iOS store build for this release failed, so there is no build to send to TestFlight or App Review.' }}"
        run: bash .github/scripts/job-incident.sh open
      - name: Email the admin about a new incident
        if: failure() && (steps.incident.outcome != 'success' || steps.incident.outputs.opened == 'true')
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: mobile-build
          ALERT_SUBJECT: "${{ steps.submit.outcome == 'failure' && 'Plot: the iOS build did not reach TestFlight' || 'Plot: the iOS build failed' }}"
          FAILURE_NOTE: "${{ steps.submit.outcome == 'failure' && 'The iOS build finished but sending it to TestFlight failed, so testers will not get it. The run log says why; the build can be resent from Actions with its build id.' || 'The iOS store build for this release failed, so there is no build to send to TestFlight or App Review.' }}"
        run: bash .github/scripts/marketing-alert.sh
      - name: Close the incident issue on recovery
        if: success() && steps.token.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: mobile-build
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/job-incident.sh close
