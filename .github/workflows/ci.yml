name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Lets a bot-opened PR get the repo's own checks. GitHub will not start a
  # workflow from an event made with GITHUB_TOKEN, so a PR opened by
  # timeline-refresh.yml never triggers `pull_request` — but workflow_dispatch
  # is an explicit exception to that rule, so that job dispatches this workflow
  # against its branch and the required contexts get reported on the PR head.
  workflow_dispatch:

permissions:
  contents: read

# Supersede a PR's in-flight run when its branch is pushed again. Agent sessions
# push repeatedly, and until now every abandoned run still ran to completion and
# still billed a full minute per job. Pushes to main are deliberately NOT
# cancelled: each commit that lands keeps its own smoke run, so main is never
# left unverified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history, because the secret scan below diffs against the PR base
          # (or the previous push), which a shallow clone can't reach. Costs a few
          # seconds: .git is ~146 MB over ~1,000 commits.
          fetch-depth: 0

      # Folded in from what used to be a standalone `secret-scan` job. Actions
      # bills every job rounded UP to a whole minute and this scan's median
      # runtime is 8s, so owning a job cost a full billed minute per run
      # (~750 min/month) for 8 seconds of work. It stays the FIRST step so a leak
      # still fails within seconds, before the install and build rather than
      # after them — the fail-fast property the separate job was giving us.
      - name: Scan changed lines for secret-shaped strings
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/scan-secrets.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            ./scripts/scan-secrets.sh "${{ github.event.before }}" "${{ github.sha }}"
          else
            # Manual or dispatched run on a branch. Diff against main: that is
            # the only meaningful baseline, and it is what the eventual merge
            # will introduce. Do NOT fall back to the empty-tree hash here —
            # scanning every file trips on legitimate base64 (the embedded font
            # in marketing/templates/base.css matches the AWS-key shape), so a
            # whole-tree scan fails on a clean repo.
            git fetch --no-tags --quiet origin main
            ./scripts/scan-secrets.sh origin/main "${{ github.sha }}"
          fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Folded in from what used to be a standalone `edge-typecheck` job, for the
      # same reason #563 folded the secret scan in: Actions bills every job
      # rounded UP to a whole minute, and this one's real work is ~25s, so owning
      # a job cost a full billed minute per run (~730 min/month). `check` totals
      # ~60s, so it absorbs this and still lands inside one 2-minute bill.
      #
      # Deliberately placed BEFORE `npm ci`. check-edge-types.sh explains that
      # Deno must not find a node_modules/ directory or it switches to node
      # resolution and gives up on every npm: specifier — which silently skipped
      # four functions until `--node-modules-dir=none` was added. The flag makes
      # it robust either way, but running before the install keeps this step's
      # environment identical to the standalone job it replaces.
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Edge functions are hand-deployed: `npm run build` does not compile them
      # and no test imports them, so this is the only gate on them. Unconditional
      # on purpose — a paths gate would burn the minute it saves, and this way the
      # functions are checked on 100% of PRs rather than only the ones that touch
      # them.
      - name: Typecheck edge functions
        run: npm run edge:check

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check shared footer is in sync
        run: npm run footer:check

      - name: Check design tokens are in sync (web ↔ core ↔ mobile)
        run: npm run tokens:check

      - name: Check marketing tokens are in sync (website + email + collateral)
        run: npm run tokens:marketing

      - name: Check auth email templates are in sync
        run: npm run emails:check

      # Catches a migration recreating a function with a different ON CONFLICT
      # target, which is how every write to `history` broke for two weeks in
      # July 2026. Static — reads supabase/migrations only, no credentials.
      - name: Check migrations don't silently change an upsert key
        run: npm run migrations:check

      # The shared copy catalog only prevents web↔mobile drift if both apps read
      # from it. A literal that matches today diverges the first time either side
      # is reworded, so hardcoding a string the catalog owns fails the build.
      - name: Check no app hardcodes shared copy
        run: npm run copy:check

      # An app importing a @plot/core module that no longer exists. tsc catches
      # this in CI but NOT from a git worktree: worktrees live inside the main
      # checkout, so a failed lookup walks up into the parent's node_modules and
      # resolves against a different tree. That blind spot is how #446 deleted
      # core/onboarding.js with a live importer and shipped an unbuildable main.
      - name: Check every @plot/core import resolves
        run: npm run core:check

      # Mobile's Discover sub-tabs must stay classified against the shared nav
      # list. #587 shipped the Upcoming tab fully implemented and unreachable —
      # only its allow-list entry was missing, which is well-typed, lint-clean
      # and invisible to every other gate. Mobile has no test runner and cannot
      # currently be run at all (docs/agents/web-mobile-parity.md), so this is
      # the only thing standing between that mistake and main.
      - name: Check mobile renders every Discover tab it should
        run: npm run mobile:tabs

      - name: Unit tests
        run: npm run test:unit

      - name: Website unit tests
        run: npm run test:website

      # marketing/ isn't an npm workspace, so this suite otherwise never runs
      # anywhere — it caught nothing when the Codex/Claude CLI shell-outs broke
      # twice in production (d1caa11, 31f4d72) because it wasn't wired in yet.
      - name: Marketing unit tests
        run: npm run test:marketing

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TMDB_PROXY_URL: ${{ secrets.VITE_TMDB_PROXY_URL }}
          VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}

  smoke:
    name: Smoke tests (Playwright)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TMDB_PROXY_URL: ${{ secrets.VITE_TMDB_PROXY_URL }}
          # No PostHog token: the smoke job drives a real browser through the
          # app, and every click would land in the production project. The host
          # allowlist in apps/web/src/utils/analyticsHost.js already blocks
          # 127.0.0.1, so this is belt and braces.

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:smoke -w @plot/web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TMDB_PROXY_URL: ${{ secrets.VITE_TMDB_PROXY_URL }}
          # No PostHog token: the smoke job drives a real browser through the
          # app, and every click would land in the production project. The host
          # allowlist in apps/web/src/utils/analyticsHost.js already blocks
          # 127.0.0.1, so this is belt and braces.

  mobile-typecheck:
    name: Mobile typecheck (Expo)
    runs-on: ubuntu-latest
    steps:
      # Runs on every PR rather than behind a path-filter gate. Actions bills each
      # job rounded UP to a whole minute, and this job's median is 41s (it has
      # never exceeded 60s), so a separate "did mobile change?" job spent a billed
      # minute of its own to skip a single billed minute here. Measured across
      # August that gate cost ~700 min/month to save ~350. Running unconditionally
      # is cheaper and simpler, and type-checks mobile on 100% of PRs, not 58%.
      # The web and mobile apps now share one source of truth: the @plot/core
      # workspace package (packages/core). There is no copy to drift, so the old
      # mirror drift-guard is gone. This job just type-checks the Expo app, which
      # also proves it still resolves @plot/core.
      #
      # Mobile linting is NOT here — `eslint .` in the `check` job covers
      # apps/mobile now that it is no longer in globalIgnores, so mobile gets
      # linted on every PR rather than only when mobile files change.
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Installs the whole workspace (web + mobile + @plot/core). legacy-peer-deps
      # comes from the root .npmrc (react-native pins a different react patch).
      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck --workspace @plot/mobile
