name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Lets a bot-opened PR get the repo's own checks. GitHub will not start a
  # workflow from an event made with GITHUB_TOKEN, so a PR opened by
  # timeline-refresh.yml never triggers `pull_request` — but workflow_dispatch
  # is an explicit exception to that rule, so that job dispatches this workflow
  # against its branch and the required contexts get reported on the PR head.
  workflow_dispatch:

permissions:
  contents: read

# Supersede a PR's in-flight run when its branch is pushed again. Agent sessions
# push repeatedly, and until now every abandoned run still ran to completion and
# still billed a full minute per job. Pushes to main are deliberately NOT
# cancelled: each commit that lands keeps its own smoke run, so main is never
# left unverified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history, because the secret scan below diffs against the PR base
          # (or the previous push), which a shallow clone can't reach. Costs a few
          # seconds: .git is ~146 MB over ~1,000 commits.
          fetch-depth: 0

      - name: Scan changed lines for secret-shaped strings
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/scan-secrets.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            ./scripts/scan-secrets.sh "${{ github.event.before }}" "${{ github.sha }}"
          else
            # Manual or dispatched run on a branch. Diff against main: that is
            # the only meaningful baseline, and it is what the eventual merge
            # will introduce. Do NOT fall back to the empty-tree hash here —
            # scanning every file trips on legitimate base64 (the embedded font
            # in marketing/templates/base.css matches the AWS-key shape), so a
            # whole-tree scan fails on a clean repo.
            git fetch --no-tags --quiet origin main
            ./scripts/scan-secrets.sh origin/main "${{ github.sha }}"
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Keep edge validation before the workspace install. All checks share one
      # runner to avoid repeated setup and per-job minute rounding.
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Every run still validates every edge function, including shared helpers.
      - name: Typecheck edge functions
        run: pnpm run edge:check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check shared footer is in sync
        run: pnpm run footer:check

      # A published skill digest that no longer matches its SKILL.md is worse
      # than none: a careful client rejects the skill outright.
      - name: Check agent skills index is in sync
        run: pnpm run skills:check

      - name: Check design tokens are in sync (web ↔ core ↔ mobile)
        run: pnpm run tokens:check

      - name: Check no new raw colour literals in app code
        run: pnpm run colors:check

      - name: Check marketing tokens are in sync (website + email + collateral)
        run: pnpm run tokens:marketing

      - name: Check auth email templates are in sync
        run: pnpm run emails:check

      # Catches a migration recreating a function with a different ON CONFLICT
      # target, which is how every write to `history` broke for two weeks in
      # July 2026. Static — reads supabase/migrations only, no credentials.
      - name: Check migrations don't silently change an upsert key
        run: pnpm run migrations:check

      # The same whole-body-replacement hazard, aimed at blocking. The seven
      # RPCs that return another user's identity each carry a not_blocked
      # clause; a later migration recreating one from a stale body would drop it
      # and nothing would fail — blocking keeps working everywhere else and the
      # blocked account simply reappears on that one surface. Static.
      - name: Check identity functions still filter blocked users
        run: pnpm run db:block-clause

      # The shared copy catalog only prevents web↔mobile drift if both apps read
      # from it. A literal that matches today diverges the first time either side
      # is reworded, so hardcoding a string the catalog owns fails the build.
      - name: Check no app hardcodes shared copy
        run: pnpm run copy:check

      # An app importing a @plot/core module that no longer exists. tsc catches
      # this in CI but NOT from a git worktree: worktrees live inside the main
      # checkout, so a failed lookup walks up into the parent's node_modules and
      # resolves against a different tree. That blind spot is how #446 deleted
      # core/onboarding.js with a live importer and shipped an unbuildable main.
      - name: Check every @plot/core import resolves
        run: pnpm run core:check

      # Mobile's Discover sub-tabs must stay classified against the shared nav
      # list. #587 shipped the Upcoming tab fully implemented and unreachable —
      # only its allow-list entry was missing, which is well-typed, lint-clean
      # and invisible to every other gate. Mobile has no test runner and cannot
      # currently be run at all (docs/agents/web-mobile-parity.md), so this is
      # the only thing standing between that mistake and main.
      - name: Check mobile renders every Discover tab it should
        run: pnpm run mobile:tabs

      - name: Broadcast importer tests
        run: python3 -m unittest discover -s scripts/guide -p 'test_*.py'

      - name: Unit tests
        run: pnpm run test:unit

      - name: Website unit tests
        run: pnpm run test:website

      # The Workers are not pnpm workspace members, so their suites ran nowhere
      # until this step existed. They cover the TMDB proxy's cache keys (get one
      # wrong and either a response is shared with a caller it does not belong
      # to, or nothing is shared and the quota is back on the open internet) and
      # the backup heartbeat's freshness rules.
      - name: Worker unit tests
        run: pnpm run test:workers

      # marketing/ isn't a pnpm workspace, so this suite otherwise never runs
      # anywhere — it caught nothing when the Codex/Claude CLI shell-outs broke
      # twice in production (d1caa11, 31f4d72) because it wasn't wired in yet.
      - name: Marketing unit tests
        run: pnpm run test:marketing

      - name: Build
        run: pnpm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TMDB_PROXY_URL: ${{ secrets.VITE_TMDB_PROXY_URL }}
          VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ secrets.VITE_PUBLIC_POSTHOG_HOST }}

      # Storybook is a maintained QA surface for web, website, and mobile.
      # Building all three catches missing addons, broken story imports, and
      # configuration drift before those failures reach a manual review.
      - name: Build web Storybook
        run: pnpm --filter @plot/web run build-storybook

      - name: Build website Storybook
        run: pnpm --filter @plot/website-storybook run build-storybook

      - name: Build mobile Storybook for web
        run: pnpm --filter @plot/mobile run build-storybook

      # These used to be a separate job with its own checkout and install.
      - name: Check native deps match the Expo SDK
        run: pnpm run mobile:deps

      - name: Mobile typecheck (Expo)
        run: pnpm --filter @plot/mobile run typecheck

      - name: Install Playwright browser
        run: pnpm --filter @plot/web exec playwright install --with-deps chromium

      - name: Storybook interaction and accessibility tests
        run: pnpm run test-storybook:web

      # Build already passed above. Calling test:smoke here would build again.
      # Browser checks still run before merging, including Dependabot PRs.
      - name: Smoke tests (Playwright)
        run: pnpm --filter @plot/web exec playwright test
        env:
          # The suite checks local rendering/routing, so placeholders let forks
          # and Dependabot boot without repository secrets. Never send analytics.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-not-a-key' }}
          VITE_TMDB_PROXY_URL: ${{ secrets.VITE_TMDB_PROXY_URL || 'https://placeholder.invalid' }}
