name: Error autofix

# Nightly: pull the top recurring PostHog exceptions and open ONE scoped fix PR per
# error for human review. Never merges. Protected paths are blocked by an enforcing
# post-edit diff check (scripts/ops/lib/agent-pr.mjs).
#
# GH_DISPATCH_TOKEN must be a PAT with repo scope (push + open PRs). It is used both
# for checkout (so `git push` is authenticated) and for `gh pr create` (so the new
# PR triggers CI — PRs opened with the default GITHUB_TOKEN do NOT trigger workflows).

on:
  schedule:
    - cron: '0 16 * * *' # ~2am AEST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run Claude + guards but discard instead of opening PRs'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: error-autofix
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-latest
    # Fail-closed: scheduled runs only fire once armed via repo variable
    # AUTOFIX_ENABLED=true. Manual workflow_dispatch always runs (defaults to dry_run).
    if: github.event_name != 'schedule' || vars.AUTOFIX_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          # PAT so live-mode pushes/PRs trigger CI; falls back to the built-in
          # token (fine for checkout + dry-run). Live mode needs GH_DISPATCH_TOKEN set.
          token: ${{ secrets.GH_DISPATCH_TOKEN || github.token }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Configure git identity
        run: |
          git config user.name "plot-autofix[bot]"
          git config user.email "autofix@theplot.tv"
      - name: Run error autofix
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: '471234'
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/ops/error-autofix.mjs
      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: error autofix
        run: bash .github/scripts/marketing-alert.sh
