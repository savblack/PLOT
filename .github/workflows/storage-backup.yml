# Weekly Supabase Storage → Cloudflare R2 backup (encrypted archive).
#
# WHY: db-backup.yml dumps the database, and `pg_dump` captures `storage.objects`
# METADATA but not object bytes. A restore therefore rebuilds rows pointing at
# avatars and marketing images that no longer exist. Found 2026-08-14 while
# restore-testing the database backup, which had never been drilled.
#
# Encrypted since 2026-10-14. The first version mirrored objects to R2 in
# plaintext, next to the gpg-encrypted dumps; private buckets and every avatar
# (PII) were readable by anyone with the bucket. Each run now uploads one
# self-contained tar, encrypted with the same passphrase as the dumps, and
# keeps five weeks of them. The old `storage-mirror/<bucket>/` objects are not
# touched by this job; delete them by hand once the first archive has landed
# (see docs/ops/db-restore.md).
#
# Cadence: the database dump remains nightly, but object bytes have a seven-day
# recovery point objective. Use workflow_dispatch for a recovery point that
# cannot wait for Sunday.
#
# Uses the same R2 secrets and BACKUP_GPG_PASSPHRASE as db-backup.yml.
# Requires SUPABASE_SERVICE_ROLE_KEY (already set) to read private buckets.
#
# Restore: archives live under `storage-backups/storage-<stamp>.tar.gpg` in the
# same bucket as the database dumps. See docs/ops/db-restore.md.

name: Storage backup (weekly → R2)

on:
  schedule:
    - cron: '47 3 * * 0'   # Sunday, 30 min after the database dump
  workflow_dispatch: {}

concurrency:
  group: storage-backup
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    auto
      R2_ENDPOINT:           ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET:             ${{ secrets.R2_BUCKET }}
      # Same aws-cli/R2 checksum incompatibility as db-backup.yml.
      AWS_REQUEST_CHECKSUM_CALCULATION:  when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION:  when_required
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download every Storage object
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # No previous manifest is fetched on purpose: the archive must be
        # complete on its own, so nothing may be skipped as "unchanged".
        run: node scripts/backup-storage-buckets.mjs ./storage-mirror

      - name: Archive, encrypt and upload
        env:
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y-%m-%dT%H%M%SZ)"
          ARTIFACT="storage-${STAMP}.tar.gpg"
          tar -C ./storage-mirror -cf "${ARTIFACT%.gpg}" .
          # Passphrase on stdin, not argv: argv is readable by every process on the runner.
          gpg --batch --yes --symmetric --cipher-algo AES256 --pinentry-mode loopback \
            --passphrase-fd 0 -o "$ARTIFACT" "${ARTIFACT%.gpg}" <<< "$BACKUP_GPG_PASSPHRASE"
          rm -f "${ARTIFACT%.gpg}"
          aws configure set default.s3.addressing_style path
          aws s3 cp "$ARTIFACT" "s3://${R2_BUCKET}/storage-backups/${ARTIFACT}" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors
          echo "Uploaded storage-backups/${ARTIFACT} ($(du -h "$ARTIFACT" | cut -f1))"
          # Sentinel so the backup-heartbeat Worker can tell "ran" from "never
          # ran"; it ages this key (STORAGE_SENTINEL in its wrangler.toml).
          date -u +%Y-%m-%dT%H:%M:%SZ > synced-at.txt
          aws s3 cp synced-at.txt "s3://${R2_BUCKET}/storage-mirror/_synced-at.txt" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors

      - name: Prune archives older than 35 days
        run: |
          set -euo pipefail
          # Five weekly archives. Objects total ~80 MB, so this stays well
          # inside R2's free tier.
          CUTOFF="$(date -u -d '35 days ago' +%Y-%m-%d)"
          aws s3 ls "s3://${R2_BUCKET}/storage-backups/" --endpoint-url "$R2_ENDPOINT" \
            | awk '{print $4}' | grep -E '^storage-.*\.tar\.gpg$' | while read -r key; do
              fdate="$(echo "$key" | sed -E 's/^storage-([0-9]{4}-[0-9]{2}-[0-9]{2}).*/\1/')"
              if [[ "$fdate" < "$CUTOFF" ]]; then
                echo "Pruning $key (dated $fdate < $CUTOFF)"
                aws s3 rm "s3://${R2_BUCKET}/storage-backups/${key}" --endpoint-url "$R2_ENDPOINT" --only-show-errors
              fi
            done

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.MARKETING_ADMIN_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: storage-backup
          ALERT_SUBJECT: 'Plot: weekly STORAGE BACKUP failed'
          FAILURE_NOTE: 'Avatar and marketing files were not archived to R2. The database dump does not contain object bytes, so these files are unrecoverable without this job.'
        run: bash .github/scripts/marketing-alert.sh
