name: Auto-merge agent fixes

# Merges open PRs labelled `agent-fix` that Savannah's rules allow to go live
# on their own (scripts/lib/autoMergePolicy.mjs): library updates, bug fixes
# with a test, broken check/deploy fixes, wording and docs. Payments, the
# database, permissions and member data always wait for her. See
# scripts/auto-merge.mjs for the full list of conditions.
#
# Merging needs the repo secret AUTO_MERGE_TOKEN: a fine-grained GitHub token
# for savblack/PLOT with Contents and Pull requests set to Read and write. A
# merge by the built-in token would not start the deploy workflows on main.
# Until it exists, each run only reports what it would merge.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # labels and the "needs Savannah" comment
  issues: write
  checks: read
  statuses: read

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Merge what the rules allow
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          READ_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
        run: node scripts/auto-merge.mjs
