<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLOT — Hero K: Polaroids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:    #f0ede8;
      --text:  #1a1a1a;
      --muted: #888;
      --serif: 'Playfair Display', Georgia, serif;
      --sans:  'Manrope', system-ui, sans-serif;
      --ease:  cubic-bezier(0.23, 1, 0.32, 1);
    }
    html, body { height: 100%; overflow-x: hidden; }
    body { font-family: var(--sans); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 0 2.5rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg); border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .nav-logo { font-family: var(--serif); font-size: 1.4rem; font-weight: 600; color: var(--text); text-decoration: none; }
    .nav-cta {
      display: inline-flex; align-items: center;
      padding: 0.5rem 1.3rem; border-radius: 9999px;
      background: #1a1a1a; color: #fff;
      font-family: var(--sans); font-size: 0.85rem; font-weight: 500;
      text-decoration: none;
    }

    #hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 64px;
      overflow: hidden;
    }

    /* ── Polaroids ── */
    .polaroid {
      position: absolute;
      background: #fff;
      padding: 10px 10px 34px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12), 0 1px 4px rgba(0,0,0,0.08);
      opacity: 0;
      cursor: default;
      transition: box-shadow 0.3s var(--ease), transform 0.3s var(--ease);
    }
    .polaroid:hover {
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
      z-index: 20 !important;
    }
    .polaroid-img {
      width: 100%; height: 100%;
      background-size: cover; background-position: center;
      display: block;
    }
    .polaroid-caption {
      position: absolute; bottom: 7px; left: 0; right: 0;
      text-align: center;
      font-family: var(--serif); font-style: italic;
      font-size: 0.72rem; color: rgba(0,0,0,0.45);
    }

    /* ── Text ── */
    .hero-content {
      position: relative; z-index: 10;
      text-align: center; max-width: 540px;
      padding: 0 2rem;
    }

    .hero-eyebrow {
      display: inline-block;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 1.4rem;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.7s var(--ease) 0.5s, transform 0.7s var(--ease) 0.5s;
    }
    .hero-headline {
      font-family: var(--serif);
      font-size: clamp(3rem, 6.5vw, 5rem);
      font-weight: 400; line-height: 0.85; letter-spacing: -0.03em;
      margin-bottom: 1.4rem;
      opacity: 0; transform: translateY(14px);
      transition: opacity 0.8s var(--ease) 0.7s, transform 0.8s var(--ease) 0.7s;
    }
    .hero-sub {
      font-size: 0.9rem; color: var(--muted); line-height: 1.75;
      margin-bottom: 2.2rem;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.7s var(--ease) 0.9s, transform 0.7s var(--ease) 0.9s;
    }
    .hero-btn {
      display: inline-flex; align-items: center;
      padding: 0.85rem 2rem; border-radius: 9999px;
      background: #1a1a1a; color: #fff;
      font-family: var(--sans); font-size: 0.88rem; font-weight: 500;
      text-decoration: none; transition: background 0.2s;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.7s var(--ease) 1.1s, transform 0.7s var(--ease) 1.1s, background 0.2s;
    }
    .hero-btn:hover { background: #333; }

    /* Radial vignette so text is readable */
    #hero::before {
      content: '';
      position: absolute; inset: 0; z-index: 5;
      background: radial-gradient(ellipse 50% 60% at 50% 50%,
        rgba(240,237,232,0.94) 0%,
        rgba(240,237,232,0.75) 40%,
        rgba(240,237,232,0.15) 80%,
        transparent 100%
      );
      pointer-events: none;
    }

    .animate-in .hero-eyebrow,
    .animate-in .hero-headline,
    .animate-in .hero-sub,
    .animate-in .hero-btn { opacity: 1; transform: translateY(0); }

    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999; opacity: 0.02;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    .variant-label {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.07); backdrop-filter: blur(12px);
      border: 1px solid rgba(0,0,0,0.08); color: rgba(0,0,0,0.45);
      font-size: 0.75rem; font-weight: 500; padding: 0.5rem 1.2rem; border-radius: 9999px;
      letter-spacing: 0.06em; text-transform: uppercase; z-index: 200; font-family: var(--sans);
    }
    .variant-nav {
      position: fixed; bottom: 2rem; right: 2rem; display: flex; gap: 0.6rem; z-index: 200;
    }
    .variant-nav a {
      background: rgba(0,0,0,0.07); backdrop-filter: blur(12px);
      border: 1px solid rgba(0,0,0,0.08); color: rgba(0,0,0,0.45);
      font-size: 0.75rem; font-weight: 500; padding: 0.5rem 1rem; border-radius: 9999px;
      letter-spacing: 0.06em; text-transform: uppercase;
      text-decoration: none; font-family: var(--sans); transition: background 0.2s;
    }
    .variant-nav a:hover { background: rgba(0,0,0,0.12); }
    .variant-nav a.active { background: #1a1a1a; color: #fff; }
  </style>
</head>
<body>

  <nav>
    <a href="#" class="nav-logo">PLOT</a>
    <a href="#" class="nav-cta">Sign up</a>
  </nav>

  <section id="hero">
    <div class="hero-content animate-in" id="heroContent">
      <span class="hero-eyebrow">Your film &amp; TV journal</span>
      <h1 class="hero-headline">For the plots<br>that moved you.</h1>
      <p class="hero-sub">A film and TV journal as considered as your taste.</p>
      <a href="#" class="hero-btn">Start your journal →</a>
    </div>
  </section>

  <div class="variant-label">K — Polaroids</div>
  <div class="variant-nav">
    <a href="hero-i.html">I</a>
    <a href="hero-j.html">J</a>
    <a href="hero-k.html" class="active">K</a>
  </div>

  <script>
    const films = [
      { img: 'images/hero/the-substance.avif',         title: 'The Substance' },
      { img: 'images/hero/gone-girl.jpg',               title: 'Gone Girl' },
      { img: 'images/hero/saltburn.png',                title: 'Saltburn' },
      { img: 'images/hero/parasite.jpg',                title: 'Parasite' },
      { img: 'images/hero/housemaid.jpg',               title: 'The Housemaid' },
      { img: 'images/hero/top-gun-maverick.jpg',        title: 'Top Gun: Maverick' },
      { img: 'images/hero/eternity.jpg',                title: 'Eternity' },
      { img: 'images/hero/devil-wears-prada-two.jpg',   title: 'Devil Wears Prada' },
    ];

    // [left%, top%, width, height, rotation, z]
    const placements = [
      [  3,  12, 150, 150, -11, 3 ],
      [ 10,  55, 130, 130,   7, 2 ],
      [  4,  74, 140, 140,  -5, 4 ],
      [ 20,  80, 120, 120,  12, 1 ],
      [ 68,  10, 155, 155,   8, 2 ],
      [ 78,  52, 135, 135,  -9, 3 ],
      [ 74,  74, 145, 145,   5, 4 ],
      [ 57,  78, 125, 125, -13, 1 ],
    ];

    const hero = document.querySelector('#hero');

    placements.forEach(([l, t, w, h, rot, z], i) => {
      const outer = document.createElement('div');
      outer.className = 'polaroid';
      outer.style.cssText = `
        left: ${l}%; top: ${t}%;
        width: ${w + 20}px;
        height: ${h + 44}px;
        transform: rotate(${rot}deg) translateY(20px);
        z-index: ${z};
        transition: opacity 0.5s ease ${300 + i * 90}ms, transform 0.6s cubic-bezier(0.34,1.2,0.64,1) ${300 + i * 90}ms, box-shadow 0.3s ease;
      `;

      const img = document.createElement('div');
      img.className = 'polaroid-img';
      img.style.cssText = `width: ${w}px; height: ${h}px; background-image: url('${films[i].img}');`;

      const cap = document.createElement('div');
      cap.className = 'polaroid-caption';
      cap.textContent = films[i].title;

      outer.appendChild(img);
      outer.appendChild(cap);
      hero.appendChild(outer);

      // Hover lift — preserve rotation
      outer.addEventListener('mouseenter', () => {
        outer.style.transform = `rotate(${rot * 0.5}deg) translateY(-8px)`;
      });
      outer.addEventListener('mouseleave', () => {
        outer.style.transform = `rotate(${rot}deg) translateY(0px)`;
        outer.style.transition = `opacity 0.5s ease, transform 0.4s cubic-bezier(0.23,1,0.32,1), box-shadow 0.3s ease`;
      });

      // Animate in
      requestAnimationFrame(() => requestAnimationFrame(() => {
        outer.style.opacity = '1';
        outer.style.transform = `rotate(${rot}deg) translateY(0px)`;
      }));
    });
  </script>
</body>
</html>
