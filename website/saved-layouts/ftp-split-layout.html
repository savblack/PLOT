<!--
  Saved layout: "Your journal. Your rules." — left/right split
  Copy left (sticky), poster fan right.
  To use: replace the #for-the-plot and #value sections in index.html
  with this code, and swap the CSS below into the <style> block.
-->

<!-- ── CSS ── -->
<style>
  /* ── For the Plot ───────────────────────────────────────── */
  #for-the-plot {
    padding: 10rem 2rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  .ftp-inner {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 6rem;
    align-items: center;
  }

  .ftp-left {
    position: sticky;
    top: 8rem;
  }

  .ftp-headline {
    font-family: var(--serif);
    font-size: clamp(1.8rem, 3.5vw, 2.8rem);
    font-weight: 400;
    letter-spacing: -0.03em;
    line-height: 1;
    margin-bottom: 1.5rem;
  }

  .ftp-body {
    font-size: 0.88rem;
    color: var(--muted);
    line-height: 1.8;
    margin-bottom: 2rem;
  }
  .ftp-body em {
    font-family: var(--serif);
    font-style: italic;
    color: var(--text);
  }

  .ftp-right {
    overflow: visible;
  }

  @media (max-width: 900px) {
    .ftp-inner { grid-template-columns: 1fr; gap: 3rem; }
    .ftp-left { position: static; }
  }

  /* ── Value Prop ─────────────────────────────────────────── */
  #value { display: none; }

  .list-stack-wrap {
    position: relative;
    width: 100%;
    height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>

<!-- ── HTML ── -->

<!-- ── For the Plot ─────────────────────────────────────────── -->
<section id="for-the-plot">
  <div class="ftp-inner">
    <div class="ftp-left reveal">
      <h2 class="ftp-headline">Your journal. Your rules.</h2>
      <p class="ftp-body">Your top ten. All the series you binged in a weekend. The one dropping next month you've already cleared your schedule for. Make a list for anything.</p>
      <a href="#" class="btn btn-primary btn-large">Make it yours →</a>
    </div>
    <div class="ftp-right">
      <div class="list-stack-wrap" id="listStackWrap"></div>
    </div>
  </div>
</section>

<!-- ── Value Prop (merged into for-the-plot above) ──────────── -->
<section id="value" style="display:none"></section>
