<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLOT — Hero H: Dark Grid Spotlight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --serif: 'Playfair Display', Georgia, serif;
      --sans:  'Manrope', system-ui, sans-serif;
      --ease:  cubic-bezier(0.23, 1, 0.32, 1);
    }
    html, body { height: 100%; overflow-x: hidden; }
    body { font-family: var(--sans); background: #0a0a0a; color: #fff; -webkit-font-smoothing: antialiased; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 0 2.5rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { font-family: var(--serif); font-size: 1.4rem; font-weight: 600; color: #fff; text-decoration: none; }
    .nav-cta {
      display: inline-flex; align-items: center;
      padding: 0.5rem 1.3rem; border-radius: 9999px;
      background: rgba(255,255,255,0.1); color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      font-family: var(--sans); font-size: 0.85rem; font-weight: 500;
      text-decoration: none; backdrop-filter: blur(8px);
      transition: background 0.2s;
    }
    .nav-cta:hover { background: rgba(255,255,255,0.18); }

    /* ── Hero ── */
    #hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ── Poster grid — full bleed behind ── */
    .poster-grid {
      position: absolute; inset: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
    }

    .grid-poster {
      background-size: cover;
      background-position: center;
      opacity: 0;
      filter: brightness(0.22) saturate(0.4);
      transition:
        opacity 0.6s var(--ease),
        filter 0.7s var(--ease),
        transform 0.7s var(--ease);
    }
    .grid-poster.loaded { opacity: 1; }
    .grid-poster.lit {
      filter: brightness(0.85) saturate(1);
      transform: scale(1.03);
      z-index: 2;
    }

    /* ── Dark vignette over grid so text reads ── */
    .grid-overlay {
      position: absolute; inset: 0; z-index: 5;
      background: radial-gradient(ellipse 60% 80% at 50% 50%,
        rgba(10,10,10,0.78) 0%,
        rgba(10,10,10,0.55) 50%,
        rgba(10,10,10,0.2) 100%
      );
    }

    /* ── Text ── */
    .hero-content {
      position: relative; z-index: 10;
      text-align: center; max-width: 620px;
      padding: 0 2rem;
    }

    .hero-eyebrow {
      display: inline-block;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.16em;
      text-transform: uppercase; color: rgba(255,255,255,0.45);
      margin-bottom: 1.6rem;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.7s var(--ease) 0.8s, transform 0.7s var(--ease) 0.8s;
    }
    .hero-headline {
      font-family: var(--serif);
      font-size: clamp(3rem, 7vw, 5.5rem);
      font-weight: 400; line-height: 0.85; letter-spacing: -0.03em;
      color: #fff; margin-bottom: 1.5rem;
      opacity: 0; transform: translateY(16px);
      transition: opacity 0.8s var(--ease) 1s, transform 0.8s var(--ease) 1s;
    }
    .hero-sub {
      font-size: 0.9rem; color: rgba(255,255,255,0.5);
      line-height: 1.8; margin-bottom: 2.5rem;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.7s var(--ease) 1.2s, transform 0.7s var(--ease) 1.2s;
    }
    .hero-btn {
      display: inline-flex; align-items: center;
      padding: 0.85rem 2.2rem; border-radius: 9999px;
      background: #fff; color: #000;
      font-family: var(--sans); font-size: 0.88rem; font-weight: 600;
      text-decoration: none; transition: background 0.2s;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.7s var(--ease) 1.4s, transform 0.7s var(--ease) 1.4s, background 0.2s;
    }
    .hero-btn:hover { background: #e8e8e8; }

    /* Now-lit film label */
    .lit-label {
      position: absolute; z-index: 10;
      bottom: 2.5rem; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px;
      opacity: 0; transition: opacity 0.4s var(--ease);
    }
    .lit-label.show { opacity: 1; }
    .lit-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,0.5);
    }
    .lit-title {
      font-family: var(--serif); font-size: 0.9rem; font-style: italic;
      color: rgba(255,255,255,0.6);
    }

    .animate-in .hero-eyebrow,
    .animate-in .hero-headline,
    .animate-in .hero-sub,
    .animate-in .hero-btn { opacity: 1; transform: translateY(0); }

    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 9999; opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    .variant-label {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.5);
      font-size: 0.75rem; font-weight: 500; padding: 0.5rem 1.2rem; border-radius: 9999px;
      letter-spacing: 0.06em; text-transform: uppercase; z-index: 200; font-family: var(--sans);
    }
    .variant-nav {
      position: fixed; bottom: 2rem; right: 2rem; display: flex; gap: 0.6rem; z-index: 200;
    }
    .variant-nav a {
      background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.5);
      font-size: 0.75rem; font-weight: 500; padding: 0.5rem 1rem; border-radius: 9999px;
      letter-spacing: 0.06em; text-transform: uppercase;
      text-decoration: none; font-family: var(--sans); transition: background 0.2s;
    }
    .variant-nav a:hover { background: rgba(255,255,255,0.15); }
    .variant-nav a.active { background: #fff; color: #000; }
  </style>
</head>
<body>

  <nav>
    <a href="#" class="nav-logo">PLOT</a>
    <a href="#" class="nav-cta">Sign up</a>
  </nav>

  <section id="hero">
    <div class="poster-grid" id="posterGrid"></div>
    <div class="grid-overlay"></div>

    <div class="hero-content" id="heroContent">
      <span class="hero-eyebrow">Your film &amp; TV journal</span>
      <h1 class="hero-headline">For the plots<br>that moved you.</h1>
      <p class="hero-sub">A film and TV journal as considered as your taste.</p>
      <a href="#" class="hero-btn">Start your journal →</a>
    </div>

    <div class="lit-label" id="litLabel">
      <div class="lit-dot"></div>
      <span class="lit-title" id="litTitle"></span>
    </div>
  </section>

  <div class="variant-label">H — Grid Spotlight</div>
  <div class="variant-nav">
    <a href="hero-f.html">F</a>
    <a href="hero-g.html">G</a>
    <a href="hero-h.html" class="active">H</a>
  </div>

  <script>
    const films = [
      { img: 'images/hero/the-substance.avif',         title: 'The Substance' },
      { img: 'images/hero/gone-girl.jpg',               title: 'Gone Girl' },
      { img: 'images/hero/saltburn.png',                title: 'Saltburn' },
      { img: 'images/hero/parasite.jpg',                title: 'Parasite' },
      { img: 'images/hero/housemaid.jpg',               title: 'The Housemaid' },
      { img: 'images/hero/top-gun-maverick.jpg',        title: 'Top Gun: Maverick' },
      { img: 'images/hero/devil-wears-prada-two.jpg',   title: 'The Devil Wears Prada' },
      { img: 'images/hero/eternity.jpg',                title: 'Eternity' },
      { img: 'images/hero/the-wolf-of-wall-street.png', title: 'The Wolf of Wall Street' },
      { img: 'images/hero/my-neighbour-totoro.jpg',     title: 'My Neighbour Totoro' },
      { img: 'images/hero/marty-supreme.jpg',           title: 'Marty Supreme' },
      { img: 'images/hero/spiderman-no-way-home.jpg',   title: 'Spider-Man: No Way Home' },
      { img: 'images/hero/tetris.jpg',                  title: 'Tetris' },
      { img: 'images/hero/the-summer-i-turned-pretty.jpg', title: 'The Summer I Turned Pretty' },
      { img: 'images/hero/gone-girl.jpg',               title: 'Gone Girl' },
    ];

    const grid      = document.getElementById('posterGrid');
    const litLabel  = document.getElementById('litLabel');
    const litTitle  = document.getElementById('litTitle');
    let   litIndex  = 0;
    let   cells     = [];

    // Build 15 cells (5×3)
    films.forEach((f, i) => {
      const el = document.createElement('div');
      el.className = 'grid-poster';
      el.style.backgroundImage = `url('${f.img}')`;
      grid.appendChild(el);
      cells.push({ el, film: f });
      setTimeout(() => el.classList.add('loaded'), 80 + i * 50);
    });

    // Spotlight cycle
    function spotlight(n) {
      cells[litIndex].el.classList.remove('lit');
      litLabel.classList.remove('show');
      litIndex = n;
      cells[litIndex].el.classList.add('lit');
      setTimeout(() => {
        litTitle.textContent = cells[litIndex].film.title;
        litLabel.classList.add('show');
      }, 200);
    }

    // Start spotlighting after posters load
    setTimeout(() => {
      spotlight(0);
      setInterval(() => {
        spotlight((litIndex + 1) % cells.length);
      }, 1800);
    }, 1200);

    // Text in
    setTimeout(() => document.getElementById('heroContent').classList.add('animate-in'), 400);
  </script>
</body>
</html>
