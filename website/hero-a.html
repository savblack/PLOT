<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLOT — Hero A: Film Wall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --serif: 'Playfair Display', Georgia, serif;
      --sans:  'Manrope', system-ui, sans-serif;
      --ease:  cubic-bezier(0.23, 1, 0.32, 1);
    }
    html, body { height: 100%; }
    body { font-family: var(--sans); background: #0a0a0a; color: #fff; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 0 2.5rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { font-family: var(--serif); font-size: 1.4rem; font-weight: 600; color: #fff; text-decoration: none; }
    .nav-cta {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 1.3rem; border-radius: 9999px;
      background: #fff; color: #000;
      font-family: var(--sans); font-size: 0.85rem; font-weight: 500;
      text-decoration: none; transition: background 0.2s;
    }
    .nav-cta:hover { background: #e8e8e8; }

    /* ── Poster wall ── */
    #hero {
      position: relative;
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    .poster-wall {
      position: absolute; inset: 0;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 6px;
      transform: scale(1.04); /* bleed edge tiles */
    }

    .wall-poster {
      background-size: cover;
      background-position: center;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.6s var(--ease);
    }
    .wall-poster.loaded { opacity: 1; }

    /* Tall center poster spans 2 rows */
    .wall-poster.tall { grid-row: span 2; }

    /* Dark overlay so text reads */
    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.55) 0%,
        rgba(0,0,0,0.3) 40%,
        rgba(0,0,0,0.3) 60%,
        rgba(0,0,0,0.65) 100%
      );
    }

    /* ── Hero text ── */
    .hero-content {
      position: relative; z-index: 10;
      text-align: center;
      max-width: 680px;
      padding: 0 2rem;
    }

    .hero-eyebrow {
      display: inline-block;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: rgba(255,255,255,0.6);
      margin-bottom: 1.5rem;
      opacity: 0; transform: translateY(12px);
      transition: opacity 0.7s var(--ease) 0.8s, transform 0.7s var(--ease) 0.8s;
    }

    .hero-headline {
      font-family: var(--serif);
      font-size: clamp(3rem, 7vw, 5.5rem);
      font-weight: 400; line-height: 0.85;
      letter-spacing: -0.03em; color: #fff;
      margin-bottom: 1.8rem;
      opacity: 0; transform: translateY(16px);
      transition: opacity 0.8s var(--ease) 1s, transform 0.8s var(--ease) 1s;
    }

    .hero-sub {
      font-size: clamp(0.78rem, 1.5vw, 0.92rem);
      color: rgba(255,255,255,0.65); font-weight: 400;
      margin-bottom: 2.5rem; line-height: 1.7;
      opacity: 0; transform: translateY(12px);
      transition: opacity 0.7s var(--ease) 1.2s, transform 0.7s var(--ease) 1.2s;
    }

    .hero-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.85rem 2.2rem; border-radius: 9999px;
      background: #fff; color: #000;
      font-family: var(--sans); font-size: 0.88rem; font-weight: 500;
      text-decoration: none;
      opacity: 0; transform: translateY(12px);
      transition: opacity 0.7s var(--ease) 1.4s, transform 0.7s var(--ease) 1.4s, background 0.2s;
    }
    .hero-btn:hover { background: #e8e8e8; }

    .animate-in .hero-eyebrow,
    .animate-in .hero-headline,
    .animate-in .hero-sub,
    .animate-in .hero-btn {
      opacity: 1; transform: translateY(0);
    }

    /* ── Grain ── */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 9999;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    /* ── Variant label ── */
    .variant-label {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.1); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7); font-size: 0.75rem; font-weight: 500;
      padding: 0.5rem 1.2rem; border-radius: 9999px;
      letter-spacing: 0.06em; text-transform: uppercase;
      z-index: 200;
    }
    .variant-nav {
      position: fixed; bottom: 2rem; right: 2rem;
      display: flex; gap: 0.6rem; z-index: 200;
    }
    .variant-nav a {
      background: rgba(255,255,255,0.1); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.7); font-size: 0.75rem; font-weight: 500;
      padding: 0.5rem 1rem; border-radius: 9999px;
      letter-spacing: 0.06em; text-transform: uppercase;
      text-decoration: none; font-family: var(--sans);
      transition: background 0.2s;
    }
    .variant-nav a:hover { background: rgba(255,255,255,0.2); }
    .variant-nav a.active { background: #fff; color: #000; }
  </style>
</head>
<body>

  <nav>
    <a href="#" class="nav-logo">PLOT</a>
    <a href="#" class="nav-cta">Sign up</a>
  </nav>

  <section id="hero">
    <div class="poster-wall" id="posterWall">
      <!-- JS fills these -->
    </div>
    <div class="hero-overlay"></div>
    <div class="hero-content" id="heroContent">
      <span class="hero-eyebrow">Your film &amp; TV journal</span>
      <h1 class="hero-headline">For the plots<br>that moved you.</h1>
      <p class="hero-sub">A film and TV journal as considered as your taste.</p>
      <a href="#" class="hero-btn">Start your journal →</a>
    </div>
  </section>

  <div class="variant-label">A — Film Wall</div>
  <div class="variant-nav">
    <a href="hero-a.html" class="active">A</a>
    <a href="hero-b.html">B</a>
    <a href="hero-c.html">C</a>
  </div>

  <script>
    const images = [
      'images/hero/top-gun-maverick.jpg',
      'images/hero/devil-wears-prada-two.jpg',
      'images/hero/parasite.jpg',
      'images/hero/the-substance.avif',
      'images/hero/marty-supreme.jpg',
      'images/hero/housemaid.jpg',
      'images/hero/saltburn.png',
      'images/hero/gone-girl.jpg',
      'images/hero/the-wolf-of-wall-street.png',
      'images/hero/eternity.jpg',
      'images/hero/my-neighbour-totoro.jpg',
      'images/hero/spiderman-no-way-home.jpg',
      'images/hero/tetris.jpg',
      'images/hero/the-summer-i-turned-pretty.jpg',
    ];

    // Build 14 cells: 7 cols × 2 rows
    const wall = document.getElementById('posterWall');
    // Shuffle
    const shuffled = [...images].sort(() => Math.random() - 0.5);

    for (let i = 0; i < 14; i++) {
      const div = document.createElement('div');
      div.className = 'wall-poster';
      div.style.backgroundImage = `url('${shuffled[i % shuffled.length]}')`;
      wall.appendChild(div);

      // Stagger fade-in
      setTimeout(() => div.classList.add('loaded'), 100 + i * 60);
    }

    // Text animate-in after posters start loading
    setTimeout(() => {
      document.getElementById('heroContent').classList.add('animate-in');
    }, 300);
  </script>
</body>
</html>
