<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLOT — Hero I: Triptych</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:    #0d0d0d;
      --serif: 'Playfair Display', Georgia, serif;
      --sans:  'Manrope', system-ui, sans-serif;
      --ease:  cubic-bezier(0.23, 1, 0.32, 1);
    }
    html, body { height: 100%; overflow-x: hidden; }
    body { font-family: var(--sans); background: var(--bg); color: #fff; -webkit-font-smoothing: antialiased; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 0 2.5rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { font-family: var(--serif); font-size: 1.4rem; font-weight: 600; color: #fff; text-decoration: none; }
    .nav-cta {
      display: inline-flex; align-items: center;
      padding: 0.5rem 1.3rem; border-radius: 9999px;
      background: rgba(255,255,255,0.1); color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      font-family: var(--sans); font-size: 0.85rem; font-weight: 500;
      text-decoration: none; backdrop-filter: blur(8px);
    }

    /* ── Hero: full viewport, posters fill it ── */
    #hero {
      position: relative;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Three panels */
    .panel {
      position: relative;
      flex: 1;
      overflow: hidden;
      cursor: default;
      transition: flex 0.6s var(--ease);
    }
    .panel:hover { flex: 1.4; }

    .panel-img {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      transition: transform 0.6s var(--ease);
    }
    .panel:hover .panel-img { transform: scale(1.04); }

    /* Vertical gradient so bottom text reads */
    .panel::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 65%;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
      pointer-events: none;
    }

    /* Thin divider lines between panels */
    .panel + .panel { border-left: 1px solid rgba(255,255,255,0.08); }

    /* Film title on each panel */
    .panel-label {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 5;
      padding: 1.5rem;
      opacity: 0; transform: translateY(6px);
      transition: opacity 0.4s var(--ease) 0.05s, transform 0.4s var(--ease) 0.05s;
    }
    .panel:hover .panel-label { opacity: 1; transform: translateY(0); }
    .panel-label-name {
      font-family: var(--serif); font-size: 1rem; font-style: italic; color: #fff;
    }
    .panel-label-year { font-size: 0.72rem; color: rgba(255,255,255,0.5); margin-top: 2px; }

    /* ── Centered text overlay ── */
    .hero-text {
      position: absolute; bottom: 3.5rem; left: 50%; transform: translateX(-50%);
      z-index: 20; text-align: center; white-space: nowrap;
    }
    .hero-headline {
      font-family: var(--serif);
      font-size: clamp(2rem, 4.5vw, 4rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1;
      color: #fff;
      opacity: 0; transform: translateY(14px);
      transition: opacity 0.8s var(--ease) 0.9s, transform 0.8s var(--ease) 0.9s;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }
    .hero-sub {
      font-size: 0.82rem; color: rgba(255,255,255,0.5);
      margin-top: 0.6rem; margin-bottom: 1.5rem;
      opacity: 0; transform: translateY(8px);
      transition: opacity 0.7s var(--ease) 1.1s, transform 0.7s var(--ease) 1.1s;
    }
    .hero-btn {
      display: inline-flex; align-items: center;
      padding: 0.75rem 2rem; border-radius: 9999px;
      background: #fff; color: #000;
      font-family: var(--sans); font-size: 0.85rem; font-weight: 600;
      text-decoration: none; transition: background 0.2s;
      opacity: 0; transform: translateY(8px);
      transition: opacity 0.7s var(--ease) 1.3s, transform 0.7s var(--ease) 1.3s, background 0.2s;
    }
    .hero-btn:hover { background: #e8e8e8; }

    .animate-in .hero-headline,
    .animate-in .hero-sub,
    .animate-in .hero-btn { opacity: 1; transform: translateY(0); }

    /* Panel entry animation */
    .panel { opacity: 0; transform: translateY(30px); }
    .panel.show { opacity: 1; transform: translateY(0); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease), flex 0.6s var(--ease); }

    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999; opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    .variant-label {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.5);
      font-size: 0.75rem; font-weight: 500; padding: 0.5rem 1.2rem; border-radius: 9999px;
      letter-spacing: 0.06em; text-transform: uppercase; z-index: 200; font-family: var(--sans);
    }
    .variant-nav {
      position: fixed; bottom: 2rem; right: 2rem; display: flex; gap: 0.6rem; z-index: 200;
    }
    .variant-nav a {
      background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.5);
      font-size: 0.75rem; font-weight: 500; padding: 0.5rem 1rem; border-radius: 9999px;
      letter-spacing: 0.06em; text-transform: uppercase;
      text-decoration: none; font-family: var(--sans); transition: background 0.2s;
    }
    .variant-nav a:hover { background: rgba(255,255,255,0.15); }
    .variant-nav a.active { background: #fff; color: #000; }
  </style>
</head>
<body>

  <nav>
    <a href="#" class="nav-logo">PLOT</a>
    <a href="#" class="nav-cta">Sign up</a>
  </nav>

  <section id="hero">
    <div class="panel" id="p0">
      <div class="panel-img" style="background-image:url('images/hero/gone-girl.jpg')"></div>
      <div class="panel-label"><div class="panel-label-name">Gone Girl</div><div class="panel-label-year">2014</div></div>
    </div>
    <div class="panel" id="p1">
      <div class="panel-img" style="background-image:url('images/hero/the-substance.avif'); background-position: top center;"></div>
      <div class="panel-label"><div class="panel-label-name">The Substance</div><div class="panel-label-year">2024</div></div>
    </div>
    <div class="panel" id="p2">
      <div class="panel-img" style="background-image:url('images/hero/saltburn.png')"></div>
      <div class="panel-label"><div class="panel-label-name">Saltburn</div><div class="panel-label-year">2023</div></div>
    </div>

    <div class="hero-text" id="heroText">
      <h1 class="hero-headline">For the plots that moved you.</h1>
      <p class="hero-sub">A film and TV journal as considered as your taste.</p>
      <a href="#" class="hero-btn">Start your journal →</a>
    </div>
  </section>

  <div class="variant-label">I — Triptych</div>
  <div class="variant-nav">
    <a href="hero-i.html" class="active">I</a>
    <a href="hero-j.html">J</a>
    <a href="hero-k.html">K</a>
  </div>

  <script>
    [0,1,2].forEach(i => {
      setTimeout(() => document.getElementById('p' + i).classList.add('show'), 200 + i * 120);
    });
    setTimeout(() => document.getElementById('heroText').classList.add('animate-in'), 600);
  </script>
</body>
</html>
