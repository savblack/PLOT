<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLOT — Hero E: Dark + Single Featured Poster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --serif: 'Playfair Display', Georgia, serif;
      --sans:  'Manrope', system-ui, sans-serif;
      --ease:  cubic-bezier(0.23, 1, 0.32, 1);
    }
    html, body { height: 100%; overflow-x: hidden; }
    body { font-family: var(--sans); background: #0e0e0e; color: #fff; -webkit-font-smoothing: antialiased; }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 0 2.5rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo { font-family: var(--serif); font-size: 1.4rem; font-weight: 600; color: #fff; text-decoration: none; }
    .nav-cta {
      display: inline-flex; align-items: center;
      padding: 0.5rem 1.3rem; border-radius: 9999px;
      background: rgba(255,255,255,0.12); color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      font-family: var(--sans); font-size: 0.85rem; font-weight: 500;
      text-decoration: none; backdrop-filter: blur(8px);
      transition: background 0.2s;
    }
    .nav-cta:hover { background: rgba(255,255,255,0.2); }

    /* ── Hero: full-viewport, split layout ── */
    #hero {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 420px;
      align-items: center;
      padding: 64px 0 0;
      gap: 0;
    }

    /* ── Left: text ── */
    .hero-left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 5rem 4rem 5rem 5rem;
    }

    .hero-eyebrow {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.16em;
      text-transform: uppercase; color: rgba(255,255,255,0.4);
      margin-bottom: 2.5rem;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.7s var(--ease) 0.3s, transform 0.7s var(--ease) 0.3s;
    }
    .hero-headline {
      font-family: var(--serif);
      font-size: clamp(3rem, 5vw, 4.8rem);
      font-weight: 400; line-height: 0.88;
      letter-spacing: -0.03em; color: #fff;
      margin-bottom: 2rem;
      opacity: 0; transform: translateY(16px);
      transition: opacity 0.8s var(--ease) 0.5s, transform 0.8s var(--ease) 0.5s;
    }
    .hero-sub {
      font-size: 0.9rem; color: rgba(255,255,255,0.5);
      line-height: 1.8; max-width: 380px; margin-bottom: 3rem;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.7s var(--ease) 0.7s, transform 0.7s var(--ease) 0.7s;
    }

    .hero-actions {
      display: flex; gap: 1rem; align-items: center;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.7s var(--ease) 0.9s, transform 0.7s var(--ease) 0.9s;
    }
    .hero-btn-primary {
      display: inline-flex; align-items: center;
      padding: 0.85rem 2rem; border-radius: 9999px;
      background: #fff; color: #000;
      font-family: var(--sans); font-size: 0.88rem; font-weight: 600;
      text-decoration: none; transition: background 0.2s;
    }
    .hero-btn-primary:hover { background: #e8e8e8; }
    .hero-btn-ghost {
      display: inline-flex; align-items: center;
      padding: 0.85rem 1.8rem; border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.7);
      font-family: var(--sans); font-size: 0.88rem; font-weight: 400;
      text-decoration: none; transition: border-color 0.2s, color 0.2s;
    }
    .hero-btn-ghost:hover { border-color: rgba(255,255,255,0.5); color: #fff; }

    /* Social proof */
    .hero-proof {
      margin-top: 3.5rem; display: flex; align-items: center; gap: 1rem;
      opacity: 0; transform: translateY(8px);
      transition: opacity 0.7s var(--ease) 1.1s, transform 0.7s var(--ease) 1.1s;
    }
    .proof-avatars {
      display: flex;
    }
    .proof-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      border: 2px solid #0e0e0e;
      background-size: cover; background-position: center;
      margin-right: -8px;
    }
    .proof-text {
      font-size: 0.78rem; color: rgba(255,255,255,0.4); line-height: 1.4;
    }
    .proof-text strong { color: rgba(255,255,255,0.7); font-weight: 500; }

    .animate-in .hero-eyebrow,
    .animate-in .hero-headline,
    .animate-in .hero-sub,
    .animate-in .hero-actions,
    .animate-in .hero-proof { opacity: 1; transform: translateY(0); }

    /* ── Right: featured poster ── */
    .hero-right {
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .featured-poster {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      opacity: 0;
      transition: opacity 0.8s var(--ease);
    }
    .featured-poster.active { opacity: 1; }

    /* Left edge fade into dark bg */
    .hero-right::before {
      content: '';
      position: absolute; top: 0; left: 0; bottom: 0; width: 120px;
      background: linear-gradient(to right, #0e0e0e, transparent);
      z-index: 5; pointer-events: none;
    }
    /* Bottom fade */
    .hero-right::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0; height: 200px;
      background: linear-gradient(to top, #0e0e0e, transparent);
      z-index: 5; pointer-events: none;
    }

    /* Now playing badge */
    .now-playing {
      position: absolute; bottom: 2.5rem; left: 2rem; z-index: 10;
      display: flex; flex-direction: column; gap: 2px;
      opacity: 0; transform: translateY(6px);
      transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
    }
    .now-playing.show { opacity: 1; transform: translateY(0); }
    .np-label { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.4); }
    .np-title { font-family: var(--serif); font-size: 1.1rem; font-style: italic; color: #fff; }

    /* Thumbnail strip */
    .thumb-strip {
      position: absolute; top: 50%; right: 1.2rem; z-index: 10;
      transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 8px;
    }
    .thumb {
      width: 44px; height: 62px; border-radius: 5px;
      background-size: cover; background-position: center;
      cursor: pointer; border: 2px solid transparent;
      opacity: 0.45; transition: opacity 0.2s, border-color 0.2s;
    }
    .thumb:hover { opacity: 0.8; }
    .thumb.active { opacity: 1; border-color: rgba(255,255,255,0.7); }

    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 9999;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    .variant-label {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5); font-size: 0.75rem; font-weight: 500;
      padding: 0.5rem 1.2rem; border-radius: 9999px;
      letter-spacing: 0.06em; text-transform: uppercase; z-index: 200;
      font-family: var(--sans);
    }
    .variant-nav {
      position: fixed; bottom: 2rem; right: 2rem;
      display: flex; gap: 0.6rem; z-index: 200;
    }
    .variant-nav a {
      background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5); font-size: 0.75rem; font-weight: 500;
      padding: 0.5rem 1rem; border-radius: 9999px;
      letter-spacing: 0.06em; text-transform: uppercase;
      text-decoration: none; font-family: var(--sans); transition: background 0.2s;
    }
    .variant-nav a:hover { background: rgba(255,255,255,0.15); }
    .variant-nav a.active { background: #fff; color: #000; }

    @media (max-width: 768px) {
      #hero { grid-template-columns: 1fr; }
      .hero-right { display: none; }
      .hero-left { padding: 3rem 2rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="#" class="nav-logo">PLOT</a>
    <a href="#" class="nav-cta">Sign up free</a>
  </nav>

  <section id="hero">
    <div class="hero-left animate-in" id="heroLeft">
      <span class="hero-eyebrow">Your film &amp; TV journal</span>
      <h1 class="hero-headline">For the plots<br>that moved you.</h1>
      <p class="hero-sub">A film and TV journal as considered as your taste. Rate it, log it, own it.</p>
      <div class="hero-actions">
        <a href="#" class="hero-btn-primary">Start your journal →</a>
        <a href="#" class="hero-btn-ghost">See how it works</a>
      </div>
      <div class="hero-proof">
        <div class="proof-avatars" id="proofAvatars"></div>
        <p class="proof-text"><strong>Join the waitlist.</strong><br>Launching soon for iOS.</p>
      </div>
    </div>

    <div class="hero-right" id="heroRight">
      <!-- Poster slides injected by JS -->
      <div class="now-playing" id="nowPlaying">
        <span class="np-label">Featuring</span>
        <span class="np-title" id="npTitle"></span>
      </div>
      <div class="thumb-strip" id="thumbStrip"></div>
    </div>
  </section>

  <div class="variant-label">E — Dark Spotlight</div>
  <div class="variant-nav">
    <a href="hero-a.html">A</a>
    <a href="hero-b.html">B</a>
    <a href="hero-c.html">C</a>
    <a href="hero-d.html">D</a>
    <a href="hero-e.html" class="active">E</a>
  </div>

  <script>
    const films = [
      { img: 'images/hero/the-substance.avif',         title: 'The Substance' },
      { img: 'images/hero/gone-girl.jpg',               title: 'Gone Girl' },
      { img: 'images/hero/saltburn.png',                title: 'Saltburn' },
      { img: 'images/hero/parasite.jpg',                title: 'Parasite' },
      { img: 'images/hero/housemaid.jpg',               title: 'The Housemaid' },
    ];

    const thumbImgs = [
      'images/hero/top-gun-maverick.jpg',
      'images/hero/eternity.jpg',
      'images/hero/my-neighbour-totoro.jpg',
    ];

    const heroRight   = document.getElementById('heroRight');
    const npTitle     = document.getElementById('npTitle');
    const nowPlaying  = document.getElementById('nowPlaying');
    const thumbStrip  = document.getElementById('thumbStrip');
    let   current     = 0;
    let   timer;

    // Build poster slides
    const slideEls = films.map((f, i) => {
      const el = document.createElement('div');
      el.className = 'featured-poster' + (i === 0 ? ' active' : '');
      el.style.backgroundImage = `url('${f.img}')`;
      heroRight.insertBefore(el, heroRight.firstChild);
      return el;
    });

    // Build thumbnails
    const thumbEls = films.map((f, i) => {
      const el = document.createElement('div');
      el.className = 'thumb' + (i === 0 ? ' active' : '');
      el.style.backgroundImage = `url('${f.img}')`;
      el.addEventListener('click', () => goTo(i));
      thumbStrip.appendChild(el);
      return el;
    });

    // Proof avatars
    thumbImgs.forEach(src => {
      const el = document.createElement('div');
      el.className = 'proof-avatar';
      el.style.backgroundImage = `url('${src}')`;
      document.getElementById('proofAvatars').appendChild(el);
    });

    function goTo(n) {
      slideEls[current].classList.remove('active');
      thumbEls[current].classList.remove('active');
      nowPlaying.classList.remove('show');

      current = n;
      slideEls[current].classList.add('active');
      thumbEls[current].classList.add('active');

      setTimeout(() => {
        npTitle.textContent = films[current].title;
        nowPlaying.classList.add('show');
      }, 300);

      clearInterval(timer);
      timer = setInterval(() => goTo((current + 1) % films.length), 4500);
    }

    // Init
    npTitle.textContent = films[0].title;
    setTimeout(() => nowPlaying.classList.add('show'), 600);
    timer = setInterval(() => goTo((current + 1) % films.length), 4500);
  </script>
</body>
</html>
