<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLOT — Hero B: Spotlight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:    #f7f7f5;
      --text:  #1a1a1a;
      --muted: #777;
      --serif: 'Playfair Display', Georgia, serif;
      --sans:  'Manrope', system-ui, sans-serif;
      --ease:  cubic-bezier(0.23, 1, 0.32, 1);
    }
    html, body { height: 100%; }
    body { font-family: var(--sans); background: var(--bg); color: var(--text); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 0 2.5rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg);
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .nav-logo { font-family: var(--serif); font-size: 1.4rem; font-weight: 600; color: var(--text); text-decoration: none; }
    .nav-cta {
      display: inline-flex; align-items: center;
      padding: 0.5rem 1.3rem; border-radius: 9999px;
      background: #000; color: #fff;
      font-family: var(--sans); font-size: 0.85rem; font-weight: 500;
      text-decoration: none; transition: background 0.2s;
    }
    .nav-cta:hover { background: #222; }

    /* ── Hero ── */
    #hero {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding-top: 64px;
    }

    /* Left — poster */
    .hero-poster-side {
      position: relative;
      overflow: hidden;
      background: #111;
    }

    .poster-slide {
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 0.9s var(--ease);
    }
    .poster-slide.active { opacity: 1; }

    /* Subtle right-side fade so it blends into white */
    .hero-poster-side::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to right, transparent 60%, var(--bg) 100%);
      pointer-events: none;
    }

    /* Film info overlay — bottom left of poster */
    .now-showing {
      position: absolute; bottom: 3rem; left: 3rem; z-index: 10;
      opacity: 0; transform: translateY(8px);
      transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
    }
    .now-showing.visible { opacity: 1; transform: translateY(0); }
    .now-showing-label {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: rgba(255,255,255,0.5);
      margin-bottom: 0.4rem;
    }
    .now-showing-title {
      font-family: var(--serif); font-size: 1.4rem; font-style: italic;
      color: #fff; line-height: 1.2;
    }

    /* Dots */
    .slide-dots {
      position: absolute; bottom: 3rem; right: 3rem; z-index: 10;
      display: flex; gap: 6px; align-items: center;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,0.35);
      cursor: pointer; transition: background 0.3s, transform 0.3s;
    }
    .dot.active { background: #fff; transform: scale(1.3); }

    /* Right — text */
    .hero-text-side {
      display: flex; flex-direction: column; justify-content: center;
      padding: 5rem 5rem 5rem 4rem;
    }

    .hero-eyebrow {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 2rem;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.7s var(--ease) 0.3s, transform 0.7s var(--ease) 0.3s;
    }

    .hero-headline {
      font-family: var(--serif);
      font-size: clamp(2.8rem, 4.5vw, 4.5rem);
      font-weight: 400; line-height: 0.88;
      letter-spacing: -0.03em; color: var(--text);
      margin-bottom: 2rem;
      opacity: 0; transform: translateY(14px);
      transition: opacity 0.8s var(--ease) 0.5s, transform 0.8s var(--ease) 0.5s;
    }

    .hero-divider {
      width: 40px; height: 2px; background: var(--text);
      margin-bottom: 2rem;
      opacity: 0; transform: scaleX(0); transform-origin: left;
      transition: opacity 0.6s var(--ease) 0.7s, transform 0.6s var(--ease) 0.7s;
    }

    .hero-sub {
      font-size: clamp(0.82rem, 1.2vw, 0.95rem);
      color: var(--muted); font-weight: 400;
      margin-bottom: 3rem; line-height: 1.75;
      max-width: 380px;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.7s var(--ease) 0.9s, transform 0.7s var(--ease) 0.9s;
    }

    .hero-actions {
      display: flex; gap: 1rem; align-items: center;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.7s var(--ease) 1.1s, transform 0.7s var(--ease) 1.1s;
    }

    .hero-btn {
      display: inline-flex; align-items: center;
      padding: 0.85rem 2rem; border-radius: 9999px;
      background: #000; color: #fff;
      font-family: var(--sans); font-size: 0.88rem; font-weight: 500;
      text-decoration: none; transition: background 0.2s;
    }
    .hero-btn:hover { background: #222; }

    .animate-in .hero-eyebrow,
    .animate-in .hero-headline,
    .animate-in .hero-sub,
    .animate-in .hero-actions {
      opacity: 1; transform: translateY(0);
    }
    .animate-in .hero-divider { opacity: 1; transform: scaleX(1); }

    /* ── Grain ── */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 9999;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    /* ── Variant nav ── */
    .variant-label {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.07); backdrop-filter: blur(12px);
      border: 1px solid rgba(0,0,0,0.08);
      color: rgba(0,0,0,0.5); font-size: 0.75rem; font-weight: 500;
      padding: 0.5rem 1.2rem; border-radius: 9999px;
      letter-spacing: 0.06em; text-transform: uppercase; z-index: 200;
      font-family: var(--sans);
    }
    .variant-nav {
      position: fixed; bottom: 2rem; right: 2rem;
      display: flex; gap: 0.6rem; z-index: 200;
    }
    .variant-nav a {
      background: rgba(0,0,0,0.07); backdrop-filter: blur(12px);
      border: 1px solid rgba(0,0,0,0.08);
      color: rgba(0,0,0,0.5); font-size: 0.75rem; font-weight: 500;
      padding: 0.5rem 1rem; border-radius: 9999px;
      letter-spacing: 0.06em; text-transform: uppercase;
      text-decoration: none; font-family: var(--sans); transition: background 0.2s;
    }
    .variant-nav a:hover { background: rgba(0,0,0,0.12); }
    .variant-nav a.active { background: #000; color: #fff; }

    @media (max-width: 768px) {
      #hero { grid-template-columns: 1fr; }
      .hero-poster-side { height: 50vh; }
      .hero-poster-side::after { background: linear-gradient(to bottom, transparent 60%, var(--bg) 100%); }
      .hero-text-side { padding: 3rem 2rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="#" class="nav-logo">PLOT</a>
    <a href="#" class="nav-cta">Sign up</a>
  </nav>

  <section id="hero">
    <div class="hero-poster-side" id="posterSide">
      <!-- Slides injected by JS -->
      <div class="now-showing" id="nowShowing">
        <p class="now-showing-label">Now showing</p>
        <p class="now-showing-title" id="nowShowingTitle"></p>
      </div>
      <div class="slide-dots" id="slideDots"></div>
    </div>

    <div class="hero-text-side" id="heroContent">
      <span class="hero-eyebrow">Your film &amp; TV journal</span>
      <h1 class="hero-headline">For the plots<br>that moved you.</h1>
      <div class="hero-divider"></div>
      <p class="hero-sub">A film and TV journal as considered as your taste.</p>
      <div class="hero-actions">
        <a href="#" class="hero-btn">Start your journal →</a>
      </div>
    </div>
  </section>

  <div class="variant-label">B — Spotlight</div>
  <div class="variant-nav">
    <a href="hero-a.html">A</a>
    <a href="hero-b.html" class="active">B</a>
    <a href="hero-c.html">C</a>
  </div>

  <script>
    const slides = [
      { img: 'images/hero/the-substance.avif',         title: 'The Substance' },
      { img: 'images/hero/gone-girl.jpg',               title: 'Gone Girl' },
      { img: 'images/hero/parasite.jpg',                title: 'Parasite' },
      { img: 'images/hero/saltburn.png',                title: 'Saltburn' },
      { img: 'images/hero/the-wolf-of-wall-street.png', title: 'The Wolf of Wall Street' },
    ];

    const posterSide    = document.getElementById('posterSide');
    const dotsContainer = document.getElementById('slideDots');
    const nowShowingEl  = document.getElementById('nowShowing');
    const nowShowingTitle = document.getElementById('nowShowingTitle');
    let current = 0;
    let timer;

    // Build slides
    const slideEls = slides.map((s, i) => {
      const el = document.createElement('div');
      el.className = 'poster-slide' + (i === 0 ? ' active' : '');
      el.style.backgroundImage = `url('${s.img}')`;
      posterSide.insertBefore(el, posterSide.firstChild);
      return el;
    });

    // Build dots
    const dotEls = slides.map((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      d.addEventListener('click', () => goTo(i));
      dotsContainer.appendChild(d);
      return d;
    });

    function goTo(n) {
      slideEls[current].classList.remove('active');
      dotEls[current].classList.remove('active');
      nowShowingEl.classList.remove('visible');

      current = n;
      slideEls[current].classList.add('active');
      dotEls[current].classList.add('active');

      setTimeout(() => {
        nowShowingTitle.textContent = slides[current].title;
        nowShowingEl.classList.add('visible');
      }, 400);

      clearInterval(timer);
      timer = setInterval(() => goTo((current + 1) % slides.length), 4000);
    }

    // Init
    nowShowingTitle.textContent = slides[0].title;
    setTimeout(() => nowShowingEl.classList.add('visible'), 600);
    timer = setInterval(() => goTo((current + 1) % slides.length), 4000);

    // Text animate-in
    setTimeout(() => document.getElementById('heroContent').classList.add('animate-in'), 200);
  </script>
</body>
</html>
