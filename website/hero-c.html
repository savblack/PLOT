<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLOT — Hero C: Stack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:    #f7f7f5;
      --text:  #1a1a1a;
      --muted: #777;
      --serif: 'Playfair Display', Georgia, serif;
      --sans:  'Manrope', system-ui, sans-serif;
      --ease:  cubic-bezier(0.23, 1, 0.32, 1);
    }
    html, body { height: 100%; }
    body { font-family: var(--sans); background: var(--bg); color: var(--text); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    /* ── Nav ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 0 2.5rem; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg); border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .nav-logo { font-family: var(--serif); font-size: 1.4rem; font-weight: 600; color: var(--text); text-decoration: none; }
    .nav-cta {
      display: inline-flex; align-items: center;
      padding: 0.5rem 1.3rem; border-radius: 9999px;
      background: #000; color: #fff;
      font-family: var(--sans); font-size: 0.85rem; font-weight: 500;
      text-decoration: none; transition: background 0.2s;
    }
    .nav-cta:hover { background: #222; }

    /* ── Hero ── */
    #hero {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 7rem 2rem 4rem;
      gap: 4rem;
    }

    /* ── Text block ── */
    .hero-text { text-align: center; max-width: 600px; }

    .hero-eyebrow {
      display: inline-block;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 1.5rem;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.7s var(--ease) 0.2s, transform 0.7s var(--ease) 0.2s;
    }
    .hero-headline {
      font-family: var(--serif);
      font-size: clamp(2.8rem, 6vw, 5rem);
      font-weight: 400; line-height: 0.85;
      letter-spacing: -0.03em; color: var(--text);
      margin-bottom: 1.5rem;
      opacity: 0; transform: translateY(14px);
      transition: opacity 0.8s var(--ease) 0.4s, transform 0.8s var(--ease) 0.4s;
    }
    .hero-sub {
      font-size: clamp(0.78rem, 1.4vw, 0.9rem);
      color: var(--muted); font-weight: 400;
      margin-bottom: 2.2rem; line-height: 1.75;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.7s var(--ease) 0.6s, transform 0.7s var(--ease) 0.6s;
    }
    .hero-btn {
      display: inline-flex; align-items: center;
      padding: 0.85rem 2rem; border-radius: 9999px;
      background: #000; color: #fff;
      font-family: var(--sans); font-size: 0.88rem; font-weight: 500;
      text-decoration: none; transition: background 0.2s;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.7s var(--ease) 0.8s, transform 0.7s var(--ease) 0.8s, background 0.2s;
    }
    .hero-btn:hover { background: #222; }

    .animate-in .hero-eyebrow,
    .animate-in .hero-headline,
    .animate-in .hero-sub,
    .animate-in .hero-btn { opacity: 1; transform: translateY(0); }

    /* ── Poster stack ── */
    .poster-stack-wrap {
      position: relative;
      width: 100%;
      max-width: 700px;
      height: 320px;
      display: flex; align-items: center; justify-content: center;
    }

    .stack-poster {
      position: absolute;
      width: 180px; height: 270px;
      border-radius: 10px;
      background-size: cover; background-position: center;
      box-shadow: 0 12px 40px rgba(0,0,0,0.14);
      border: 1px solid rgba(0,0,0,0.06);
      opacity: 0;
      /* Each card has its own final transform set via JS */
    }

    /* ── Grain ── */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 9999;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    /* ── Variant nav ── */
    .variant-label {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.07); backdrop-filter: blur(12px);
      border: 1px solid rgba(0,0,0,0.08);
      color: rgba(0,0,0,0.5); font-size: 0.75rem; font-weight: 500;
      padding: 0.5rem 1.2rem; border-radius: 9999px;
      letter-spacing: 0.06em; text-transform: uppercase; z-index: 200;
      font-family: var(--sans);
    }
    .variant-nav {
      position: fixed; bottom: 2rem; right: 2rem;
      display: flex; gap: 0.6rem; z-index: 200;
    }
    .variant-nav a {
      background: rgba(0,0,0,0.07); backdrop-filter: blur(12px);
      border: 1px solid rgba(0,0,0,0.08);
      color: rgba(0,0,0,0.5); font-size: 0.75rem; font-weight: 500;
      padding: 0.5rem 1rem; border-radius: 9999px;
      letter-spacing: 0.06em; text-transform: uppercase;
      text-decoration: none; font-family: var(--sans); transition: background 0.2s;
    }
    .variant-nav a:hover { background: rgba(0,0,0,0.12); }
    .variant-nav a.active { background: #000; color: #fff; }
  </style>
</head>
<body>

  <nav>
    <a href="#" class="nav-logo">PLOT</a>
    <a href="#" class="nav-cta">Sign up</a>
  </nav>

  <section id="hero">
    <div class="hero-text animate-in" id="heroText">
      <span class="hero-eyebrow">Your film &amp; TV journal</span>
      <h1 class="hero-headline">For the plots<br>that moved you.</h1>
      <p class="hero-sub">A film and TV journal as considered as your taste.</p>
      <a href="#" class="hero-btn">Start your journal →</a>
    </div>

    <div class="poster-stack-wrap" id="stackWrap"></div>
  </section>

  <div class="variant-label">C — Stack Reveal</div>
  <div class="variant-nav">
    <a href="hero-a.html">A</a>
    <a href="hero-b.html">B</a>
    <a href="hero-c.html" class="active">C</a>
  </div>

  <script>
    const images = [
      { img: 'images/hero/top-gun-maverick.jpg' },
      { img: 'images/hero/gone-girl.jpg' },
      { img: 'images/hero/parasite.jpg' },
      { img: 'images/hero/saltburn.png' },
      { img: 'images/hero/the-substance.avif' },
      { img: 'images/hero/housemaid.jpg' },
      { img: 'images/hero/eternity.jpg' },
    ];

    // Fan config: each card's final resting [x offset, rotation, z-index, y-offset]
    const fanConfig = [
      { x: -270, rot: -18, z: 1, y: 20  },
      { x: -170, rot: -11, z: 2, y: 5   },
      { x:  -75, rot:  -5, z: 3, y: -5  },
      { x:    0, rot:   0, z: 4, y: -10 },  // center
      { x:   75, rot:   5, z: 3, y: -5  },
      { x:  170, rot:  11, z: 2, y: 5   },
      { x:  270, rot:  18, z: 1, y: 20  },
    ];

    const wrap = document.getElementById('stackWrap');

    const cards = images.map((item, i) => {
      const card = document.createElement('div');
      card.className = 'stack-poster';
      card.style.backgroundImage = `url('${item.img}')`;
      card.style.zIndex = fanConfig[i].z;
      // Start position: all stacked at center, no rotation
      card.style.transform = `translateX(0px) translateY(0px) rotate(0deg)`;
      card.style.transition = 'none';
      wrap.appendChild(card);
      return card;
    });

    // Animate in: first fade all in from center stack, then fan out
    setTimeout(() => {
      // Step 1: fade in stacked
      cards.forEach((card, i) => {
        card.style.transition = `opacity 0.4s ease ${i * 60}ms`;
        card.style.opacity = '1';
      });
    }, 300);

    setTimeout(() => {
      // Step 2: fan out
      cards.forEach((card, i) => {
        const cfg = fanConfig[i];
        card.style.transition = `transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) ${i * 40}ms`;
        card.style.transform = `translateX(${cfg.x}px) translateY(${cfg.y}px) rotate(${cfg.rot}deg)`;
      });
    }, 900);

    // Hover: lift card on hover
    cards.forEach((card, i) => {
      const cfg = fanConfig[i];
      card.addEventListener('mouseenter', () => {
        card.style.transition = 'transform 0.3s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.3s ease';
        card.style.transform  = `translateX(${cfg.x}px) translateY(${cfg.y - 16}px) rotate(${cfg.rot}deg)`;
        card.style.boxShadow  = '0 24px 60px rgba(0,0,0,0.22)';
        card.style.zIndex     = '10';
      });
      card.addEventListener('mouseleave', () => {
        card.style.transition = 'transform 0.4s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.4s ease, z-index 0s 0.4s';
        card.style.transform  = `translateX(${cfg.x}px) translateY(${cfg.y}px) rotate(${cfg.rot}deg)`;
        card.style.boxShadow  = '0 12px 40px rgba(0,0,0,0.14)';
        card.style.zIndex     = cfg.z;
      });
    });
  </script>
</body>
</html>
