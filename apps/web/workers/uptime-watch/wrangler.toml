# Watches that app.theplot.tv, the TMDB proxy and the edge functions answer,
# and (with STRIPE_READ_KEY) that Stripe is delivering billing events to Plot,
# and emails (plus, optionally, opens a GitHub `incident` issue) when one
# stops, then again when it recovers. See src/index.js for what each check does.
#
# Deploy (once; a Cloudflare login with Workers access is needed):
#   cd apps/web/workers/uptime-watch
#   npx wrangler kv namespace create uptime-watch-state   # paste the id below
#   npx wrangler secret put RESEND_API_KEY     # same key backup-heartbeat uses
#   npx wrangler secret put WATCH_TOKEN        # any long random string; gates the manual endpoint
#   npx wrangler secret put SUPABASE_PUBLISHABLE_KEY   # optional; production publishable key
#   npx wrangler secret put GITHUB_TOKEN       # optional; fine-grained, savblack/PLOT, Issues: read/write
#   npx wrangler secret put STRIPE_READ_KEY    # optional; turns on the Stripe webhook check. A restricted
#                                              # live key with Read on Events and on Webhook
#                                              # Endpoints and nothing else. Never the secret key.
#   npx wrangler deploy
#
# The hourly signed-in check (src/signin.js) needs two more secrets, both for
# PLOT Staging, never production:
#   npx wrangler secret put SIGNIN_PUBLISHABLE_KEY   # Staging publishable key (VITE_SUPABASE_ANON_KEY in .env)
#   security find-generic-password -s com.theplot.staging.signin-watch.password -w \
#     | npx wrangler secret put SIGNIN_PASSWORD      # the watcher account's password, kept in Keychain
# Without them the check reports "not configured" and, after BLIND_HOURS, says so by email.
#
# The production signed-in check needs one secret and a seeded session:
#   npx wrangler secret put SIGNIN_PROD_PUBLISHABLE_KEY   # production publishable key (it ships in the app bundle)
#   node scripts/signin-watch-seed.mjs --yes-production [--create]   # from the repo root; stores the session in STATE
#
# Check it by hand:
#   curl -H "x-watch-token: <token>" https://uptime-watch.<subdomain>.workers.dev
#   curl -H "x-watch-token: <token>" "https://uptime-watch.<subdomain>.workers.dev?test-email=1"
#   curl -H "x-watch-token: <token>" "https://uptime-watch.<subdomain>.workers.dev?check=signin"
# Watch live runs:  npx wrangler tail

name = "uptime-watch"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Every 5 minutes for the uptime checks, and once an hour (at :23, away from
# the 5-minute marks) for the signed-in check. SIGNIN_CRON below must match
# the second entry exactly: it is how a firing knows which watch it is.
# Cloudflare cron fires on time, unlike GitHub's schedule.
[triggers]
crons = ["*/5 * * * *", "23 * * * *"]

# Last known state, so an outage sends one email rather than one per run.
# Namespace "uptime-watch-state", created 2026-11-11.
[[kv_namespaces]]
binding = "STATE"
id = "a8899df7a9734917a4710f48167351c0"

# The TMDB check goes through this binding, not the public URL: a Worker's
# fetch to another workers.dev Worker on the same account returns 404.
[[services]]
binding = "TMDB_PROXY"
service = "tmdb-proxy"

[vars]
APP_URL = "https://app.theplot.tv/"
APP_ORIGIN = "https://app.theplot.tv"
TMDB_PROXY_URL = "https://tmdb-proxy.sav-black.workers.dev"
SUPABASE_URL = "https://mkegtssedjyqldysvzga.supabase.co"

# Two reads 30 seconds apart before a check counts as broken: a single
# dropped request is not an outage.
ATTEMPTS = "2"
WAIT_SECONDS = "30"

# While an outage lasts, remind every 6 hours rather than every run.
REMIND_HOURS = "6"

# If Cloudflare refuses every attempt for this long, say once that the watcher
# is blind.
BLIND_HOURS = "12"

GITHUB_REPO = "savblack/PLOT"

# Stripe check: an event still undelivered this long after it was created
# counts as failed. Stripe normally delivers within seconds; this leaves room
# for its first quick retries before alerting.
STRIPE_GRACE_MINUTES = "15"
# How far back to look for undelivered events. 15 days is as long as Stripe
# lets you resend one, so an alarm never outlasts the fix that clears it.
STRIPE_LOOKBACK_DAYS = "15"
# The endpoint Stripe should be sending to. Unset means SUPABASE_URL's
# stripe-webhook, which is production's.
# STRIPE_WEBHOOK_URL = ""

# Signed-in check (src/signin.js). PLOT Staging, with a test account that
# exists only for this watcher (created 2026-11-11). See docs/ops/monitoring.md.
SIGNIN_CRON = "23 * * * *"
SIGNIN_SUPABASE_URL = "https://uzrhfivnhdcfieuaxzip.supabase.co"
SIGNIN_EMAIL = "plot-signin-watch@example.invalid"

# The same check against production. Production sign-in requires a captcha,
# so this account has no password: it renews a stored session each run
# (`signin-prod-session` in STATE), seeded by scripts/signin-watch-seed.mjs.
SIGNIN_PROD_SUPABASE_URL = "https://mkegtssedjyqldysvzga.supabase.co"
SIGNIN_PROD_EMAIL = "plot-signin-watch@example.invalid"

# Same destination and sender as backup-heartbeat and whats-on-watch.
ALERT_EMAIL = "sav.black@outlook.com"
ALERT_FROM = "Plot <hello@theplot.tv>"
