# Cloudflare Worker that fronts the Supabase `tmdb-proxy` Edge Function and adds
# real, distributed per-IP rate limiting (the in-isolate limiter in the Edge
# Function was ineffective: Supabase spreads a burst across isolates, each with
# its own empty counter — 400 concurrent requests all returned 200).
#
# Deploy:  cd workers/tmdb-proxy && npx wrangler deploy
#   Requires a Cloudflare API token with "Workers Scripts: Edit" (the DNS-scoped
#   CLOUDFLARE_API_TOKEN in the repo .env is NOT sufficient). Set CLOUDFLARE_API_TOKEN
#   and CLOUDFLARE_ACCOUNT_ID for the deploy, or run `npx wrangler login`.
#
# After deploy, point the app at the Worker:
#   Vercel env  VITE_TMDB_PROXY_URL = https://tmdb-proxy.<subdomain>.workers.dev
#   then redeploy the app.

name = "tmdb-proxy"
main = "src/index.js"
compatibility_date = "2025-06-01"
# Sentry's Cloudflare SDK needs AsyncLocalStorage.
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
# The real Supabase Edge Function the Worker forwards to.
UPSTREAM = "https://mkegtssedjyqldysvzga.supabase.co/functions/v1/tmdb-proxy"
# Set `UPSTREAM_SHARED_SECRET` as a Worker secret and set the identical
# `TMDB_PROXY_SHARED_SECRET` in Supabase before deploying either side.
#
# SENTRY_DSN is a Worker secret, not a var. A DSN carries no read access and
# Sentry's browser SDK does embed it in client code — but this Worker is
# server-side, so nothing forces it into the open, and a published DSN is an
# open invitation to spam the ingest endpoint and burn the free-tier event
# quota. Set it per environment:
#   npx wrangler secret put SENTRY_DSN
#   npx wrangler secret put SENTRY_DSN --env staging
# If it is unset the SDK initialises with an undefined DSN and quietly no-ops,
# so error reporting fails silently — set it as part of any first deploy.

# Distributed rate limit: 100 requests per 10s per client IP, enforced at
# Cloudflare's edge (consistent across requests, unlike the per-isolate limiter).
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 100, period = 10 }

# ── Staging ───────────────────────────────────────────────────────────────
# Local dev points at the Staging Supabase project (uzrhfiv…), but there was
# only ever one Worker and it forwards to PRODUCTION's Edge Function. A staging
# anon key sent to the production function is rejected — Supabase answers
# `401 UNAUTHORIZED_LEGACY_JWT`, whose wording suggests an expired or outdated
# key and sends you looking for a key to rotate. It is not: the key is fine and
# belongs to the wrong project. Every TMDB surface is empty in local dev until
# this Worker exists, which also blocks seeding any data through the UI.
#
# Deploy (one-off, needs a Workers-scoped token or `npx wrangler login`):
#   cd apps/web/workers/tmdb-proxy
#   npx wrangler secret put UPSTREAM_SHARED_SECRET --env staging
#     ^ paste the Staging project's TMDB_PROXY_SHARED_SECRET, from
#       Supabase → uzrhfivnhdcfieuaxzip → Edge Functions → Secrets.
#       It is already set there; it must match on both sides.
#   npx wrangler deploy --env staging
#
# Then point local dev at it (these are URLs, not secrets):
#   .env             VITE_TMDB_PROXY_URL        = https://tmdb-proxy-staging.<subdomain>.workers.dev
#   apps/mobile/.env EXPO_PUBLIC_TMDB_PROXY_URL = https://tmdb-proxy-staging.<subdomain>.workers.dev
#
# Production is untouched by any of this — it keeps using the default env.
[env.staging]
name = "tmdb-proxy-staging"
workers_dev = true

[env.staging.vars]
UPSTREAM = "https://uzrhfivnhdcfieuaxzip.supabase.co/functions/v1/tmdb-proxy"
# SENTRY_DSN is a secret here too — see the note in [vars] above.

# Same shape as production; a separate namespace so staging traffic can't eat
# into real users' rate budget.
[[env.staging.ratelimits]]
name = "RL"
namespace_id = "1002"
simple = { limit = 100, period = 10 }
