# Cloudflare Worker that renders the share-link OG cards.
#
# NOT DEPLOYED. The deployment was deleted on 2026-09-18 because a render costs
# ~25ms of CPU against the free plan's 10ms ceiling, so every card 503'd. This
# config is kept with the source; README.md has why, and what bringing it back
# takes (Workers Paid first, then the secret, then the deploy).
#
# If that deploy ever errors about "a deploy configuration file at
# ../../.wrangler/deploy/config.json", clear it and retry:
#   rm -f apps/web/.wrangler/deploy/config.json
# A local `vite build` in apps/web writes that redirect for the Pages app, and
# wrangler finds it by walking up from this directory. It is gitignored and the
# next build recreates it, so clearing it costs nothing. It cannot deploy the
# wrong Worker — wrangler refuses on the base-path mismatch — it only blocks.

name = "plot-og"
main = "src/index.js"
compatibility_date = "2025-06-01"
# workers-og pulls in resvg/yoga WASM + Buffer; nodejs_compat covers the shims.
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Distributed edge admission control for CPU-heavy Satori rendering.
[[ratelimits]]
name = "RL"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[vars]
# Where the .ttf brand fonts are served from (the Worker host doesn't serve
# /fonts). Points at the deployed app by default.
FONT_BASE = "https://app.theplot.tv"

# TMDB_API_KEY is a SECRET, not a var — set it with:
#   npx wrangler secret put TMDB_API_KEY
