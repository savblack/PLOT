# Cloudflare Worker that renders the share-link OG cards (moved off Vercel).
# See README.md for the full deploy + cutover + rollback steps.
#
# Deploy:
#   cd apps/web/workers/og
#   npm install
#   npx wrangler secret put TMDB_API_KEY   # same value as the Vercel env
#   npx wrangler deploy
#
# After deploy the Worker is live at https://plot-og.<subdomain>.workers.dev —
# VERIFY it renders each card variant, THEN point the app at it via env:
#   Vercel  OG_BASE_URL       = https://plot-og.<subdomain>.workers.dev
#   Vercel  VITE_OG_BASE_URL  = https://plot-og.<subdomain>.workers.dev
#   then redeploy the app. Unset both to instantly roll back to /api/og.

name = "plot-og"
main = "src/index.js"
compatibility_date = "2025-06-01"
# workers-og pulls in resvg/yoga WASM + Buffer; nodejs_compat covers the shims.
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Distributed edge admission control for CPU-heavy Satori rendering.
[[ratelimits]]
name = "RL"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[vars]
# Where the .ttf brand fonts are served from (the Worker host doesn't serve
# /fonts). Points at the deployed app by default.
FONT_BASE = "https://app.theplot.tv"

# TMDB_API_KEY and SENTRY_DSN are SECRETS, not vars — set them with:
#   npx wrangler secret put TMDB_API_KEY
#   npx wrangler secret put SENTRY_DSN
#
# A DSN carries no read access and Sentry's browser SDK does embed it in client
# code, but this Worker is server-side, so nothing forces it into the open and a
# published DSN invites junk events against the free-tier quota. If SENTRY_DSN is
# unset the SDK initialises with an undefined DSN and quietly no-ops, so error
# reporting fails silently — set it as part of any first deploy.
