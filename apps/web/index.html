    <!-- React cannot paint until its entry graph has downloaded and executed.
         Keep the existing Plot loader in the initial document so slow devices
         get useful pixels immediately; React replaces it on its first commit. -->
    <style data-critical="app-boot-loader">
      html, body, #root { height: 100%; margin: 0; }
      body { background: #f8f2ea; }
      [data-theme="dark"] body { background: #0c0c0c; }
      .app-boot-loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .initial-wordmark {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 0.28em;
        width: fit-content;
        color: #292924;
        font: 700 30px/1 system-ui, sans-serif;
        letter-spacing: -0.045em;
      }
      [data-theme="dark"] .initial-wordmark { color: #f8f2ea; }
      .initial-wordmark::after {
        content: '';
        display: block;
        width: 100%;
        height: 0.14em;
        border-radius: 999px;
        background: #ff88c8;
      }
      @media (max-width: 720px) {
        .initial-wordmark { font-size: 26px; }
      }
      /* @palettes:start — generated by `npm run tokens:build`. */
      [data-palette="sage"][data-theme="light"] body { background: #E3EACA; }
