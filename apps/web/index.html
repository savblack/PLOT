<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="/boot/startup-guard.js" data-cfasync="false"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Plot | Movie & TV Tracker</title>
    <link rel="preload" href="/fonts/Gabarito-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/DMSans-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="description" content="The beautiful way to track what you watch. Log, rate, and share your movie and TV taste." />
    <meta property="og:title" content="Plot | Movie &amp; TV Tracker" />
    <meta property="og:description" content="The beautiful way to track what you watch. Log, rate, and share your movie and TV taste." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.theplot.tv" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plot | Movie &amp; TV Tracker" />
    <meta name="twitter:description" content="The beautiful way to track what you watch." />
    <meta property="og:image" content="https://app.theplot.tv/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="https://app.theplot.tv/og-image.png" />
    <meta name="theme-color" content="#f8f8f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)" />
    <script src="/boot/theme.js" data-cfasync="false"></script>
    <!-- React cannot paint until its entry graph has downloaded and executed.
         Keep the existing Plot loader in the initial document so slow devices
         get useful pixels immediately; React replaces it on its first commit. -->
    <style data-critical="app-boot-loader">
      html, body, #root { height: 100%; margin: 0; }
      body { background: #f8f2ea; }
      [data-theme="dark"] body { background: #0c0c0c; }
      .app-boot-loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .initial-wordmark {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 0.28em;
        width: fit-content;
        color: #292924;
        font: 700 30px/1 system-ui, sans-serif;
        letter-spacing: -0.045em;
      }
      [data-theme="dark"] .initial-wordmark { color: #f8f2ea; }
      .initial-wordmark::after {
        content: '';
        display: block;
        width: 100%;
        height: 0.14em;
        border-radius: 999px;
        background: #ff88c8;
      }
      @media (max-width: 720px) {
        .initial-wordmark { font-size: 26px; }
      }
      /* @palettes:start — generated by `npm run tokens:build`. */
      [data-palette="sage"][data-theme="light"] body { background: #E3EACA; }
      [data-palette="sage"][data-theme="light"] .initial-wordmark { color: #20261A; }
      [data-palette="sage"][data-theme="light"] .initial-wordmark::after { background: #BFDA5E; }
      [data-palette="sage"][data-theme="dark"] body { background: #0E1A11; }
      [data-palette="sage"][data-theme="dark"] .initial-wordmark { color: #E8F0DE; }
      [data-palette="sage"][data-theme="dark"] .initial-wordmark::after { background: #BFDA5E; }
      [data-palette="mist"][data-theme="light"] body { background: #E1E8EE; }
      [data-palette="mist"][data-theme="light"] .initial-wordmark { color: #1B232A; }
      [data-palette="mist"][data-theme="light"] .initial-wordmark::after { background: #A8CBEE; }
      [data-palette="mist"][data-theme="dark"] body { background: #0D141C; }
      [data-palette="mist"][data-theme="dark"] .initial-wordmark { color: #E5EDF4; }
      [data-palette="mist"][data-theme="dark"] .initial-wordmark::after { background: #A8CBEE; }
      [data-palette="blush"][data-theme="light"] body { background: #F6DCE3; }
      [data-palette="blush"][data-theme="light"] .initial-wordmark { color: #2B1A20; }
      [data-palette="blush"][data-theme="light"] .initial-wordmark::after { background: #8FD6CB; }
      [data-palette="blush"][data-theme="dark"] body { background: #240E17; }
      [data-palette="blush"][data-theme="dark"] .initial-wordmark { color: #F9E6EC; }
      [data-palette="blush"][data-theme="dark"] .initial-wordmark::after { background: #8FD6CB; }
      [data-palette="plum"][data-theme="light"] body { background: #E7E0F2; }
      [data-palette="plum"][data-theme="light"] .initial-wordmark { color: #221B2E; }
      [data-palette="plum"][data-theme="light"] .initial-wordmark::after { background: #F2C04F; }
      [data-palette="plum"][data-theme="dark"] body { background: #16101F; }
      [data-palette="plum"][data-theme="dark"] .initial-wordmark { color: #F0EAF8; }
      [data-palette="plum"][data-theme="dark"] .initial-wordmark::after { background: #F2C04F; }
      [data-palette="ink"][data-theme="light"] body { background: #FAFAF8; }
      [data-palette="ink"][data-theme="light"] .initial-wordmark { color: #111111; }
      [data-palette="ink"][data-theme="light"] .initial-wordmark::after { background: #111111; }
      [data-palette="ink"][data-theme="dark"] body { background: #080808; }
      [data-palette="ink"][data-theme="dark"] .initial-wordmark { color: #FFFFFF; }
      [data-palette="ink"][data-theme="dark"] .initial-wordmark::after { background: #FFFFFF; }
      /* @palettes:end */
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-loader" data-initial-app-loader>
        <span class="initial-wordmark" role="img" aria-label="Loading Plot">plot</span>
      </div>
    </div>
    <script type="module" async src="/src/main.jsx"></script>
  </body>
</html>
