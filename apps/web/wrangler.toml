# Config for the app.theplot.tv Cloudflare Pages project (see
# docs/cloudflare-pages-migration.md). Pages has been dashboard-configured
# (git-connected build) up to now; this file adds ONLY the Ratelimit binding
# the Pages Functions in functions/*.js need (functions/_lib/rateLimit.js).
#
# Moved here from the repo root (2026-07-28): Cloudflare's "v2 root directory
# strategy" build-config auto-detection started picking up a repo-root
# wrangler.toml for the UNRELATED plot-site (theplot.tv) Pages project too,
# whose scoped root directory is apps/website — this file's
# pages_build_output_dir resolved outside that project's directory and broke
# its builds ("build output directory is outside of the repository"). Living
# under apps/web/ keeps it out of plot-site's discovery entirely.
#
# If Cloudflare Pages doesn't pick this file up for the plot-app project from
# its new location (project root directory is the repo root, not apps/web/),
# add the same binding manually instead:
#   Pages project → Settings → Functions → Bindings → Add → Rate Limiting →
#   Variable name "RL", same limit/period as below. Either path produces the
# same env.RL binding the functions call.
name = "plot-app"
pages_build_output_dir = "dist"
compatibility_date = "2025-06-01"

# 60 requests per 10s per client IP on /u/*, /list/*, /save — generous enough
# for real users (a profile page does a handful of sub-requests) but enough
# to blunt scripted scraping/enumeration and TMDB-quota abuse.
[[ratelimits]]
name = "RL"
namespace_id = "1003"
simple = { limit = 60, period = 10 }
