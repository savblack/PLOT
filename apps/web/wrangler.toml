# Config for the app.theplot.tv Cloudflare Pages project.
#
# READ THIS BEFORE ADDING ANYTHING HERE: Cloudflare Pages never reads this file.
# The project's build root directory is the repo root, and Pages only looks for
# a wrangler.toml there. Nothing below has any effect on a deployment.
#
# It is NOT dead, though: @cloudflare/vite-plugin reads it during `vite dev`.
# With `name` and `compatibility_date` set and no `main`, the plugin treats it
# as an assets-only Worker and serves the local app through Cloudflare's asset
# handler. So this file shapes local development only, never production.
#
# It ended up here on 2026-07-28: at the repo root, Cloudflare's "v2 root
# directory strategy" auto-detection picked it up for the UNRELATED plot-site
# (theplot.tv) project, whose root directory is apps/website, and this file's
# pages_build_output_dir resolved outside that project ("build output directory
# is outside of the repository"), breaking its builds. Moving it under apps/web/
# fixed plot-site — and silently stopped it applying to this project too.
#
# It carried a `[[ratelimits]]` RL binding until 2026-09-06 on the assumption
# that one of those two locations would work. Neither did. The binding was never
# bound: the project config has no bindings at all, and 100 requests in 6.3s
# against a 60-per-10s limit drew zero 429s. `rateLimited()` opened with
# `if (!env.RL) return false`, so it failed open in silence for the whole time,
# and the helper has now been deleted rather than left claiming a protection it
# never provided.
#
# Per-IP limiting for /u/*, /list/*, /save now lives in a zone-level WAF
# rate-limiting rule, which needs no binding and is unaffected by build config.
#
# `name` below matches no Pages project (they are `plot` and `plot-site`). It is
# left as-is deliberately: correcting it risks Pages one day picking this file
# up and applying pages_build_output_dir relative to the repo root, which is the
# exact failure described above.
name = "plot-app"
pages_build_output_dir = "dist"
compatibility_date = "2025-06-01"

# Serve index.html for any path that isn't a built asset, so client-side routes
# survive a hard load / refresh under `vite dev`. Without this the asset handler
# 404s them and the app renders a blank page — you only ever noticed on routes
# with no in-app link to reach them by, i.e. /design-system.
#
# public/_redirects carries `/*  /index.html  200` for the same purpose in
# production, but the asset handler rejects that rule as an infinite loop
# ("Parsed 0 valid redirect rules") because html_handling rewrites /index.html
# back to /. not_found_handling is the mechanism that actually works.
[assets]
not_found_handling = "single-page-application"
