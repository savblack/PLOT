<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLOT — Skeleton Loaders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:             #09090B;
      --surface:        #18181B;
      --surface-raised: #27272A;
      --surface-sunken: #111113;
      --text-primary:   #FAFAFA;
      --text-secondary: #A1A1AA;
      --text-muted:     #52525B;
      --border:         rgba(255,255,255,0.07);
      --border-strong:  rgba(255,255,255,0.14);
      --accent:         #F06A88;
      --radius-xs:  6px;
      --radius-sm:  10px;
      --radius-md:  16px;
      --radius-lg:  24px;
      --radius-pill:9999px;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-sans:  'Manrope', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #060608;
      color: var(--text-primary);
      font-family: var(--font-sans);
      padding: 2.5rem 2rem 4rem;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    header { margin-bottom: 2.5rem; }
    header h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }
    header p { font-size: 0.82rem; color: var(--text-muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.75rem;
    }

    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .card-label {
      padding: 0.65rem 1rem;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .card-label::before {
      content: '';
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    /* ── Shimmer ── */
    @keyframes shimmer {
      0%   { background-position: -600px 0; }
      100% { background-position:  600px 0; }
    }

    .sk {
      background: linear-gradient(
        90deg,
        var(--surface-sunken) 0%,
        var(--surface)        50%,
        var(--surface-sunken) 100%
      );
      background-size: 1200px 100%;
      animation: shimmer 1.6s ease-in-out infinite;
      border-radius: var(--radius-xs);
      flex-shrink: 0;
    }

    /* ── Utilities ── */
    .row   { display: flex; align-items: center; }
    .col   { display: flex; flex-direction: column; }
    .flex1 { flex: 1; }
    .gap2  { gap: 0.5rem; }
    .gap3  { gap: 0.75rem; }
    .bb    { border-bottom: 1px solid var(--border); }

    /* ─────────────────────────────
       1. DISCOVER
    ───────────────────────────── */
    .discover-hero.sk { width: 100%; height: 190px; border-radius: 0; }

    .discover-section-label {
      padding: 1rem 1rem 0.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .discover-rail {
      display: flex;
      gap: 0.75rem;
      padding: 0.75rem 1rem 1rem;
      overflow: hidden;
    }

    .poster-card { flex-shrink: 0; width: 110px; }
    .poster-card .poster.sk {
      width: 110px;
      aspect-ratio: 2/3;
      border-radius: var(--radius-md);
      margin-bottom: 0.4rem;
    }

    .chart-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 1rem;
    }
    .chart-thumb.sk { width: 38px; height: 54px; border-radius: var(--radius-sm); flex-shrink: 0; }

    /* ─────────────────────────────
       2. WATCHLIST
    ───────────────────────────── */
    .wl-chips {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      overflow: hidden;
    }

    .wl-section { padding: 0.75rem 1rem 0; }
    .wl-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.65rem;
      margin-top: 0.65rem;
    }
    .wl-card .poster.sk { width: 100%; aspect-ratio: 2/3; border-radius: var(--radius-md); margin-bottom: 0.35rem; }

    /* ─────────────────────────────
       3. EPG
    ───────────────────────────── */
    .epg-wrap { padding: 0.75rem 1rem; }
    .epg-dates { display: flex; gap: 0.5rem; margin-bottom: 1rem; overflow: hidden; }
    .epg-channel-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
    }
    .epg-blocks { display: flex; gap: 0.4rem; flex: 1; overflow: hidden; }
    .epg-block.sk { height: 34px; border-radius: var(--radius-sm); flex-shrink: 0; }

    /* ─────────────────────────────
       4. MEDIA PANEL
    ───────────────────────────── */
    .panel-body { padding: 1rem 1rem 1.5rem; }
    .panel-actions { display: flex; gap: 0.5rem; margin: 1rem 0 1.5rem; }
    .panel-action.sk { flex: 1; height: 38px; border-radius: var(--radius-sm); }
    .panel-overview { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 1.5rem; }
    .ep-row {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
    }

    /* ─────────────────────────────
       5. HISTORY
    ───────────────────────────── */
    .hist-chips { display: flex; gap: 0.5rem; padding: 0.75rem 1rem; }
    .hist-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.55rem 1rem; }
    .hist-thumb.sk { width: 44px; height: 60px; border-radius: var(--radius-sm); flex-shrink: 0; }

    /* ─────────────────────────────
       6. CALENDAR
    ───────────────────────────── */
    .cal-row {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.45rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .cal-icon.sk { width: 30px; height: 30px; border-radius: var(--radius-sm); flex-shrink: 0; }

    /* ─────────────────────────────
       7. MY LISTS
    ───────────────────────────── */
    .lists-section { margin-bottom: 0.5rem; }
    .lists-header {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.6rem 1rem 0.4rem;
    }
    .lists-rail {
      display: flex; gap: 0.6rem;
      padding: 0.25rem 1rem 0.75rem;
      overflow: hidden;
    }
    .lists-card { flex-shrink: 0; width: 82px; }
    .lists-card .poster.sk {
      width: 82px; aspect-ratio: 2/3;
      border-radius: var(--radius-sm);
      margin-bottom: 0.3rem;
    }

    /* ─────────────────────────────
       PLOTLOADER
    ───────────────────────────── */
    .plotloader-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
    }

    @keyframes ob-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <h1>Skeleton Loaders</h1>
    <p>All loading states used across the PLOT app</p>
  </header>

  <div class="grid">

    <!-- ── 1. Discover ── -->
    <div class="card">
      <div class="card-label">Discover — home tab</div>
      <div class="discover-hero sk"></div>

      <div class="discover-section-label">
        <div class="sk" style="width:78px;height:9px;"></div>
        <div class="sk" style="width:138px;height:18px;"></div>
      </div>
      <div class="discover-rail">
        <div class="poster-card"><div class="poster sk"></div><div class="sk" style="width:70%;height:10px;"></div></div>
        <div class="poster-card"><div class="poster sk"></div><div class="sk" style="width:80%;height:10px;"></div></div>
        <div class="poster-card"><div class="poster sk"></div><div class="sk" style="width:65%;height:10px;"></div></div>
        <div class="poster-card"><div class="poster sk"></div><div class="sk" style="width:75%;height:10px;"></div></div>
      </div>

      <div class="discover-section-label">
        <div class="sk" style="width:90px;height:9px;"></div>
        <div class="sk" style="width:168px;height:18px;"></div>
      </div>
      <div class="chart-row"><div class="sk" style="width:24px;height:14px;border-radius:3px;"></div><div class="chart-thumb sk"></div><div class="col flex1 gap2"><div class="sk" style="width:55%;height:13px;"></div><div class="sk" style="width:70px;height:10px;"></div></div></div>
      <div class="chart-row"><div class="sk" style="width:24px;height:14px;border-radius:3px;"></div><div class="chart-thumb sk"></div><div class="col flex1 gap2"><div class="sk" style="width:45%;height:13px;"></div><div class="sk" style="width:60px;height:10px;"></div></div></div>
      <div class="chart-row"><div class="sk" style="width:24px;height:14px;border-radius:3px;"></div><div class="chart-thumb sk"></div><div class="col flex1 gap2"><div class="sk" style="width:60%;height:13px;"></div><div class="sk" style="width:75px;height:10px;"></div></div></div>
      <div style="padding-bottom:0.75rem;"></div>
    </div>

    <!-- ── 2. Watchlist ── -->
    <div class="card">
      <div class="card-label">Watchlist</div>
      <div class="wl-chips">
        <div class="sk" style="width:72px;height:28px;border-radius:9999px;"></div>
        <div class="sk" style="width:60px;height:28px;border-radius:9999px;"></div>
        <div class="sk" style="width:80px;height:28px;border-radius:9999px;"></div>
        <div class="sk" style="width:68px;height:28px;border-radius:9999px;"></div>
      </div>
      <div class="wl-section">
        <div class="sk" style="width:88px;height:13px;"></div>
        <div class="wl-grid">
          <div class="wl-card"><div class="poster sk"></div><div class="sk" style="width:70%;height:10px;"></div></div>
          <div class="wl-card"><div class="poster sk"></div><div class="sk" style="width:80%;height:10px;"></div></div>
          <div class="wl-card"><div class="poster sk"></div><div class="sk" style="width:65%;height:10px;"></div></div>
        </div>
      </div>
      <div class="wl-section" style="padding-top:1rem;">
        <div class="sk" style="width:58px;height:13px;"></div>
        <div class="wl-grid">
          <div class="wl-card"><div class="poster sk"></div><div class="sk" style="width:75%;height:10px;"></div></div>
          <div class="wl-card"><div class="poster sk"></div><div class="sk" style="width:60%;height:10px;"></div></div>
          <div class="wl-card"><div class="poster sk"></div><div class="sk" style="width:70%;height:10px;"></div></div>
          <div class="wl-card"><div class="poster sk"></div><div class="sk" style="width:85%;height:10px;"></div></div>
          <div class="wl-card"><div class="poster sk"></div><div class="sk" style="width:55%;height:10px;"></div></div>
          <div class="wl-card"><div class="poster sk"></div><div class="sk" style="width:65%;height:10px;"></div></div>
        </div>
      </div>
      <div style="padding-bottom:1rem;"></div>
    </div>

    <!-- ── 3. EPG / Guide ── -->
    <div class="card">
      <div class="card-label">EPG / Guide</div>
      <div class="epg-wrap">
        <div class="epg-dates">
          <div class="sk" style="width:52px;height:30px;border-radius:9999px;"></div>
          <div class="sk" style="width:60px;height:30px;border-radius:9999px;"></div>
          <div class="sk" style="width:48px;height:30px;border-radius:9999px;"></div>
          <div class="sk" style="width:56px;height:30px;border-radius:9999px;"></div>
          <div class="sk" style="width:52px;height:30px;border-radius:9999px;"></div>
        </div>
        <div class="epg-channel-row"><div class="sk" style="width:70px;height:13px;flex-shrink:0;"></div><div class="epg-blocks"><div class="epg-block sk" style="width:160px;"></div><div class="epg-block sk" style="width:100px;"></div><div class="epg-block sk" style="width:200px;"></div></div></div>
        <div class="epg-channel-row"><div class="sk" style="width:70px;height:13px;flex-shrink:0;"></div><div class="epg-blocks"><div class="epg-block sk" style="width:80px;"></div><div class="epg-block sk" style="width:220px;"></div><div class="epg-block sk" style="width:120px;"></div></div></div>
        <div class="epg-channel-row"><div class="sk" style="width:70px;height:13px;flex-shrink:0;"></div><div class="epg-blocks"><div class="epg-block sk" style="width:200px;"></div><div class="epg-block sk" style="width:100px;"></div><div class="epg-block sk" style="width:90px;"></div></div></div>
        <div class="epg-channel-row"><div class="sk" style="width:70px;height:13px;flex-shrink:0;"></div><div class="epg-blocks"><div class="epg-block sk" style="width:120px;"></div><div class="epg-block sk" style="width:180px;"></div><div class="epg-block sk" style="width:140px;"></div></div></div>
        <div class="epg-channel-row"><div class="sk" style="width:70px;height:13px;flex-shrink:0;"></div><div class="epg-blocks"><div class="epg-block sk" style="width:90px;"></div><div class="epg-block sk" style="width:160px;"></div><div class="epg-block sk" style="width:220px;"></div></div></div>
        <div class="epg-channel-row" style="border-bottom:none;"><div class="sk" style="width:70px;height:13px;flex-shrink:0;"></div><div class="epg-blocks"><div class="epg-block sk" style="width:140px;"></div><div class="epg-block sk" style="width:100px;"></div><div class="epg-block sk" style="width:180px;"></div></div></div>
      </div>
    </div>

    <!-- ── 4. Media Panel ── -->
    <div class="card">
      <div class="card-label">Media Panel</div>
      <div class="sk" style="width:100%;height:160px;border-radius:0;"></div>
      <div class="panel-body">
        <div class="sk" style="width:65%;height:22px;margin-bottom:0.6rem;"></div>
        <div class="row gap2">
          <div class="sk" style="width:48px;height:20px;border-radius:9999px;"></div>
          <div class="sk" style="width:64px;height:20px;border-radius:9999px;"></div>
          <div class="sk" style="width:80px;height:20px;border-radius:9999px;"></div>
        </div>
        <div class="panel-actions">
          <div class="panel-action sk"></div>
          <div class="panel-action sk"></div>
          <div class="panel-action sk"></div>
        </div>
        <div class="panel-overview">
          <div class="sk" style="width:100%;height:11px;"></div>
          <div class="sk" style="width:90%;height:11px;"></div>
          <div class="sk" style="width:72%;height:11px;"></div>
        </div>
        <div class="sk" style="width:78px;height:13px;margin-bottom:0.75rem;"></div>
        <div class="ep-row"><div class="sk" style="width:28px;height:28px;border-radius:50%;flex-shrink:0;"></div><div class="col flex1 gap2"><div class="sk" style="width:50%;height:12px;"></div><div class="sk" style="width:70px;height:10px;"></div></div></div>
        <div class="ep-row"><div class="sk" style="width:28px;height:28px;border-radius:50%;flex-shrink:0;"></div><div class="col flex1 gap2"><div class="sk" style="width:60%;height:12px;"></div><div class="sk" style="width:65px;height:10px;"></div></div></div>
        <div class="ep-row" style="border-bottom:none;"><div class="sk" style="width:28px;height:28px;border-radius:50%;flex-shrink:0;"></div><div class="col flex1 gap2"><div class="sk" style="width:45%;height:12px;"></div><div class="sk" style="width:80px;height:10px;"></div></div></div>
      </div>
    </div>

    <!-- ── 5. History ── -->
    <div class="card">
      <div class="card-label">History</div>
      <div class="hist-chips">
        <div class="sk" style="width:50px;height:28px;border-radius:9999px;"></div>
        <div class="sk" style="width:62px;height:28px;border-radius:9999px;"></div>
        <div class="sk" style="width:42px;height:28px;border-radius:9999px;"></div>
      </div>
      <div style="padding:0.4rem 1rem 0.3rem;"><div class="sk" style="width:118px;height:13px;"></div></div>
      <div class="hist-row"><div class="hist-thumb sk"></div><div class="col flex1 gap2"><div class="sk" style="width:55%;height:13px;"></div><div class="sk" style="width:88px;height:10px;"></div></div></div>
      <div class="hist-row"><div class="hist-thumb sk"></div><div class="col flex1 gap2"><div class="sk" style="width:45%;height:13px;"></div><div class="sk" style="width:76px;height:10px;"></div></div></div>
      <div class="hist-row"><div class="hist-thumb sk"></div><div class="col flex1 gap2"><div class="sk" style="width:62%;height:13px;"></div><div class="sk" style="width:92px;height:10px;"></div></div></div>
      <div class="hist-row"><div class="hist-thumb sk"></div><div class="col flex1 gap2"><div class="sk" style="width:40%;height:13px;"></div><div class="sk" style="width:80px;height:10px;"></div></div></div>
      <div class="hist-row" style="border:none;"><div class="hist-thumb sk"></div><div class="col flex1 gap2"><div class="sk" style="width:50%;height:13px;"></div><div class="sk" style="width:68px;height:10px;"></div></div></div>
      <div style="padding-bottom:0.5rem;"></div>
    </div>

    <!-- ── 6. Calendar ── -->
    <div class="card">
      <div class="card-label">Calendar — day panel</div>
      <div style="padding:0.5rem 0 0.25rem;">
        <div class="cal-row"><div class="cal-icon sk"></div><div class="col flex1 gap2"><div class="sk" style="width:60%;height:12px;"></div><div class="sk" style="width:64px;height:10px;"></div></div></div>
        <div class="cal-row"><div class="cal-icon sk"></div><div class="col flex1 gap2"><div class="sk" style="width:45%;height:12px;"></div><div class="sk" style="width:58px;height:10px;"></div></div></div>
        <div class="cal-row" style="border:none;"><div class="cal-icon sk"></div><div class="col flex1 gap2"><div class="sk" style="width:55%;height:12px;"></div><div class="sk" style="width:70px;height:10px;"></div></div></div>
      </div>
      <div style="padding-bottom:0.5rem;"></div>
    </div>

    <!-- ── 7. My Lists ── -->
    <div class="card">
      <div class="card-label">My Lists</div>
      <div class="lists-section">
        <div class="lists-header">
          <div class="sk" style="width:24px;height:24px;border-radius:6px;"></div>
          <div class="sk" style="width:140px;height:16px;"></div>
        </div>
        <div class="lists-rail">
          <div class="lists-card"><div class="poster sk"></div><div class="sk" style="width:75%;height:9px;"></div></div>
          <div class="lists-card"><div class="poster sk"></div><div class="sk" style="width:60%;height:9px;"></div></div>
          <div class="lists-card"><div class="poster sk"></div><div class="sk" style="width:80%;height:9px;"></div></div>
          <div class="lists-card"><div class="poster sk"></div><div class="sk" style="width:70%;height:9px;"></div></div>
          <div class="lists-card"><div class="poster sk"></div><div class="sk" style="width:65%;height:9px;"></div></div>
        </div>
      </div>
      <div class="lists-section" style="border-top:1px solid var(--border);">
        <div class="lists-header">
          <div class="sk" style="width:24px;height:24px;border-radius:6px;"></div>
          <div class="sk" style="width:120px;height:16px;"></div>
        </div>
        <div class="lists-rail">
          <div class="lists-card"><div class="poster sk"></div><div class="sk" style="width:70%;height:9px;"></div></div>
          <div class="lists-card"><div class="poster sk"></div><div class="sk" style="width:80%;height:9px;"></div></div>
          <div class="lists-card"><div class="poster sk"></div><div class="sk" style="width:55%;height:9px;"></div></div>
          <div class="lists-card"><div class="poster sk"></div><div class="sk" style="width:75%;height:9px;"></div></div>
          <div class="lists-card"><div class="poster sk"></div><div class="sk" style="width:60%;height:9px;"></div></div>
        </div>
      </div>
    </div>

    <!-- ── 8. PLOT Loader (route transitions) ── -->
    <div class="card">
      <div class="card-label">PLOT Loader — route transitions</div>
      <div class="plotloader-wrap">
        <svg
          style="width:90px;height:auto;color:#FAFAFA;"
          viewBox="0 -12 707 302"
          fill="none"
