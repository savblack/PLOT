# Pull-request and main validation runs here, so a private repository does not
# spend GitHub Actions minutes on it. Scheduled jobs (backups, data refreshes,
# marketing reconcile, the write-path check) run on GitHub Actions in
# .github/workflows, which carry the failure alerts. Copies of them used to sit
# here behind a `task` parameter but no CircleCI schedule ever triggered them;
# removed 2026-11-12 so there is one home. See docs/ops/actions-minutes.md.
version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.17.1
    resource_class: medium

commands:
  setup_pnpm:
    steps:
      - run:
          name: Set up pnpm 10.6.3
          command: |
            sudo corepack enable
            corepack prepare pnpm@10.6.3 --activate
            pnpm config set store-dir ~/.pnpm-store
      - restore_cache:
          keys:
            - pnpm-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store

jobs:
  check:
    docker:
      # The browsers variant supplies Playwright's system dependencies. Pin the
      # Node version used by production CI while accepting image fixes.
      - image: cimg/node:22.17.1-browsers
    resource_class: medium
    retention:
      caches: 7d
    environment:
      # CI only proves that the app builds and renders locally. These values are
      # deliberately inert, so browser-safe production config need not be copied
      # into a second CI provider.
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-not-a-key
      VITE_TMDB_PROXY_URL: https://placeholder.invalid
      VITE_PUBLIC_POSTHOG_PROJECT_TOKEN: placeholder
      VITE_PUBLIC_POSTHOG_HOST: https://placeholder.invalid
    steps:
      # The secret scan needs the PR merge-base (or previous main commit), so a
      # shallow/blobless checkout is not sufficient.
      - checkout:
          method: full

      - run:
          name: Scan changed lines for secret-shaped strings
          command: |
            git fetch --no-tags --quiet origin main
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              base_sha="$(git rev-parse HEAD^)"
            else
              base_sha="$(git merge-base origin/main HEAD)"
            fi
            ./scripts/scan-secrets.sh "$base_sha" HEAD

      - run:
          name: Decide how much of the suite this diff needs
          command: |
            labels=""
            if command -v gh >/dev/null 2>&1 && [ -n "${GH_TOKEN:-${GITHUB_TOKEN:-}}" ] && [ -n "${CIRCLE_PULL_REQUEST:-}" ]; then
              number="$(basename "$CIRCLE_PULL_REQUEST")"
              labels="$(gh pr view "$number" --repo savblack/PLOT --json labels --jq '[.labels[].name] | join(",")' || true)"
            fi
            message="$(git log -1 --format=%B)"
            node scripts/ci-tier.mjs \
              --branch "${CIRCLE_BRANCH:-}" \
              --labels "$labels" \
              --commit-message "$message" \
              --write-env "$BASH_ENV"
            # BASH_ENV is picked up by the next step. Source it here too so
            # a docs-only diff can stop this job before the install.
            # shellcheck disable=SC1090
            [ -n "${BASH_ENV:-}" ] && . "$BASH_ENV"
            if [ "${PLOT_CI_TIER:-fast}" = none ]; then
              echo "Docs-only diff. Stopping before install."
              circleci step halt
            fi

      - run:
          name: Set up pnpm 10.6.3
          command: |
            sudo corepack enable
            corepack prepare pnpm@10.6.3 --activate
            pnpm config set store-dir ~/.pnpm-store
            pnpm --version

      - run:
          name: Set up Deno 2
          command: |
            curl -fsSL https://deno.land/install.sh | sh -s v2.9.5
            echo 'export DENO_INSTALL="$HOME/.deno"' >> "$BASH_ENV"
            echo 'export PATH="$DENO_INSTALL/bin:$PATH"' >> "$BASH_ENV"
            "$HOME/.deno/bin/deno" --version

      - run:
          name: Typecheck edge functions
          command: pnpm run edge:check

      - restore_cache:
          keys:
            - pnpm-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}

      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile

      - save_cache:
          key: pnpm-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store

      - run:
          name: Lint
          command: pnpm run lint

      - run:
          name: Check generated and shared sources
          command: |
            pnpm run footer:check
            pnpm run csp:check
            pnpm run changelog:check
            pnpm run skills:check
            pnpm run tokens:check
            pnpm run colors:check
            pnpm run tokens:marketing
            pnpm run emails:check

      - run:
          name: Check migrations and cross-platform contracts
          command: |
            pnpm run migrations:check
            pnpm run db:block-clause
            pnpm run copy:check
            pnpm run core:check

      - run:
          name: Broadcast importer tests
          command: python3 -m unittest discover -s scripts/guide -p 'test_*.py'

      - run:
          name: JavaScript unit tests
          command: |
            pnpm run test:unit
            pnpm run test:website
            pnpm run test:workers
            pnpm run test:marketing

      - run:
          name: Build
          command: pnpm run build

      - run:
          name: Build Storybooks
          command: |
            if [ "${PLOT_CI_TIER:-fast}" != full ]; then
              echo "Tier ${PLOT_CI_TIER:-fast}: skipping Storybook."
              exit 0
            fi
            # The web build emits --stats-json so Chromatic can use TurboSnap.
            pnpm --filter @plot/web run build-storybook:stats
            if [ "${PLOT_CI_WEBSITE_STORYBOOK:-0}" = 1 ]; then
              pnpm --filter @plot/website-storybook run build-storybook
            fi
            if [ "${PLOT_CI_MOBILE_STORYBOOK:-0}" = 1 ]; then
              pnpm --filter @plot/mobile run build-storybook
            fi

      - run:
          name: Chromatic visual snapshots
          command: |
            # Visual diffs do not fail the build (--exit-zero-on-changes).
            # A story that throws still does. main records the baseline.
            # A pull request uploads only when the diff is visual, or the
            # commit says [visual].
            if [ "${PLOT_CI_CHROMATIC:-0}" != 1 ]; then
              echo "This diff does not need Chromatic."
              exit 0
            fi
            if [ -z "${CHROMATIC_PROJECT_TOKEN:-}" ]; then
              echo "CHROMATIC_PROJECT_TOKEN is not set; skipping visual snapshots."
              exit 0
            fi
            pnpm --filter @plot/web run chromatic

      - run:
          name: Check mobile
          command: |
            pnpm run mobile:deps
            pnpm --filter @plot/mobile run typecheck

      - restore_cache:
          keys:
            - playwright-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}

      - run:
          name: Install Playwright Chromium
          command: |
            if [ "${PLOT_CI_TIER:-fast}" != full ]; then
              echo "Tier ${PLOT_CI_TIER:-fast}: skipping Playwright."
              exit 0
            fi
            pnpm --filter @plot/web exec playwright install chromium

      - save_cache:
          key: playwright-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.cache/ms-playwright

      - run:
          name: Storybook interaction and accessibility tests
          command: |
            if [ "${PLOT_CI_TIER:-fast}" != full ]; then
              echo "Tier ${PLOT_CI_TIER:-fast}: skipping Storybook interaction tests."
              exit 0
            fi
            pnpm run test-storybook:web

      - run:
          name: Smoke tests
          command: |
            if [ "${PLOT_CI_TIER:-fast}" != full ]; then
              echo "Tier ${PLOT_CI_TIER:-fast}: skipping smoke tests."
              exit 0
            fi
            pnpm --filter @plot/web exec playwright test

workflows:
  build-and-test:
    jobs:
      - check
