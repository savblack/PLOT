# Workspace members. This replaces the "workspaces" field in package.json, which
# pnpm does not read. Keep the two in sync if you ever migrate back.
#
# marketing/ is deliberately absent, exactly as it was under npm: it has a
# package.json for its scripts but declares no dependencies, so making it a
# workspace member would only add an empty node_modules to install.
packages:
  - packages/core
  - packages/ui
  - apps/web
  - apps/mobile
  - apps/website

# pnpm 10 refuses to run dependency install/postinstall scripts unless they are
# named here. These two genuinely need theirs — both fetch a platform binary at
# install time, and silently skipping it breaks the build rather than the install:
#   esbuild  - the bundler binary behind vite
#   workerd  - the Cloudflare runtime behind wrangler / @cloudflare/vite-plugin
onlyBuiltDependencies:
  - esbuild
  - workerd

# core-js's postinstall only prints a funding message. Listing it here keeps it
# blocked without re-warning on every install.
ignoredBuiltDependencies:
  - core-js

# react-native 0.86.3 depends on react-devtools-core, which depends on
# shell-quote ^1.6.1. The lockfile had 1.10.0. That release is
# CVE-2026-102422 (GHSA-pqg4-j6r4-53mv): quote() can run shell input when a
# line terminator follows a comment token. Fixed in 1.11.0. 1.12.0 is the
# current release inside the range react-devtools-core already allows.
overrides:
  "shell-quote@<1.11.0": 1.12.0
  # micromatch 4.0.8 (metro-file-map and @expo/metro-file-map) depends on
  # braces ^3.0.3. 3.0.3 is the latest release and it is CVE-2026-93687
  # (GHSA-vfj7-8cjw-p6xm): a deeply nested pattern overflows the stack.
  # Upstream has no patched version. @dieub/braces-depth-guard@3.0.3-pn.0
  # is that release plus a nesting cap of 100, which throws instead.
  braces: "npm:@dieub/braces-depth-guard@3.0.3-pn.0"
